      return Object.keys(c).length >= 2;
    }
    var rank = function (w) { var r = STICKY_RANK[byId[w].cls]; return r === undefined ? 3 : r; };
    function place(v) {
      pos[v] = list.length; list.push(v);
      var sticky = [], fork = isFork(v);
      succ[v].forEach(function (w) {
        if (--indeg[w] !== 0) return;
        if (fork || STICKY_RANK[byId[w].cls] !== undefined) sticky.push(w); else ready.push(w);
      });
      sticky.sort(function (a, b) { return rank(a) - rank(b) || byId[a].order - byId[b].order; }).forEach(place);
    }
    d.nodes.forEach(function (n) { if (!indeg[n.id]) ready.push(n.id); });
    while (ready.length) {
      ready.sort(function (a, b) { return byId[a].order - byId[b].order; });
      place(ready.shift());
    }
    // остатки циклов, не помеченных как возвраты, — в порядке строк
    d.nodes.filter(function (n) { return pos[n.id] === undefined; })
      .sort(function (a, b) { return a.order - b.order; }).forEach(function (n) { pos[n.id] = list.length; list.push(n.id); });
    flowCache = { pos: pos, list: list };
    return flowCache;
  }
  function flowPos(id) { return flowOrder().pos[id]; }

  var outlineCache = null;
  function outline() {
    if (outlineCache) return outlineCache;
    var d = S.data, fwd = {};
    d.nodes.forEach(function (n) { fwd[n.id] = []; });
    d.links.forEach(function (l) { if (!l.ret) fwd[l.from].push(l.to); });
    var pos = flowOrder().pos;
    var byPos = function (a, b) { return pos[a] - pos[b]; };

    function branches(n) {   // варианты одного условия — одна ветка (после растворения «И» их может быть несколько)
      var map = {}, list = [];
      n.gate.options.forEach(function (o) {
        var k = o.cond;
        if (!map[k]) { map[k] = { cond: o.cond, tone: o.tone, def: false, chosen: false, ret: true, to: [] }; list.push(map[k]); }
        var b = map[k]; b.to.push(o.to); b.def = b.def || !!o.def; b.chosen = b.chosen || !!o.chosen; b.ret = b.ret && o.ret;
      });
      var g = n.gate;
      list.forEach(function (b) { b.main = g.decided ? b.chosen : g.hasDefault ? b.def : false; });
      return list;
    }
    // Достижимость вперёд в пределах U; mainLine — на развилках только по основной ветке
    function reach(starts, U, stop, mainLine) {
      var s = {}, q = [];
      starts.forEach(function (x) { if (U[x] && x !== stop && !s[x]) { s[x] = 1; q.push(x); } });
      while (q.length) {
        var v = q.shift(), n = byId[v], next = fwd[v];
        if (mainLine && n.gate) {
          var bs = branches(n).filter(function (b) { return !b.ret; }), mains = bs.filter(function (b) { return b.main; });
          next = [].concat.apply([], (mains.length ? mains : bs).map(function (b) { return b.to; }));
        }
        next.forEach(function (w) { if (!s[w] && U[w] && w !== stop) { s[w] = 1; q.push(w); } });
      }
      return s;
    }
    var placed = {};
    function seq(U, level) {
      var out = [];
      Object.keys(U).sort(byPos).forEach(function (id) {
        if (placed[id]) return;
        placed[id] = true;
        var n = byId[id], it = { id: id, level: level };
        out.push(it);
        if (n.gate) it.block = block(n, U, level);
        if (n.cycleMembers) {
          var MU = {}; n.cycleMembers.forEach(function (m) { if (!placed[m]) MU[m] = 1; });
          it.cycle = seq(MU, level + 1);
        }
      });
      return out;
    }
    function block(n, U, level) {
      var bs = branches(n), notes = [], cols = null, merge = null;
      bs.forEach(function (b) { b.to = b.to.filter(function (t) { return U[t] || b.ret; }); });
      var fw = bs.filter(function (b) { return !b.ret && b.to.length; });
      if (fw.length >= 2) {
        var R = fw.map(function (b) { return reach(b.to, U, null, true); });
        merge = Object.keys(R[0]).filter(function (id) { return R.every(function (r) { return r[id]; }); }).sort(byPos)[0] || null;
        var mains = fw.filter(function (b) { return b.main; });
        var full = {}; if (!merge) mains.forEach(function (b) { var r = reach(b.to, U, null, false); for (var k in r) full[k] = 1; });
        cols = [];
        fw.forEach(function (b) {
          if (!merge && b.main) { cols.push({ b: b, cont: true, items: [] }); return; }
          var r = reach(b.to, U, merge, false), R2 = {};
          Object.keys(r).forEach(function (id) { if (!placed[id] && !full[id]) R2[id] = 1; });
          if (!Object.keys(R2).length && !merge) { notes.push({ b: b, kind: 'jump' }); return; }
          cols.push({ b: b, items: seq(R2, level + 1) });
        });
        if (!cols.some(function (c) { return !c.cont; })) cols = null;
      }
      bs.forEach(function (b) { if (b.ret) notes.push({ b: b, kind: 'ret' }); });
      return { gate: n.id, kind: n.gate.kind, cols: cols, merge: merge, notes: notes };
    }
    var MAIN = {}; d.nodes.forEach(function (n) { if (!n.cycleHost) MAIN[n.id] = 1; });
    var items = seq(MAIN, 0);
    // шаги циклов, чей хозяин не попал в структуру (на всякий случай)
    d.nodes.forEach(function (n) { if (!placed[n.id]) { placed[n.id] = true; items.push({ id: n.id, level: 0 }); } });
    outlineCache = { items: items, pos: pos };
    return outlineCache;
  }

  /**
   * Готовность к старту считает сервер (ModelService.readiness_): одно правило для
   * сводки, карточки и еженедельных писем. Состояния: done · work · ready · waiting.
   */
  function isDone(n) { return n.status === 'done' || n.status === 'na'; }
  function readiness(n) { return n.ready || { state: isDone(n) ? 'done' : 'waiting', missing: [] }; }

  /**
   * Окончание шага «сейчас» — то, с чем сравнивается базовый план. То же правило, что
   * при фиксации плана (BaselineService.gs): у завершённого — факт, у остальных — прогноз;
   * у шага цикла — окно процесса-хозяина, даже если сам шаг уже завершён.
   */
  function endNow(n) {
    if (n.cycleHost) return n.wEnd || null;
    return (n.status === 'done' && n.factEnd ? n.factEnd : n.wEnd) || null;
  }
  /**
   * Сдвиг от базового плана, дней (+ — позже плана). Нет плана, дат или шаг
   * «Не применяется» — null.
   */
  function slip(n) {
    if (!S.data.meta.baseline || !n.blEnd || n.status === 'na') return null;
    var end = endNow(n);
    return end ? D.diff(n.blEnd, end) : null;
  }
  function slipHtml(n, short) {
    var v = slip(n);
    if (v == null || v === 0) return '';
    return '<span class="slip-tag ' + (v > 0 ? 'late' : 'ahead') + '" title="Окончание ' + (v > 0 ? 'позже' : 'раньше') +
      ' базового плана v' + S.data.meta.baseline.version + ' на ' + App.days(v) + '">' + (v > 0 ? '+' : '−') + Math.abs(v) + (short ? '' : ' дн') + '</span>';
  }

  /**
   * Ожидание внешней стороны (ведомство): кого ждём, когда подали, когда ждать ответ.
   * state: 'plan' — ещё не подано · 'wait' — подано, ждём · 'over' — срок ответа прошёл ·
   *        'done' — получено · 'na' — шаг «Не применяется». open — ожидание ещё идёт или впереди.
   */
  function ext(n) {
    if (!n.extWait) return null;
    var due = n.submitted && n.responseDays != null ? D.add(n.submitted, n.responseDays) : null;
    var st = n.status === 'na' ? 'na' : n.status === 'done' ? 'done' : !n.submitted ? 'plan' : due && due < S.asOf ? 'over' : 'wait';
    return { who: n.extWait, submitted: n.submitted, days: n.responseDays, due: due, state: st,
      open: st !== 'done' && st !== 'na', left: due ? D.diff(S.asOf, due) : null };
  }
  function extText(n) {
    var e = ext(n); if (!e) return '';
    if (e.state === 'na') return 'не применяется';
    if (e.state === 'done') return 'ответ получен' + (n.factEnd ? ' ' + D.fmtS(n.factEnd) : '');
    if (e.state === 'plan') return 'не подано' + (n.wStart ? ' · подача по плану ' + D.fmtS(n.wStart) : '');
    if (!e.due) return 'подано ' + D.fmtS(e.submitted) + ' · срок ответа не задан';
    return e.state === 'over' ? 'ответ просрочен на ' + App.days(-e.left) : 'ответ до ' + D.fmtS(e.due) + (e.left === 0 ? ' · сегодня' : ' · через ' + App.days(e.left));
  }

  /**
   * Выбранная ветка развилки — как её записал бы сервер: «Решение» сопоставляется с
   * условиями веток без учёта регистра и пробелов (RelationshipService.gates_).
   * Решение не совпало ни с одной веткой — null.
   */
  function chosenCond(n) {
    var o = n.gate && n.gate.options.filter(function (x) { return x.chosen; })[0];
    return o ? o.cond : null;
  }

  /** Люди роли из листа «Команда» */
  function people(role) { return (S.data.team || []).filter(function (p) { return p.role === role; }); }

  /** Процесс, результатом которого является документ: ближайший процесс выше по связям */
  var prodCache = {};
  function producer(n) {
    if (n.cls !== 'doc') return null;
    if (prodCache[n.id] !== undefined) return prodCache[n.id];
    var seen = {}, q = [n.id], res = null;
    seen[n.id] = 1;
    while (q.length && !res) {
      var v = q.shift();
      (ins[v] || []).forEach(function (l) {
        if (res || l.ret || seen[l.from]) return;
        seen[l.from] = 1;
        if (byId[l.from].cls === 'work') res = l.from; else q.push(l.from);
      });
    }
    prodCache[n.id] = res;
    return res;
  }
  /** Ключевые результаты: столбец «Ключевой», если он есть; иначе — официальные документы */
  function isKey(n) { return S.data.meta.keyColumn ? !!n.key : n.variant === 'official'; }

  var GATE_KIND = { check: 'проверка', fork: 'развилка', cycle: 'в цикле' };
  var CLS_TITLE = { work: 'Процессы', doc: 'Документы', gate: 'Шлюзы', event: 'Начало/конец', store: 'Хранилища', other: 'Прочее' };
  function classesPresent() {
    return ['work', 'doc', 'gate', 'event', 'store', 'other'].filter(function (c) {
      return S.data.nodes.some(function (n) { return n.cls === c; });
    });
  }
  /** Короткая подпись окна дат узла (для мини-строк) */
  function winText(n) {
    var iv = interval(n, 'mix');
    return iv ? D.fmtS(iv[0]) + ' – ' + D.fmtS(iv[1]) : '';
  }
  function kindIcon(n) {
    var extra = n.variant === 'official' ? ' off' : n.variant === 'end' ? ' end' : '';
    if (n.gate) extra += ' g-' + n.gate.kind;
    return '<i class="kind ' + n.cls + extra + '" title="' + App.esc(n.type || '') + '"></i>';
  }
  /** Откуда статус, если он не записан в ячейке «Статус» (для подсказок); из ячейки — '' */
  function statusSrcText(n) {
    if (n.statusSrc === 'scenario') return 'По решению развилки: шаг на невыбранной ветке. В ячейке «Статус» пусто';
    if (n.statusSrc === 'derived') return S.data.fields.status ? 'Ячейка «Статус» пустая — статус выведен из фактических дат' : 'Столбца «Статус» нет — статус выведен из фактических дат';
    return '';
  }
  function statusHtml(n) {
    var t = time(n), src = statusSrcText(n);
    return '<span class="st ' + n.status + (src ? ' derived' : '') + '"' + (src ? ' title="' + App.esc(src) + '"' : '') + '>' +
      App.esc(n.statusLabel) + '</span>' + (t.late ? ' <span class="late-tag">' + App.esc(lateText(n)) + '</span>' : '');
  }
  function short(s, k) { s = String(s || ''); return s.length > k ? s.slice(0, k - 1) + '…' : s; }
  function flagsHtml(n) {
    var s = '';
    if (n.optional) s += '<i title="Опционально">опц</i>';
    if (n.cyclic) s += '<i title="Цикличность">цикл</i>';
    if (n.openQuestion) s += '<i class="q" title="' + App.esc(n.openQuestion) + '">?</i>';
    if (S.data.meta.keyColumn && n.key) s += '<i class="key" title="Ключевой результат">★</i>';
    if (n.cycleHost) s += '<i class="cy" title="Повторяется внутри ' + App.esc(n.cycleHost) + (n.cycleSrc === 'inferred' ? ' (определено по связям)' : '') + '">⟳ ' + App.esc(n.cycleHost) + '</i>';
    if (n.cycleMembers) s += '<i class="cy" title="Внутри повторяется ' + n.cycleMembers.length + ' шагов">⟳ цикл ' + n.cycleMembers.length + '</i>';
    if (n.gate) s += '<i class="gk ' + n.gate.kind + '">' + GATE_KIND[n.gate.kind] + '</i>';
    if (n.extWait) s += '<i class="ext" title="Ждём ответа: ' + App.esc(n.extWait) + '">ждём ' + App.esc(short(n.extWait, 18)) + '</i>';
    if (!n.inScenario) s += '<i class="off" title="' + App.esc(n.scenarioNote || '') + '">вне сценария</i>';
    return s ? '<span class="ico-flags">' + s + '</span>' : '';
  }

  return {
    index: index, touch: touch, node: node, ins: function (id) { return ins[id] || []; }, outs: function (id) { return outs[id] || []; },
    time: time, lateText: lateText, statusOptions: statusOptions, match: match, filtered: filtered, anyFilter: anyFilter,
    neighbours: neighbours, interval: interval, periods: periods, periodStart: periodStart, groupBy: groupBy,
    kindIcon: kindIcon, statusHtml: statusHtml, statusSrcText: statusSrcText, flagsHtml: flagsHtml, GATE_KIND: GATE_KIND, outline: outline, flowPos: flowPos, readiness: readiness, isDone: isDone, producer: producer, isKey: isKey,
    CLS_TITLE: CLS_TITLE, classesPresent: classesPresent, winText: winText,
    endNow: endNow, slip: slip, slipHtml: slipHtml, ext: ext, extText: extText, people: people, chosenCond: chosenCond
  };
})();
</script>

  <script>
/* ═══ js_roles: роли — кто что видит и может ═══
   Уровень доступа человека — столбец «Доступ» в листе «Команда» (Руководитель · Команда ·
   Исполнитель · Инвестор); уровень роли без людей — из её строки-заготовки. Пусто — уровень
   по умолчанию (меньше всего прав).
   Кто вошёл по личной ссылке, знает сервер (AccessService.gs): он кладёт в снимок data.me, урезает
   данные под человека и проверяет каждую запись. Здесь — только интерфейс: какие виды и кнопки
   показать. Руководителю доступно «Смотреть как» — предпросмотр глазами участника или роли.
   Виды уровней — LEVELS ниже, права — CONFIG.ACCESS_RULES (приходят в снимке). */
App.roles = (function () {
  'use strict';
  var A = App, M = App.M, esc = App.esc;

  // Что видно: chips — кнопки видов в шапке; extra — виды, открываемые кнопкой или ссылкой
  var LEVELS = {
    pm:         { start: 'summary', chips: ['summary', 'table', 'gantt', 'flow', 'load'], extra: ['brief'],
                  desc: 'весь проект и все действия' },
    team:       { start: 'mine', chips: ['mine', 'summary', 'table', 'gantt', 'flow'], extra: ['brief'],
                  desc: 'весь проект; отмечать можно шаги своих ролей' },
    contractor: { start: 'mine', chips: ['mine', 'table', 'gantt'], extra: [],
                  desc: 'свои шаги и соседние: от кого ждёт, кому отдаёт' },
    investor:   { start: 'brief', chips: ['brief'], extra: [],
                  desc: 'обзор: стадии, вехи, риски; решения по своим развилкам' }
  };
  // Что можно править и делать — CONFIG.ACCESS_RULES с сервера (snapshot.access.rules): те же правила
  // сервер проверяет при каждой записи. Здесь — только чтобы не показывать недоступные кнопки.
  function rules(lv) { var a = data() && data().access; return (a && a.rules && a.rules[lv]) || { edit: [], decide: 'none', can: {} }; }

  var cur = null, allow = null;

  function uniq(a) { return a.filter(function (v, i) { return v != null && a.indexOf(v) === i; }); }
  function data() { return A.S.data; }
  function accessOf(role) { var d = data(); return (d.access && d.access.roles[role]) || (d.access && d.access.def) || 'contractor'; }
  function label(level) { var d = data(); return (d.access && d.access.labels[level]) || level; }
  var RANK = ['investor', 'contractor', 'team', 'pm'];

  /** Ключ «Смотреть как» → кто это: { key, kind, title, level, roles, people } */
  function resolve(key) {
    var d = data(); if (!key || !d) return null;
    if (key.indexOf('r:') === 0) {
      var role = key.slice(2);
      if (d.dicts.owners.indexOf(role) < 0) return null;
      return { key: key, kind: 'role', title: role, level: accessOf(role), roles: [role], people: M.people(role), set: !!(d.access && d.access.roles[role]) };
    }
    if (key.indexOf('p:') === 0 && d.team) {
      var k = key.slice(2), ps = d.team.filter(function (p) { return (p.email || p.name) === k; });
      if (!ps.length) return null;
      var level = ps.reduce(function (m, p) { return RANK.indexOf(p.level) > RANK.indexOf(m) ? p.level : m; }, 'investor');
      return { key: key, kind: 'person', title: ps[0].name, email: ps[0].email, level: level, roles: uniq(ps.map(function (p) { return p.role; })),
        people: ps, set: ps.some(function (p) { return !!p.access; }) };
    }
    return null;
  }

  /** Кто вошёл по личной ссылке (сервер кладёт в снимок data.me). Не руководитель — смотрит только как он сам */
  function me() { var d = data(); return d && d.me && d.me.via === 'key' ? d.me : null; }
  function fixed() { var m = me(); return !!m && m.level !== 'pm'; }
  /** Пересчитать после новых данных или смены «Смотреть как» */
  function recompute() {
    var m = me();
    cur = fixed() ? { key: 'me', kind: 'me', title: m.name, email: m.email, level: m.level, roles: m.roles, people: [], set: true }
      : resolve(A.prefs.get('viewAs', ''));
    if (!cur && A.prefs.get('viewAs', '')) A.prefs.set('viewAs', '');
    allow = null;
    if (cur && cur.level === 'contractor') {
      var own = data().nodes.filter(function (n) { return cur.roles.indexOf(n.owner) >= 0; }).map(function (n) { return n.id; });
      allow = own.length ? M.neighbours(own, { depth: 1, dir: 'both', transparent: true, useRet: false }).nodes : {};
    }
  }
  function level() { return cur ? cur.level : 'pm'; }
  function L() { return LEVELS[level()]; }
  function chips() { var c = L().chips.slice(); if (cur && level() === 'pm') c.unshift('mine'); return c; }
  function viewAllowed(id) { return chips().indexOf(id) >= 0 || L().extra.indexOf(id) >= 0; }
  function startView() { return cur && level() === 'pm' ? 'summary' : L().start; }
  function own(n) { return !!cur && cur.roles.indexOf(n.owner) >= 0; }
  function inScope(n) { return !allow || allow[n.id] !== undefined; }
  function scoped() { return !!allow; }
  function canEdit(n, key) {
    var r = rules(level());
    if (key === 'decision') return !!n.gate && (r.decide === 'all' || (r.decide === 'own' && own(n)));
    if (r.edit === '*') return true;
    return r.edit.indexOf(key) >= 0 && own(n);
  }
  function can(what) { return !!rules(level()).can[what]; }
  /** Видно ли почту человека: инвестору — только руководителя проекта */
  function contact(p) { return level() !== 'investor' || p.level === 'pm'; }

  // ── Шапка: кнопка «Смотреть как», полоса-предупреждение, видимые виды ──
  function chrome() {
    var on = !!cur && !fixed(), lv = level(), ch = chips();
    document.body.classList.toggle('as-on', on);
    ['pm', 'team', 'contractor', 'investor'].forEach(function (k) { document.body.classList.toggle('lv-' + k, !!cur && lv === k); });
    A.$$('#modes .chip').forEach(function (c) { c.hidden = ch.indexOf(c.dataset.v) < 0; });
    var box = A.$('#modes');   // порядок кнопок — как у уровня: у исполнителя первыми «Мои задачи»
    if (box) ch.forEach(function (id) { var c = box.querySelector('[data-v="' + id + '"]'); if (c) box.appendChild(c); });
    var bi = A.$('#btnIssues'); if (bi) bi.hidden = !can('issues');
    var b = A.$('#btnAs');
    if (b && fixed()) {   // вошёл по личной ссылке: просто «кто я», переключать нечего
      b.classList.remove('on'); b.classList.add('me');
      b.innerHTML = '<span class="as-eye">●</span><span class="btn-txt">' + esc(cur.title.length > 22 ? cur.title.slice(0, 21) + '…' : cur.title) + '</span>';
      b.title = 'Вы вошли как ' + cur.title + ' · ' + label(lv) + (cur.roles.length ? ' · ' + cur.roles.join(', ') : '');
    } else if (b) {
      b.classList.toggle('on', on);
      b.innerHTML = '<span class="as-eye">◉</span><span class="btn-txt">' + (on ? esc(cur.title.length > 22 ? cur.title.slice(0, 21) + '…' : cur.title) : 'Смотреть как') + '</span>';
      b.title = on ? 'Сейчас: ' + cur.title + ' · ' + label(lv) + '. Нажмите, чтобы сменить' : 'Посмотреть приложение глазами участника или роли';
    }
    var bar = A.$('#asBar');
    if (bar) {
      bar.hidden = !on;
      if (on) {
        bar.innerHTML = '<span class="as-eye">◉</span><span class="as-txt">Вы смотрите как <b>' + esc(cur.title) + '</b>' +
          (cur.kind === 'person' ? '<span class="as-roles"> · ' + esc(cur.roles.join(', ')) + '</span>' : '') + ' · <b>' + esc(label(lv)) + '</b>' + (cur.set ? '' : ' <i title="В «Команде» не указан «Доступ» — взят уровень по умолчанию">(по умолчанию)</i>') +
          '<span class="as-desc">: ' + esc(LEVELS[lv].desc) + '.</span></span><span class="as-note">Предпросмотр. По личной ссылке человек получает с сервера только свои данные</span>' +
          '<button class="btn btn-clear" type="button" id="asExit">Выйти</button>';
        A.$('#asExit', bar).onclick = function () { set(''); };
      }
    }
  }

  /** После applyData: пересчитать; вернуть вид, который надо показать, если текущий недоступен */
  function onData() {
    recompute(); chrome();
    return viewAllowed(A.S.view) ? null : startView();
  }

  function set(key) {
    A.prefs.set('viewAs', key || '');
    recompute();
    if (A.card.isOpen()) { var n = M.node(A.card.current()); if (!n || !inScope(n)) A.card.close(); }
    chrome();
    A.show(startView());
    if (A.card.isOpen()) A.card.refresh();
    if (key && cur) A.toast('Теперь вы видите приложение как ' + cur.title + ' (' + label(cur.level) + ')', 'inf');
  }

  // ── Выбор, как смотреть ──
  function openPicker() {
    if (fixed()) { A.toast('Вы вошли как ' + cur.title + ' · ' + label(level()) + '. Другой доступ — по другой личной ссылке.', 'inf'); return; }
    var d = data(), curKey = cur ? cur.key : '';
    var people = [], seen = {};
    (d.team || []).forEach(function (p) {
      var k = p.email || p.name; if (seen[k]) return; seen[k] = 1;
      var r = resolve('p:' + k); if (r) people.push(r);
    });
    var item = function (key, title, sub, lv, def) {
      return '<button type="button" class="as-i' + (key === curKey ? ' on' : '') + '" data-k="' + esc(key) + '">' +
        '<span class="as-n">' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
        '<span class="as-lv lv-' + lv + '">' + esc(label(lv)) + (def ? ' ·&nbsp;по&nbsp;умолч.' : '') + '</span></button>';
    };
    var noCol = d.access && !d.access.column;
    var m = A.openModal(
      '<div class="mo-head"><div class="mo-head-in"><div class="mo-id"><div class="mo-sub">Роли</div><div class="mo-title">Смотреть как</div></div></div></div>' +
      '<div class="mo-body one">' +
        '<div class="as-intro">Как приложение выглядит у участника: что он видит и что может отметить. Уровень берётся из столбца «Доступ» в листе «Команда»' +
        (noCol ? ' — <b>его ещё нет, запустите подготовитьТаблицу()</b>; пока у всех уровень «' + esc(label(d.access.def)) + '»' : '') +
        '. Это предпросмотр интерфейса. По личной ссылке человек получает с сервера только свои данные и может записать только то, что разрешено его уровню.</div>' +
        '<div class="as-list">' + item('', 'Руководитель проекта', 'весь проект — обычный вид', 'pm', false) + '</div>' +
        (people.length ? '<div class="lgrp">Люди из «Команды»</div><div class="as-list">' + people.map(function (r) { return item(r.key, r.title, r.roles.join(', '), r.level, !r.set); }).join('') + '</div>'
          : '<div class="lgrp">Люди</div><div class="mute" style="font-size:12px;padding:2px 0 8px">В листе «Команда» пока нет людей — можно посмотреть глазами роли.</div>') +
        '<div class="lgrp">Роли</div><div class="as-list">' + d.dicts.owners.map(function (o) { var r = resolve('r:' + o); return item('r:' + o, o, r.people.length ? r.people.map(function (p) { return p.name; }).join(', ') : '', r.level, !r.set); }).join('') + '</div>' +
        '<div class="as-levels">' + Object.keys(LEVELS).map(function (k) { return '<div><b>' + esc(label(k)) + '</b> — ' + esc(LEVELS[k].desc) + '</div>'; }).join('') + '</div>' +
      '</div>' +
      '<div class="mo-foot"><span class="foot-note">Выбор запоминается в этом браузере</span><button class="btn" data-close>Закрыть</button></div>', 'narrow as-m');
    A.$$('.as-i', m).forEach(function (b) { b.onclick = function () { A.closeModal(true); set(b.dataset.k); }; });
  }

  return {
    LEVELS: LEVELS, recompute: recompute, onData: onData, set: set, openPicker: openPicker, chrome: chrome,
    current: function () { return cur; }, level: level, me: me, fixed: fixed, label: label, chips: chips, viewAllowed: viewAllowed, startView: startView,
    own: own, inScope: inScope, scoped: scoped, canEdit: canEdit, can: can, contact: contact
  };
})();
</script>

  <script>
/* ═══ js_card: карточка шага — панель справа (на телефоне — нижний лист) ═══
   Всё о шаге: статус и сроки, базовый план, ожидание внешней стороны, развилка и
   журнал решений, входы и выходы. Действия в один клик («Начал сегодня»,
   «Завершил сегодня», «Подали сегодня») пишут в таблицу сразу и дают «Отменить».
   Панель не закрывает вид: клик по другой строке, узлу схемы или ↑/↓ переключает шаг. */
App.card = (function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var curId = null, dirty = {}, decDirty = false, closeArmed = false, where = null, busy = false;

  // Поля, которые карточка показывает в блоке «Сроки и исполнение»; прочие атрибуты — ниже списком
  var EXEC = ['status', 'fcStart', 'fcEnd', 'factStart', 'factEnd', 'comment'];
  var LABEL = { status: 'Статус', fcStart: 'Начало, прогноз', fcEnd: 'Окончание, прогноз',
    factStart: 'Начало, факт', factEnd: 'Окончание, факт', comment: 'Комментарий', submitted: 'Подано' };
  // Поля, которые показаны отдельными блоками и не дублируются в «Атрибутах из таблицы»
  var SHOWN = ['id', 'name', 'type', 'stage', 'owner', 'openQuestion', 'decision', 'extWait', 'submitted', 'responseDays'];

  function canEdit(n, key) {
    var f = A.S.data.fields[key];
    return !!(f && f.editable && n.locked.indexOf(key) < 0) && (!A.roles || A.roles.canEdit(n, key));
  }
  function curVal(n, k) { return k === 'status' ? (n.statusRaw || null) : (n[k] || null); }
  function hasDirty() { return Object.keys(dirty).length > 0 || decDirty; }
  function container() { return A.bp() === 's' ? 'modal' : 'side'; }
  function isOpen() {
    if (!curId) return false;
    return where === 'side' ? A.side.isOpen() : A.modalOpen() && !!A.$('#modal .card-root');
  }

  function open(id) {
    var n = M.node(id);
    if (!n) { A.toast('Узел ' + id + ' не найден в текущих данных', 'err'); return false; }
    if (A.roles && !A.roles.inScope(n)) { A.toast(id + ' не входит в ваши шаги и соседние', 'inf'); return false; }
    if (isOpen() && curId !== id && hasDirty()) { A.toast('Сначала сохраните или отмените правки', 'err'); return false; }
    var same = isOpen() && curId === id;
    if (same && hasDirty()) return true;          // та же карточка с правками — не перерисовывать
    curId = id; closeArmed = false;
    if (!same) { dirty = {}; decDirty = false; }
    A.S.cur = id;
    draw(n, same);
    A.markCur(); A.url.sync();
    return true;
  }
  function close() {
    if (!isOpen()) return;
    if (where === 'side') A.side.close(); else A.closeModal();
  }
  function closed() {
    curId = null; dirty = {}; decDirty = false; where = null;
    A.S.cur = null; A.markCur(); A.url.sync();
  }
  function beforeClose() {
    if (hasDirty() && !closeArmed) {
      closeArmed = true;
      A.toast('Есть несохранённые изменения. Закройте ещё раз, чтобы отменить их.', 'err');
      return false;
    }
    closed();
    return true;
  }

  /** После обновления данных: перерисовать открытую карточку, если правок нет */
  function refresh() {
    if (!isOpen()) return;
    var n = M.node(curId);
    if (!n) { forceClose(); return; }
    if (!hasDirty()) draw(n, true);
  }
  function forceClose() {
    if (where === 'side') A.side.close(true); else if (A.modalOpen()) A.closeModal(true);
    closed();
  }
  /** Смена ширины экрана: телефон ↔ планшет — переложить карточку в нужный контейнер */
  function relocate() {
    if (!curId) return;
    if (where === container()) return;
    var n = M.node(curId); if (!n) { forceClose(); return; }
    draw(n, true);
  }

  // ── Разметка ──
  function row(k, v, cls) { return '<div class="row' + (cls ? ' ' + cls : '') + '"><span class="row-k">' + k + '</span><span class="row-v">' + v + '</span></div>'; }
  function wideRow(k, v) { return '<div class="row wide"><span class="row-k">' + k + '</span><div class="txt">' + v + '</div></div>'; }
  function dateFld(k, v) { return '<div class="fld" data-k="' + k + '"><input type="date" value="' + esc(v || '') + '"><button class="x" type="button" title="Очистить">✕</button></div>'; }

  function peopleHtml(n) {
    var d = A.S.data;
    if (!d.team) return esc(n.owner || '');
    var ps = M.people(n.owner);
    var who = ps.map(function (p) {
      var mail = p.email && (!A.roles || A.roles.contact(p));
      return mail ? '<a class="lnk-a" href="mailto:' + esc(p.email) + '" title="' + esc(p.email) + '">' + esc(p.name) + '</a>' : esc(p.name);
    }).join(', ');
    return esc(n.owner || '—') + (who ? ' · ' + who : ' · <span class="mute" title="Впишите людей роли в лист «Команда»">людей нет в «Команде»</span>');
  }

  /** Действия в один клик — по классу и состоянию шага */
  function actions(n) {
    var out = [], today = D.today(), e = M.ext(n), dd = D.fmtD(today);
    if (M.isDone(n) || n.cls === 'gate' || n.cls === 'event' || n.cls === 'store') return out;
    if (n.cls === 'doc') {
      if (canEdit(n, 'factEnd')) out.push({ label: '✓ Получен сегодня', sub: dd, ch: { factEnd: today }, st: 'done', msg: 'получен' });
      return out;
    }
    var started = !!n.factStart || n.status === 'work' || n.status === 'review';
    var noStart = !n.factStart && canEdit(n, 'factStart');
    if (e && !n.submitted && canEdit(n, 'submitted')) {
      out.push({ label: '↗ Подали сегодня', sub: dd, ch: { submitted: today, factStart: noStart ? today : undefined }, st: 'review', force: true, msg: 'подано в ' + e.who,
        title: 'Дата подачи' + (noStart ? ' и начало шага' : '') + ' — сегодня. Ответ ждём до ' + (e.days != null ? D.fmtS(D.add(today, e.days)) : '…') });
    } else if (!started && canEdit(n, 'factStart')) {
      out.push({ label: '▶ Начал сегодня', sub: dd, ch: { factStart: today }, st: 'work', msg: 'начат' });
    }
    // Окончание — только факт окончания: когда начали, известно не всегда, и «сегодня» туда не пишем.
    // Исключение — ответ внешней стороны: ожидание началось в день подачи, эта дата в таблице есть.
    if ((started || (e && n.submitted)) && canEdit(n, 'factEnd')) {
      var fromSub = e && n.submitted && noStart ? n.submitted : undefined;
      out.push({ label: e ? '✓ Ответ получен сегодня' : '✓ Завершил сегодня', sub: dd, ch: { factEnd: today, factStart: fromSub }, st: 'done', msg: e ? 'ответ получен' : 'завершён',
        title: 'Факт окончания — сегодня' + (fromSub ? '; факт начала — дата подачи ' + D.fmtS(fromSub) : '') });
    }
    return out;
  }

  function gateBlock(n) {
    var d = A.S.data, gk = n.gate;
    var def = gk.options.filter(function (o) { return o.chosen; }).length ? gk.options.filter(function (o) { return o.chosen; }) : gk.options.filter(function (o) { return o.def; });
    var defTxt = uniq(def.map(function (o) { return '«' + esc(o.cond) + '»'; })).join(', ');
    var why = gk.decided ? 'по решению в таблице' : def.some(function (o) { return o.tone === 'pos'; }) ? 'по умолчанию: положительный исход' : 'по умолчанию: ветка без опциональных шагов';
    var txt = gk.kind === 'check' ? 'Проверка: отрицательная ветка возвращает на доработку. План идёт по ветке ' + (defTxt || '—') + '.'
      : gk.kind === 'fork' ? 'Развилка сценария: выполнится одна ветка. ' + (defTxt ? 'В основном сценарии — ' + defTxt + ' (' + why + ').' : 'Ветка по умолчанию не определена — в сценарии обе.')
      : 'Развилка внутри цикла ' + esc(n.cycleHost) + ': на разных итерациях срабатывают разные ветки, в сценарии все.';
    var h = '<div class="blk blk-goal blk-gate"><div class="blk-h">' + esc(M.GATE_KIND[gk.kind]) + (n.decision ? ' · решение: «' + esc(n.decision) + '»' : '') + '</div><div class="txt">' + txt + '</div>';
    var log = (d.decisions || []).filter(function (x) { return x.id === n.id; }).slice().reverse();
    var chosen = M.chosenCond(n);   // «да» в ячейке — ветка «Да»: сравнение без учёта регистра, как на сервере
    if (canEdit(n, 'decision') && d.meta.sheets.decisions && gk.kind !== 'cycle') {
      var conds = uniq(gk.options.map(function (o) { return o.cond; }));
      var names = uniq((d.team || []).map(function (p) { return p.name; }).concat(d.dicts.owners || []));
      h += '<div class="dec-form" id="decForm">' +
        '<div class="dec-l">Решение</div><div class="dec-opts">' + conds.map(function (c) {
          var o = gk.options.filter(function (x) { return x.cond === c; });
          var ret = o.every(function (x) { return x.ret; });
          return '<button type="button" class="chip dec-opt' + (chosen === c ? ' on' : '') + '" data-cond="' + esc(c) + '"' + (ret ? ' data-ret="1" title="Ветка-возврат: работа уходит на доработку"' : '') + '>' +
            esc(c) + (ret ? ' ↺' : '') + '</button>';
        }).join('') + '</div>' +
        '<div class="dec-grid">' +
          '<label><span>Дата</span><input type="date" data-f="date" value="' + esc(D.today()) + '"></label>' +
          '<label><span>Кто решил</span><input type="text" data-f="who" list="decWho" placeholder="Имя, роль или орган" autocomplete="off"></label>' +
          '<label class="wide"><span>Документ</span><input type="url" data-f="doc" placeholder="Ссылка на протокол, письмо, решение…"></label>' +
          '<label class="wide"><span>Комментарий</span><textarea data-f="comment" rows="2"></textarea></label>' +
        '</div>' +
        (canEdit(n, 'factEnd') && !n.factEnd ? '<label class="ck dec-close"><input type="checkbox" data-f="close" checked><span>Отметить шлюз пройденным — факт окончания = дата решения</span></label>' : '') +
        '<div class="dec-btns"><button class="btn btn-pri" type="button" data-dec="save" disabled>Записать решение</button>' +
        (n.decision ? '<button class="btn btn-clear" type="button" data-dec="clear" title="Очистить «Решение» в таблице; в журнале останется запись «(снято)»">Снять решение</button>' : '') + '</div>' +
        '<datalist id="decWho">' + names.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist></div>';
    } else if (canEdit(n, 'decision') && gk.kind !== 'cycle') {
      h += row('Решение на проекте', '<div class="fld" data-k="decision"><select><option value=""></option>' +
        uniq(gk.options.map(function (o) { return o.cond; })).map(function (c) { return '<option' + (chosen === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>') +
        '<div class="mute" style="font-size:11px;margin-top:4px">Кто и когда решил, можно вести в листе «Журнал решений» — его создаёт подготовитьТаблицу().</div>';
    } else if (gk.kind === 'fork' && !d.fields.decision) {
      h += '<div class="mute" style="font-size:11px;margin-top:6px">Чтобы зафиксировать выбранную ветку, добавьте в «БД» столбец «Решение» — его добавляет подготовитьТаблицу().</div>';
    }
    if (log.length) {
      h += '<div class="dec-log"><div class="lgrp">Журнал решений · ' + log.length + '</div>' + log.map(function (x) {
        var doc = x.doc ? (/^https?:\/\//i.test(x.doc) ? '<a href="' + esc(x.doc) + '" target="_blank" rel="noopener">документ ↗</a>' : esc(x.doc)) : '';
        return '<div class="dl-i"><span class="dl-d">' + D.fmtS(x.date) + '</span><div class="dl-b"><b>«' + esc(x.decision || '') + '»</b>' +
          (x.who ? ' · ' + esc(x.who) : '') + (doc ? ' · ' + doc : '') + (x.comment ? '<div class="dl-c">' + esc(x.comment) + '</div>' : '') +
          (x.by ? '<div class="dl-by">внёс ' + esc(x.by) + '</div>' : '') + '</div></div>';
      }).join('') + '</div>';
    }
    return h + '</div>';
  }

  function extBlock(n) {
    var e = M.ext(n); if (!e) return '';
    var st = { plan: '', wait: ' wait', over: ' over', done: ' done', na: ' done' }[e.state] || '';
    var sub = canEdit(n, 'submitted') ? dateFld('submitted', n.submitted) : (n.submitted ? D.fmt(n.submitted) : '<span class="mute">—</span>');
    return '<div class="blk blk-ext' + st + '"><div class="blk-h">Ждём ответа · ' + esc(e.who) + '</div>' +
      '<div class="ext-state">' + esc(M.extText(n)) + '</div>' +
      row(LABEL.submitted, sub) +
      row('Срок ответа', e.days != null ? e.days + ' дн.' : '<span class="mute" title="Столбец «Срок ответа, дн» в таблице">не задан</span>') +
      (e.due ? row('Ответ ожидается', D.fmt(e.due), e.state === 'over' ? 'late' : '') : '') +
      '<div class="mute" style="font-size:10.5px;margin-top:4px">Такие шаги — ожидание, а не работа команды: в «Загрузке» они не считаются.</div></div>';
  }

  function planRows(n) {
    var d = A.S.data, bl = d.meta.baseline;
    if (!bl) return '';
    if (n.blNew) return row('Базовый план', '<span class="mute">шаг добавлен после v' + bl.version + '</span>');
    if (!n.blEnd) return '';
    var v = M.slip(n);
    var h = row('Базовый план · v' + bl.version, (n.blStart ? D.fmtS(n.blStart) + ' – ' : '') + D.fmtS(n.blEnd)) +
      row('Сдвиг окончания', v == null ? '<span class="mute">—</span>' : v === 0 ? '<span class="ok-txt">по плану</span>' : M.slipHtml(n));
    var hist = (n.blHist || []).filter(function (x) { return x[2]; });
    var ends = uniq(hist.map(function (x) { return x[2]; }));
    if (hist.length > 1 && ends.length > 1) {
      var now = M.endNow(n);
      h += wideRow('Окончание по версиям плана', hist.map(function (x) { return 'v' + x[0] + ' ' + D.fmtS(x[2]); }).join(' → ') + (now ? ' → <b>сейчас ' + D.fmtS(now) + '</b>' : ''));
    }
    return h;
  }

  function draw(n, keepScroll) {
    var t = M.time(n), d = A.S.data;
    var stCls = t.late ? 'k-late' : t.done ? 'k-done' : (n.status === 'work' || n.status === 'review') ? 'k-work' : '';

    // ── Сроки и исполнение ──
    var exec = EXEC.map(function (k) {
      var f = d.fields[k];
      if (k === 'status') {
        // статус не из ячейки: по фактическим датам или по решению развилки
        var srcSub = n.statusSrc === 'scenario' ? 'по решению развилки' : n.statusSrc !== 'column' ? 'по фактическим датам' : '';
        if (canEdit(n, 'status')) {
          var opts = ['<option value="">' + (n.statusSrc !== 'column' ? esc(n.statusLabel) : '') + '</option>'].concat((d.dicts.statuses || []).map(function (s) {
            return '<option' + (s === n.statusRaw ? ' selected' : '') + '>' + esc(s) + '</option>';
          })).join('');
          return row(LABEL[k] + (srcSub ? '<div class="mute" style="font-size:10.5px" title="' + esc(M.statusSrcText(n)) + '. Выберите значение, чтобы записать его в таблицу.">' + srcSub + '</div>' : ''),
            '<div class="fld" data-k="status"><select>' + opts + '</select></div>');
        }
        return row(LABEL[k] + (srcSub ? '<div class="mute" style="font-size:10.5px" title="' + esc(M.statusSrcText(n)) + '">' + srcSub + (n.statusSrc === 'derived' && !d.fields.status ? ': столбца «Статус» нет' : '') + '</div>' : ''), M.statusHtml(n));
      }
      if (!f) return '';
      var v = n[k];
      if (k === 'comment') {
        if (canEdit(n, k)) return '<div class="row wide"><span class="row-k">' + LABEL[k] + '</span><div class="fld" data-k="comment"><textarea rows="2">' + esc(v || '') + '</textarea></div></div>';
        return v ? wideRow(LABEL[k], esc(v)) : '';
      }
      if (canEdit(n, k)) return row(LABEL[k], dateFld(k, v));
      var lock = n.locked.indexOf(k) >= 0 || !f.editable ? '<span class="lock" title="Считается формулой в таблице или не редактируется">ƒ</span>' : '';
      return row(LABEL[k], v ? D.fmt(v) + lock : '<span class="mute">—</span>' + lock);
    }).join('');
    var durTxt = '';
    if (n.fcStart && n.fcEnd) durTxt = row('Длительность, прогноз', (D.diff(n.fcStart, n.fcEnd) + 1) + ' дн.');
    if (n.factStart && n.factEnd) durTxt += row('Длительность, факт', (D.diff(n.factStart, n.factEnd) + 1) + ' дн.');

    // ── Остальные атрибуты: всё, что есть в строке и не показано выше ──
    var shown = {};
    SHOWN.concat(EXEC).forEach(function (k) { if (d.fields[k]) shown[d.fields[k].header] = 1; });
    var rest = d.columns.filter(function (c) { return !shown[c.header] && n.attrs[c.header] != null; }).map(function (c) {
      var v = n.attrs[c.header];
      if (c.kind === 'date') v = D.fmt(v);
      return String(v).length > 40 ? wideRow(esc(c.header), esc(v)) : row(esc(c.header), esc(v));
    }).join('');

    var q = n.openQuestion ? '<div class="blk blk-q"><div class="blk-h">Открытый вопрос</div><div class="txt">' + esc(n.openQuestion) + '</div></div>' : '';

    // ── Связи: входы сгруппированы по тому, как они влияют на старт ──
    var ins = M.ins(n.id), outs = M.outs(n.id);
    var fwd = ins.filter(function (l) { return !l.ret && l.cyc !== 'spawn'; });
    var gAll = fwd.filter(function (l) { return l.waitKey === 'all'; }),
        gAny = fwd.filter(function (l) { return l.waitKey === 'any'; }),
        gPlain = fwd.filter(function (l) { return !l.waitKey; }),
        gSpawn = ins.filter(function (l) { return l.cyc === 'spawn'; }),
        gRet = ins.filter(function (l) { return l.ret && l.cyc !== 'iterate'; }),
        gIter = ins.filter(function (l) { return l.cyc === 'iterate'; });
    var rule = '';
    if (gAll.length && (gAny.length || gPlain.length)) rule = 'Стартует, когда готовы все обязательные входы, или пришёл любой из альтернативных.';
    else if (gAll.length) rule = 'Стартует, когда готовы все входы.';
    else if (gAny.length > 1) rule = 'Стартует от любого из входов.';
    if (gSpawn.length) rule = 'Стартует по ходу процесса ' + esc(gSpawn[0].from) + ', а не после его окончания. ' + rule;
    if (gRet.length || gIter.length) rule += (rule ? ' ' : '') + 'Возвраты запускают шаг повторно, на первый старт не влияют.';
    var r = M.readiness(n);
    var ready = r.state === 'ready' ? '<div class="rd ok">Все входы готовы — можно начинать</div>'
      : r.state === 'waiting' && r.missing.length ? '<div class="rd">Ждёт: ' + r.missing.map(function (id) { return '<a class="lnk-a" data-id="' + esc(id) + '">' + esc(id) + '</a>'; }).join(', ') + '</div>' : '';
    var grp = function (title, list, side) {
      return list.length ? '<div class="lgrp">' + title + '</div>' + list.map(function (l) { return linkRow(l, side === 'in' ? l.from : l.to); }).join('') : '';
    };
    var linksIn = ins.length ? ready + (rule ? '<div class="rule">' + rule + '</div>' : '') +
      grp('Нужны все', gAll, 'in') + grp('Достаточно любого', gAny, 'in') + grp(gAll.length || gAny.length ? 'Прочие' : 'Вход', gPlain, 'in') +
      grp('Запуск по ходу процесса', gSpawn, 'in') + grp('Перезапуск: возврат на доработку', gRet, 'in') + grp('Следующая итерация цикла', gIter, 'in')
      : '<div class="mute" style="font-size:12px">нет</div>';
    var oFwd = outs.filter(function (l) { return !l.ret && l.cyc !== 'spawn'; }),
        oSpawn = outs.filter(function (l) { return l.cyc === 'spawn'; }),
        oRet = outs.filter(function (l) { return l.ret; });
    var linksOut = outs.length ? grp(n.gate ? 'Ветки' : 'Дальше', n.gate ? outs : oFwd, 'out') +
      (n.gate ? '' : grp('Запускает внутри цикла', oSpawn, 'out') + grp('Возврат / следующая итерация', oRet, 'out'))
      : '<div class="mute" style="font-size:12px">нет — тупик</div>';

    // ── Развилка, ведомство, цикл, сценарий ──
    var extra = (n.gate ? gateBlock(n) : '') + extBlock(n);
    if (n.cycleHost) {
      var hn = M.node(n.cycleHost);
      extra += '<div class="blk blk-goal"><div class="blk-h">Шаг цикла</div><div class="txt">Повторяется внутри <a class="lnk-a" data-id="' + esc(hn.id) + '">' + esc(hn.id) + ' «' + esc(hn.name) + '»</a>' +
        (n.cycleSrc === 'inferred' ? ' (определено по связям — в таблице «Где цикличность» не заполнено)' : '') +
        '. Плановое окно — окно ' + esc(hn.id) + (hn.fcStart ? ': ' + D.fmt(hn.fcStart) + ' – ' + D.fmt(hn.fcEnd) : '') + '.</div></div>';
    }
    if (n.cycleMembers) {
      extra += '<div class="blk blk-goal"><div class="blk-h">Цикл внутри процесса · ' + n.cycleMembers.length + '</div><div class="txt">' +
        n.cycleMembers.map(function (id) { return '<a class="lnk-a" data-id="' + esc(id) + '">' + esc(id) + '</a>'; }).join(', ') +
        '. Их возвраты в ' + esc(n.id) + ' — следующая итерация, на старт ' + esc(n.id) + ' не влияют.</div></div>';
    }
    if (!n.inScenario) extra += '<div class="blk blk-q"><div class="blk-h">Вне основного сценария</div><div class="txt">' + esc(n.scenarioNote || '') + '</div></div>';

    var acts = actions(n);
    var anyEdit = EXEC.concat(['submitted']).some(function (k) { return canEdit(n, k); }) || (n.gate && canEdit(n, 'decision') && !d.meta.sheets.decisions);
    var html =
      '<div class="card-root sd" data-id="' + esc(n.id) + '">' +
      '<div class="mo-grip"></div>' +
      '<div class="sd-head ' + stCls + '">' +
        '<div class="sd-top"><span class="sd-sub">' + M.kindIcon(n) + ' ' + esc(n.type || '—') + '<i>·</i>' + esc(n.id) + '<i>·</i>' + esc(n.stage || '') + '</span>' +
          '<button class="sd-x" type="button" data-close-card title="Закрыть (Esc)">✕</button></div>' +
        '<div class="sd-title">' + esc(n.name) + M.flagsHtml(n) + '</div>' +
        '<div class="sd-own">' + peopleHtml(n) + '</div>' +
        '<div class="sd-state">' + M.statusHtml(n) + M.slipHtml(n) + '</div>' +
        (acts.length ? '<div class="sd-acts">' + acts.map(function (a, i) {
          return '<button class="btn act' + (i === 0 ? ' btn-pri' : '') + '" type="button" data-a="' + i + '"' + (a.title ? ' title="' + esc(a.title) + '"' : '') + '>' + esc(a.label) + '<small>' + esc(a.sub) + '</small></button>';
        }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="sd-body">' + q + extra +
        '<div class="blk"><div class="blk-h">Сроки и исполнение</div>' + exec + planRows(n) + durTxt + '</div>' +
        '<div class="blk"><div class="blk-h">Входы · откуда приходим (' + ins.length + ')</div>' + linksIn + '</div>' +
        '<div class="blk"><div class="blk-h">Выходы · куда идём (' + outs.length + ')</div>' + linksOut + '</div>' +
        (rest ? '<div class="blk"><div class="blk-h">Атрибуты из таблицы</div>' + rest + '</div>' : '') +
      '</div>' +
      '<div class="sd-foot">' +
        (!A.roles || A.roles.viewAllowed('flow') ? '<button class="btn" type="button" data-go="flow" title="Показать шаг на схеме">◇ Схема</button>' : '') +
        (!A.roles || A.roles.viewAllowed('gantt') ? '<button class="btn" type="button" data-go="gantt" title="Показать шаг на Ганте">▤ Гант</button>' : '') +
        '<button class="btn" type="button" data-act="link" title="Скопировать ссылку на этот шаг — откроется сразу карточка">Ссылка</button>' +
        '<span class="foot-sp"></span>' +
        (anyEdit ? '<button class="btn btn-pri" id="cardSave" type="button" disabled>Сохранить</button>' : '') +
      '</div></div>';

    var want = container(), scroll = 0;
    var oldBody = A.$((where === 'side' ? '#side' : '#modal') + ' .sd-body');
    if (keepScroll && oldBody) scroll = oldBody.scrollTop;
    var el;
    if (want === 'side') {
      if (where === 'modal' && A.modalOpen()) A.closeModal(true);
      el = A.side.open(html, stCls, beforeClose);
    } else {
      if (where === 'side') A.side.close(true);
      el = A.openModal(html, 'sheet ' + stCls, beforeClose);
    }
    where = want;
    var body = A.$('.sd-body', el);
    if (body && scroll) body.scrollTop = scroll;
    bind(el, n, acts);
  }

  function linkRow(l, otherId) {
    var o = M.node(otherId), tags = [], n0 = M.node(otherId === l.to ? l.from : l.to);
    if (l.condition) tags.push('<span class="tg' + (l.tone ? ' ' + l.tone : '') + '">' + esc(l.condition) + '</span>');
    if (l.outcome) tags.push('<span class="tg">' + esc(l.outcome) + '</span>');
    if (l.via) tags.push('<span class="tg" title="Связь проходила через шлюз И — в мониторе он растворён">через ' + esc(l.via.join(', ')) + '</span>');
    if (l.cyc === 'iterate') tags.push('<span class="tg ret">⟳ следующая итерация</span>');
    else if (l.ret) tags.push('<span class="tg ret" title="Связь ведёт назад по порядку строк — возврат на доработку">↺ возврат</span>');
    var o2 = n0 && n0.gate && n0.gate.options.filter(function (x) { return x.li === l.i; })[0];
    if (o2 && o2.chosen) tags.push('<span class="tg pos">✓ выбрано</span>');
    else if (o2 && o2.def && !n0.gate.decided) tags.push('<span class="tg">по умолчанию</span>');
    if (!o.inScenario) tags.push('<span class="tg neg">вне сценария</span>');
    return '<div class="lnk" data-id="' + esc(otherId) + '">' + M.kindIcon(o) +
      '<span class="lnk-id">' + esc(otherId) + '</span><div class="lnk-nm">' + esc(o.name) +
      '<span class="lnk-st">' + M.statusHtml(o).replace(/<span class="late-tag">[^<]*<\/span>/, '') + '</span>' +
      (tags.length ? '<div class="lnk-tags">' + tags.join('') + '</div>' : '') + '</div></div>';
  }

  function bind(m, n, acts) {
    A.$$('[data-close-card]', m).forEach(function (b) { b.onclick = close; });
    A.$$('.lnk[data-id], .lnk-a[data-id], .rd .lnk-a', m).forEach(function (e) {
      e.onclick = function (ev) { ev.preventDefault(); open(e.dataset.id); };
    });
    A.$$('[data-go]', m).forEach(function (b) {
      b.onclick = function () {
        if (where === 'modal') { if (hasDirty()) { A.toast('Сначала сохраните или отмените правки', 'err'); return; } A.closeModal(true); closed(); }
        A.show(b.dataset.go, { focus: n.id });
      };
    });
    var lk = A.$('[data-act="link"]', m);
    if (lk) lk.onclick = function () { A.copyText(A.url.link(n.id, A.S.view), 'Ссылка на ' + n.id + ' скопирована'); };
    A.$$('.fld[data-k]', m).forEach(function (fld) {
      var k = fld.dataset.k, inp = fld.querySelector('input,select,textarea');
      var orig = k === 'status' ? (n.statusRaw || '') : (n[k] || '');
      var upd = function () {
        var v = inp.value;
        if (v !== orig) dirty[k] = v; else delete dirty[k];
        fld.classList.toggle('dirty', k in dirty);
        var sb = A.$('#cardSave', m); if (sb) sb.disabled = !Object.keys(dirty).length;
      };
      inp.addEventListener('input', upd); inp.addEventListener('change', upd);
      var x = fld.querySelector('.x');
      if (x) x.onclick = function () { inp.value = ''; upd(); };
    });
    var sb = A.$('#cardSave', m);
    if (sb) sb.onclick = function () { save(n); };
    A.$$('.act[data-a]', m).forEach(function (b) { b.onclick = function () { runAction(n, acts[+b.dataset.a]); }; });
    bindDecision(m, n);
  }

  // ── Решение по развилке: «Решение» в БД + строка в «Журнале решений» ──
  function bindDecision(m, n) {
    var f = A.$('#decForm', m); if (!f) return;
    var was = M.chosenCond(n), pick = was;
    var btn = A.$('[data-dec="save"]', f), cl = A.$('[data-f="close"]', f);
    function sync() {
      A.$$('.dec-opt', f).forEach(function (c) { c.classList.toggle('on', c.dataset.cond === pick); });
      var ret = pick && A.$('.dec-opt[data-cond="' + A.cssEsc(pick) + '"]', f) && A.$('.dec-opt[data-cond="' + A.cssEsc(pick) + '"]', f).dataset.ret;
      if (cl) { cl.disabled = !!ret; if (ret) cl.checked = false; cl.parentNode.classList.toggle('off', !!ret); }
      btn.disabled = !pick;
    }
    A.$$('.dec-opt', f).forEach(function (c) {
      c.onclick = function () { pick = c.dataset.cond; decDirty = pick !== was; if (cl && !c.dataset.ret) cl.checked = true; sync(); };
    });
    A.$$('[data-f]', f).forEach(function (i) { i.addEventListener('input', function () { if (i.value) decDirty = true; }); });
    sync();
    var val = function (k) { var e = A.$('[data-f="' + k + '"]', f); return e ? e.value.trim() : ''; };
    function send(decision) {
      var date = val('date') || D.today(), extra = {}, expected = { decision: n.decision || null };
      if (decision && cl && cl.checked && !cl.disabled && canEdit(n, 'factEnd') && !n.factEnd) {
        extra.factEnd = date; expected.factEnd = null;
        var lbl = A.S.data.meta.statusLabels.done;
        if (canEdit(n, 'status') && n.statusRaw && lbl && (A.S.data.dicts.statuses || []).indexOf(lbl) >= 0) { extra.status = lbl; expected.status = n.statusRaw; }
      }
      var doc = val('doc');
      busy = true; btn.disabled = true; btn.textContent = 'Записываю…';
      A.call('apiRecordDecision', JSON.stringify({ id: n.id, gate: n.name, decision: decision, date: date, who: val('who'), doc: doc,
        comment: val('comment'), extra: extra, expected: expected })).then(function (res) {
        busy = false; decDirty = false;
        if (res.data) A.applyData(res.data);
        if (!res.ok) { A.toast(res.error || 'Не записано', 'err'); open(n.id); return; }
        A.toast(decision ? n.id + ': решение «' + decision + '» записано' : n.id + ': решение снято', 'ok');
        open(n.id);
      }).catch(function (e) {
        busy = false; A.toast('Не записано: ' + e.message, 'err');
        btn.disabled = false; btn.textContent = 'Записать решение';
      });
    }
    btn.onclick = function () { if (pick) send(pick); };
    var clr = A.$('[data-dec="clear"]', f);
    if (clr) clr.onclick = function () { send(''); };
  }

  // ── Действия в один клик ──
  function runAction(n, a) {
    if (!a || busy) return;
    if (hasDirty()) { A.toast('Сначала сохраните или отмените правки в карточке', 'err'); return; }
    var changes = {}, expected = {};
    Object.keys(a.ch).forEach(function (k) { if (a.ch[k] === undefined) return; changes[k] = a.ch[k]; expected[k] = curVal(n, k); });
    // статус из столбца: если он уже заполнен — меняем вместе с датами, чтобы не разошлись
    var lbl = A.S.data.meta.statusLabels[a.st];
    if (lbl && canEdit(n, 'status') && (n.statusRaw || a.force) && (A.S.data.dicts.statuses || []).indexOf(lbl) >= 0) { changes.status = lbl; expected.status = n.statusRaw || null; }
    var prev = {}; Object.keys(changes).forEach(function (k) { prev[k] = expected[k] == null ? '' : expected[k]; });
    busy = true;
    A.$$('.act', A.$(where === 'side' ? '#side' : '#modal')).forEach(function (b) { b.disabled = true; });
    A.call('apiUpdate', JSON.stringify({ id: n.id, changes: changes, expected: expected })).then(function (res) {
      busy = false;
      if (res.data) A.applyData(res.data);
      if (!res.ok) { A.toast(res.error || 'Не сохранено', 'err'); if (curId === n.id) open(n.id); return; }
      if (curId === n.id) open(n.id);
      A.toast(n.id + ': ' + a.msg + ' ' + D.fmtS(D.today()), 'ok', { label: 'Отменить', fn: function () { undo(n.id, prev, changes); } });
    }).catch(function (e) {
      busy = false; A.toast('Не сохранено: ' + e.message, 'err');
      if (curId === n.id) open(n.id);
    });
  }
  function undo(id, prev, was) {
    var exp = {}; Object.keys(was).forEach(function (k) { exp[k] = was[k]; });
    A.call('apiUpdate', JSON.stringify({ id: id, changes: prev, expected: exp })).then(function (res) {
      if (res.data) A.applyData(res.data);
      A.toast(res.ok ? id + ': отменено' : (res.error || 'Не удалось отменить'), res.ok ? 'inf' : 'err');
    }).catch(function (e) { A.toast('Не удалось отменить: ' + e.message, 'err'); });
  }

  function save(n) {
    var changes = {}, expected = {};
    Object.keys(dirty).forEach(function (k) {
      changes[k] = dirty[k];
      expected[k] = curVal(n, k);
    });
    var fs = 'factStart' in changes ? changes.factStart : n.factStart, fe = 'factEnd' in changes ? changes.factEnd : n.factEnd;
    if (fs && fe && fe < fs) { A.toast('Фактическое окончание раньше начала', 'err'); return; }
    var sb = A.$('#cardSave'); sb.disabled = true; sb.textContent = 'Сохраняю…';
    A.call('apiUpdate', JSON.stringify({ id: n.id, changes: changes, expected: expected })).then(function (res) {
      dirty = {};
      if (res.data) A.applyData(res.data);
      if (!res.ok) { A.toast(res.error || 'Не сохранено', 'err'); open(n.id); return; }
      A.toast('Сохранено в таблицу', 'ok');
      open(n.id);
    }).catch(function (e) {
      A.toast('Не сохранено: ' + e.message + '. Правки остались в карточке.', 'err');
      sb.disabled = false; sb.textContent = 'Сохранить';
    });
  }

  function uniq(a) { return a.filter(function (v, i) { return v != null && a.indexOf(v) === i; }); }

  return { open: open, close: close, refresh: refresh, relocate: relocate, isOpen: isOpen, dirty: hasDirty, current: function () { return curId; },
    actions: actions, run: runAction };
})();
</script>

  <script>
/* ═══ js_summary: «Сводка» — стартовый экран руководителя проекта ═══
   Отвечает на утренние вопросы: где мы, что в работе, что горит, что можно
   начинать, что стартует скоро, какие решения ждут, что изменилось с прошлой
   встречи, чего ждём от внешних сторон. Всё считается из той же модели, что и
   остальные виды; общие фильтры действуют и здесь. «Сводка для» сужает её до
   одного человека или роли из листа «Команда». */
(function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var root, box;
  var HORIZON = 14, LOAD_DAYS = 30;
  var PERIODS = [[7, '7 дней'], [14, '2 недели'], [30, 'месяц']];
  var chg = { key: null, data: null, error: null, loading: null };   // «Что изменилось»: состояние на начало периода

  function procs(list) { return list.filter(function (n) { return n.cls === 'work'; }); }
  function byFlow(a, b) { return M.flowPos(a.id) - M.flowPos(b.id); }
  function uniq(a) { return a.filter(function (v, i) { return v != null && a.indexOf(v) === i; }); }

  /** Сколько шагов вперёд зависит от узла (без возвратов) */
  function impact(n) { return Object.keys(M.neighbours([n.id], { depth: 999, dir: 'down', transparent: false, useRet: false }).nodes).length - 1; }

  function srow(n, right, sub) {
    return '<div class="srow" data-id="' + esc(n.id) + '">' + M.kindIcon(n) +
      '<span class="s-id">' + esc(n.id) + '</span><div class="s-nm">' + esc(n.name) +
      (sub ? '<div class="s-sub">' + sub + '</div>' : '') + '</div><div class="s-r">' + (right || '') + '</div></div>';
  }
  var hideEmpty = false;   // «Сводка для»: пустые списки не показываем — человеку важно только своё
  function card(title, count, body, hint, cls, head) {
    if (hideEmpty && count === 0) return '';
    return '<section class="card s-card' + (cls ? ' ' + cls : '') + '"><div class="card-h"><span class="card-t">' + title + '</span>' +
      (count != null ? '<span class="card-n">' + count + '</span>' : '') + (hint ? '<span class="s-hint">' + hint + '</span>' : '') + (head || '') + '</div>' +
      '<div class="s-body">' + (body || '<div class="s-empty">Нет</div>') + '</div></section>';
  }
  function more(list, max, fn) {
    var h = list.slice(0, max).map(fn).join('');
    if (list.length > max) h += '<div class="s-more">и ещё ' + (list.length - max) + '</div>';
    return h;
  }
  function owner(n) { return '<span class="s-own">' + esc(n.owner || '—') + '</span>'; }
  function dd(iso) { return iso ? D.fmtS(iso) : '—'; }
  var lateTag = function (n) { var t = M.time(n); return t.late ? '<span class="late-tag">−' + t.lateDays + ' дн</span>' : ''; };

  // ── «Сводка для»: человек или роль из листа «Команда» ──
  function scope() {
    var v = A.prefs.get('sumFor', ''), d = A.S.data;
    if (!v) return null;
    if (v.indexOf('r:') === 0) {
      var role = v.slice(2);
      return d.dicts.owners.indexOf(role) < 0 ? null : { kind: 'role', key: v, title: role, roles: [role], people: M.people(role) };
    }
    if (v.indexOf('p:') === 0 && d.team) {
      var k = v.slice(2), ps = d.team.filter(function (p) { return (p.email || p.name) === k; });
      if (!ps.length) return null;
      return { kind: 'person', key: v, title: ps[0].name, email: ps[0].email, roles: uniq(ps.map(function (p) { return p.role; })), people: ps };
    }
    return null;
  }
  function forSelect(sc) {
    var d = A.S.data, cur = sc ? sc.key : '';
    var people = [], seen = {};
    (d.team || []).forEach(function (p) {
      var k = p.email || p.name; if (seen[k]) { seen[k].roles.push(p.role); return; }
      seen[k] = { k: k, name: p.name, roles: [p.role] }; people.push(seen[k]);
    });
    var opt = function (v, t) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(t) + '</option>'; };
    return '<label class="s-for" title="Та же сводка по одному человеку или роли: что он делает, что от него ждут, кого он ждёт"><span>Сводка для</span>' +
      '<select id="sFor">' + opt('', 'Весь проект') +
      (people.length ? '<optgroup label="Люди (лист «Команда»)">' + people.map(function (p) { return opt('p:' + p.k, p.name + ' — ' + uniq(p.roles).join(', ')); }).join('') + '</optgroup>' : '') +
      '<optgroup label="Роли">' + d.dicts.owners.map(function (o) { return opt('r:' + o, o); }).join('') + '</optgroup></select></label>';
  }

  /** Всё, что показывает сводка и повестка, — одним расчётом */
  function collect(sc) {
    var S = A.S, asOf = S.asOf;
    var all = M.filtered();                                    // общие фильтры + сценарий
    if (sc) all = all.filter(function (n) { return sc.roles.indexOf(n.owner) >= 0; });
    var P = procs(all), R = {};
    all.forEach(function (n) { R[n.id] = M.readiness(n); });
    var c = { all: all, P: P, R: R };
    c.done = P.filter(function (n) { return R[n.id].state === 'done'; });
    c.work = all.filter(function (n) { return R[n.id].state === 'work' && n.cls !== 'gate'; }).sort(byFlow);
    c.late = all.filter(function (n) { return M.time(n).late && n.cls !== 'gate'; });
    c.ready = P.filter(function (n) { return R[n.id].state === 'ready' && !n.cycleHost; }).sort(byFlow);
    // решение уже записано («Решение» совпало с веткой), а шлюз не отмечен пройденным — решения не ждёт
    c.decide = all.filter(function (n) { return n.cls === 'gate' && R[n.id].state === 'ready' && !n.cycleHost && !(n.gate && n.gate.decided); }).sort(byFlow);
    var soonEnd = D.add(asOf, HORIZON);
    c.soon = all.filter(function (n) {
      return (n.cls === 'work' || n.cls === 'doc') && !n.cycleHost && R[n.id].state !== 'done' && R[n.id].state !== 'work' && n.wStart && n.wStart >= asOf && n.wStart <= soonEnd;
    }).sort(function (a, b) { return a.wStart.localeCompare(b.wStart) || byFlow(a, b); });
    c.questions = all.filter(function (n) { return n.openQuestion; }).sort(byFlow);
    c.notDone = all.filter(function (n) { return R[n.id].state !== 'done' && n.cls !== 'gate'; });
    c.unreal = c.notDone.length > 5 && c.late.length / c.notDone.length > 0.6;
    // Горит: просроченные, сначала те, от которых зависит больше шагов
    c.hot = c.late.filter(function (n) { return n.cls === 'work' || n.cls === 'doc'; }).map(function (n) { return { n: n, imp: impact(n) }; })
      .sort(function (a, b) { return (R[b.n.id].state === 'work') - (R[a.n.id].state === 'work') || b.imp - a.imp || M.time(b.n).lateDays - M.time(a.n).lateDays; });
    // Ждём внешнюю сторону: просроченный ответ, ждём, ещё не подано
    var ORD = { over: 0, wait: 1, plan: 2 };
    c.ext = all.filter(function (n) { return n.extWait && !M.isDone(n); }).map(function (n) { return { n: n, e: M.ext(n) }; })
      .sort(function (a, b) { return ORD[a.e.state] - ORD[b.e.state] || (a.e.due || a.n.wStart || '').localeCompare(b.e.due || b.n.wStart || '') || byFlow(a.n, b.n); });
    c.ms = all.filter(M.isKey).sort(byFlow);
    c.slipped = c.ms.filter(function (n) { return M.slip(n) > 0; });
    // Кого ждём: свои шаги, которые стоят из-за чужих входов
    c.blocked = sc ? all.filter(function (n) { return R[n.id].state === 'waiting' && !n.cycleHost && (n.cls === 'work' || n.cls === 'gate'); }).map(function (n) {
      var other = R[n.id].missing.filter(function (id) { var m = M.node(id); return m && sc.roles.indexOf(m.owner) < 0; });
      return { n: n, from: other };
    }).filter(function (x) { return x.from.length; }).sort(function (a, b) { return byFlow(a.n, b.n); }) : [];
    return c;
  }

  function render() {
    var S = A.S, d = S.data, asOf = S.asOf, sc = scope();
    var c = collect(sc), P = c.P, R = c.R, bl = d.meta.baseline;
    hideEmpty = !!sc;

    var h = '';
    // ── Шапка ──
    var stages = stageStats(d, c.all, R);
    var cur = stages.filter(function (s) { return s.current; })[0];
    var pct = P.length ? Math.round(c.done.length / P.length * 100) : 0;
    var title = sc ? (sc.kind === 'person' ? 'Задачи: ' + esc(sc.title) : 'Что ждём от: ' + esc(sc.title))
      : cur ? 'Стадия: ' + esc(cur.name) : (P.length && c.done.length === P.length ? 'Все процессы завершены' : 'Проект не начат');
    h += '<div class="s-head"><div><div class="s-kick">' + esc(d.meta.name || 'Проект') + ' · на ' + D.fmt(asOf) + (sc && cur ? ' · стадия ' + esc(cur.name) : '') + '</div>' +
      '<h1 class="s-title">' + title + '</h1></div>' +
      '<div class="s-prog"><div class="s-pv">' + pct + '<i>%</i></div><div class="s-pl">процессов завершено<br><b>' + c.done.length + '</b> из ' + P.length + '</div></div></div>';

    // ── Панель: для кого, базовый план, повестка ──
    h += '<div class="s-bar">' + forSelect(sc) +
      '<button class="btn" id="sBase" type="button" title="Версии базового плана и фиксация новой">' +
        '<span>' + (bl ? '<span class="lbl-l">Базовый план</span><span class="lbl-s">План</span> <b>v' + bl.version + '</b> · ' + D.fmtS(bl.fixedAt) : 'Базовый план не зафиксирован') + '</span></button>' +
      (A.roles.can('agenda') ? '<button class="btn" id="sAgenda" type="button" title="Повестка регулярной встречи: что сделано, что горит, какие решения нужны — для печати или письма"><span>Повестка<span class="lbl-l"> встречи</span></span></button>' : '') +
      (A.roles.viewAllowed('brief') ? '<button class="btn btn-clear" id="sBrief" type="button" title="Одна страница для инвестора: стадии, вехи со сдвигом, главные риски, решения"><span>Обзор<span class="lbl-l"> для инвестора</span></span></button>' : '') +
      (d.team && A.roles.can('mail') ? '<button class="btn btn-clear" id="sMail" type="button" title="Как выглядит еженедельное письмо — ничего не отправляет"><span>Письмо<span class="lbl-l"> на неделю</span></span></button>' : '') +
      '</div>';
    if (sc) {
      var ps = sc.people.length ? sc.people : [];
      h += '<div class="s-who">' + (sc.kind === 'person' ? 'Роли: ' + sc.roles.map(esc).join(', ') : '') +
        (ps.length ? (sc.kind === 'person' ? ' · ' : 'Люди: ') + ps.filter(function (p, i) { return sc.kind === 'role' || i === 0; }).map(function (p) {
          return esc(p.name) + (p.email ? ' <a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' : '');
        }).join(' · ') : (sc.kind === 'role' ? (d.team ? 'людей этой роли нет в листе «Команда»' : 'людей по ролям можно вписать в лист «Команда» — его создаёт подготовитьТаблицу()') : '')) + '</div>';
    }

    if (c.unreal) h += '<div class="s-warn"><b>Почти всё просрочено относительно даты анализа</b> (' + c.late.length + ' из ' + c.notDone.length + ' незавершённых). ' +
      'Похоже, прогнозные даты ещё условные или не проставлены факты. Цифры ниже честные, но смысла в них пока мало: сдвиньте дату анализа или заполните факты.</div>';

    // ── Плашки ──
    var kpi = function (k, v, s, act, cls) {
      return '<div class="kpi s-kpi' + (cls ? ' ' + cls : '') + '"' + (act ? ' data-act="' + act + '"' : '') + '><div class="kpi-k">' + k + '</div><div class="kpi-v">' + v + '</div><div class="kpi-s">' + s + '</div></div>';
    };
    var workLate = c.work.filter(function (n) { return M.time(n).late; }).length;
    var extOver = c.ext.filter(function (x) { return x.e.state === 'over'; }).length;
    var maxSlip = c.slipped.reduce(function (m, n) { return Math.max(m, M.slip(n)); }, 0);
    h += '<div class="pg-kpi s-kpis">' +
      kpi('В работе', c.work.length, workLate ? workLate + ' с просрочкой' : 'идут по сроку', 'now') +
      kpi('Просрочено', c.late.length, 'начало или окончание', 'late', c.late.length ? 'bad' : '') +
      kpi('Можно начинать', c.ready.length, 'все входы готовы', 'ready', c.ready.length ? 'good' : '') +
      kpi('Ждут решения', c.decide.length, 'согласования и выборы', 'decide') +
      (d.meta.extColumn ? kpi('Ждём ответа', c.ext.filter(function (x) { return x.e.state !== 'plan'; }).length, extOver ? 'просрочено ' + extOver : 'внешние стороны', 'ext', extOver ? 'bad' : '') : '') +
      (bl ? kpi('Сдвиг вех', c.slipped.length, c.slipped.length ? 'до +' + maxSlip + ' дн к v' + bl.version : 'вехи по плану v' + bl.version, 'slip', c.slipped.length ? 'warn' : '') : '') +
      kpi('Старт за ' + HORIZON + ' дн', c.soon.length, 'по прогнозу', 'soon') +
      kpi('Открытые вопросы', c.questions.length, 'по модели', 'question') +
      '</div>';

    // ── Стадии ──
    h += '<div class="stg">' + stages.map(function (s) {
      var p = s.total ? Math.round(s.done / s.total * 100) : 0;
      return '<div class="stg-i' + (s.current ? ' cur' : '') + (s.done === s.total && s.total ? ' fin' : '') + '" data-stage="' + esc(s.name) + '">' +
        '<div class="stg-n">' + esc(s.name) + '</div>' +
        '<div class="stg-bar"><i style="width:' + p + '%"></i></div>' +
        '<div class="stg-m"><b>' + s.done + '</b> из ' + s.total + (s.work ? ' · в работе ' + s.work : '') + (s.late ? ' · <span class="bad">просрочено ' + s.late + '</span>' : '') + '</div>' +
        '<div class="stg-d">' + (s.from ? D.fmtS(s.from) + ' – ' + D.fmtS(s.to) : 'нет дат') + '</div></div>';
    }).join('') + '</div>';

    // ── Ключевые результаты: линия вех со сдвигом от базового плана ──
    var keyCol = d.meta.keyColumn;
    if (c.ms.length || keyCol) {
      h += '<section class="card s-ms"><div class="card-h"><span class="card-t">' + (keyCol ? 'Ключевые результаты' : 'Ключевые документы') + '</span><span class="card-n">' +
        c.ms.filter(function (n) { return R[n.id].state === 'done'; }).length + ' из ' + c.ms.length + (keyCol ? ' выполнено' : ' получено') + '</span>' +
        '<span class="s-hint">' + (keyCol ? 'отмечены в столбце «Ключевой»' : 'все «Официальные документы»') + (bl ? ' · сдвиг — к базовому плану v' + bl.version : '') + '</span></div><div class="ms-line">' +
        c.ms.map(function (n) {
          var st = R[n.id].state === 'done' ? 'done' : M.time(n).late ? 'late' : R[n.id].state === 'work' ? 'work' : 'wait';
          var doneW = n.cls === 'doc' ? 'получен ' : 'завершён ';
          var lab = { done: doneW + dd(n.factEnd), late: 'ожидался ' + dd(n.wEnd), work: 'в процессе', wait: 'ожидается ' + dd(n.wEnd) }[st];
          var tipBl = bl && n.blEnd ? ' title="По базовому плану v' + bl.version + ': ' + D.fmt(n.blEnd) + (n.blHist ? ' · по версиям: ' + n.blHist.map(function (x) { return 'v' + x[0] + ' ' + D.fmtS(x[2]); }).join(', ') : '') + '"' : '';
          return '<div class="ms-i ' + st + '" data-id="' + esc(n.id) + '"' + tipBl + '><i class="ms-d"></i><div class="ms-n">' + esc(n.name) + '</div><div class="ms-s">' + lab + ' ' + M.slipHtml(n, true) + '</div></div>';
        }).join('') + '</div></section>';
    }

    // ── Колонки ──
    var colL = card('В работе', c.work.length, more(c.work, 8, function (n) {
      return srow(n, '<span class="s-dt">до ' + dd(n.wEnd) + '</span>' + lateTag(n), owner(n));
    }), 'начатые, ещё не завершённые') +
      card('Можно начинать', c.ready.length, more(c.ready, 8, function (n) {
        var early = n.wStart && n.wStart > asOf;
        return srow(n, '<span class="s-dt">' + (early ? 'по плану с ' + dd(n.wStart) : 'план ' + dd(n.wStart)) + '</span>' + (M.time(n).lateStart ? lateTag(n) : ''), owner(n));
      }), 'все входы готовы, факта начала нет', 'good') +
      card('Ждут решения', c.decide.length, more(c.decide, 6, function (n) {
        var opts = n.gate ? uniq(n.gate.options.map(function (o) { return '«' + esc(o.cond) + '»'; })).join(' / ') : '';
        return srow(n, lateTag(n), esc(M.GATE_KIND[n.gate ? n.gate.kind : ''] || 'решение') + (opts ? ': ' + opts : '') + ' · ' + owner(n));
      }), 'входы готовы, итог не отмечен') +
      (d.meta.extColumn ? card('Ждём внешнюю сторону', c.ext.length, more(c.ext, 6, function (x) {
        var n = x.n, e = x.e;
        return srow(n, '<span class="ext-tag ' + e.state + '">' + (e.state === 'over' ? '−' + (-e.left) + ' дн' : e.state === 'wait' ? (e.due ? 'до ' + dd(e.due) : 'ждём') : 'не подано') + '</span>',
          esc(e.who) + ' · ' + esc(M.extText(n)));
      }), 'ведомства и другие стороны · не загрузка команды', 'ext') : '') +
      (sc ? card('Кого ждём', c.blocked.length, more(c.blocked, 6, function (x) {
        return srow(x.n, '', 'ждёт: ' + x.from.map(function (id) { var m = M.node(id); return '<b>' + esc(id) + '</b> ' + esc(m.owner || ''); }).join(', '));
      }), 'свои шаги, которые стоят из-за чужих входов') : '');

    var colR = changesCard(c.all) +
      card('Горит', c.hot.length, more(c.hot, 7, function (x) {
        var n = x.n, r = R[n.id];
        var sub = (r.state === 'work' ? 'в работе' : r.state === 'ready' ? 'можно начинать' : 'ждёт: ' + r.missing.map(esc).join(', ')) +
          (x.imp ? ' · от него зависят ' + x.imp + ' ' + A.plural(x.imp, 'шаг', 'шага', 'шагов') : '');
        return srow(n, lateTag(n), sub);
      }), 'просрочено; сверху — что держит больше шагов', 'hot') +
      card('Ближайшие ' + HORIZON + ' дней', c.soon.length, more(c.soon, 8, function (n) {
        var r = R[n.id];
        return srow(n, '<span class="s-dt">с ' + dd(n.wStart) + '</span>', r.state === 'ready' ? '<span class="ok">входы готовы</span>' : 'ждёт: ' + r.missing.map(esc).join(', '));
      }), 'старт по прогнозу') +
      (sc ? '' : loadCard(c.all, asOf)) +
      card('Открытые вопросы', c.questions.length, more(c.questions, 4, function (n) {
        return srow(n, '', '<span class="s-q">' + esc(n.openQuestion.length > 120 ? n.openQuestion.slice(0, 117) + '…' : n.openQuestion) + '</span>');
      }), 'из столбца «Открытый вопрос»');

    h += '<div class="s-cols"><div>' + colL + '</div><div>' + colR + '</div></div>';
    box.innerHTML = h;
    bindBar(sc);
    A.setStatus('Сводка на <b>' + D.fmt(asOf) + '</b><span class="sp">·</span>учитываются общие фильтры и сценарий' + (sc ? '<span class="sp">·</span>для: ' + esc(sc.title) : ''),
      'Клик по строке — карточка · по плашке или стадии — переход в таблицу');
  }

  function bindBar(sc) {
    var sel = A.$('#sFor', box);
    if (sel) sel.onchange = function () { A.prefs.set('sumFor', sel.value); render(); A.markCur(); };
    A.$('#sBase', box).onclick = openBaseline;
    var ag = A.$('#sAgenda', box); if (ag) ag.onclick = function () { openAgenda(sc); };
    var br = A.$('#sBrief', box); if (br) br.onclick = function () { A.show('brief'); };
    var ml = A.$('#sMail', box);
    if (ml) ml.onclick = function () { openDigest(sc); };
    A.$$('.chg-per [data-per]', box).forEach(function (c) {
      c.onclick = function (e) { e.stopPropagation(); A.prefs.set('chgSince', +c.dataset.per); render(); };
    });
    var di = A.$('.chg-per input[type=date]', box);
    if (di) di.onchange = function () { if (di.value) { A.prefs.set('chgSince', di.value); render(); } };
  }

  function stageStats(d, all, R) {
    var list = d.dicts.stages.map(function (name) {
      var P = all.filter(function (n) { return n.cls === 'work' && n.stage === name; });
      var s = { name: name, total: P.length, done: 0, work: 0, late: 0, from: null, to: null };
      P.forEach(function (n) {
        var st = R[n.id].state;
        if (st === 'done') s.done++; if (st === 'work') s.work++;
        if (M.time(n).late) s.late++;
        if (n.wStart && (!s.from || n.wStart < s.from)) s.from = n.wStart;
        if (n.wEnd && (!s.to || n.wEnd > s.to)) s.to = n.wEnd;
      });
      return s;
    }).filter(function (s) { return s.total; });
    // текущая стадия: где идёт работа; иначе первая незавершённая
    var cur = list.filter(function (s) { return s.work; })[0] || list.filter(function (s) { return s.done < s.total; })[0];
    if (cur && (cur.work || list.some(function (s) { return s.done; }))) cur.current = true;
    return list;
  }

  function loadCard(all, asOf) {
    var to = D.add(asOf, LOAD_DAYS), cnt = {};
    all.forEach(function (n) {
      if (n.cls !== 'work' || M.isDone(n) || n.extWait) return;
      var iv = M.interval(n, 'mix'); if (!iv) return;
      if (iv[0] <= to && iv[1] >= asOf) cnt[n.owner || '—'] = (cnt[n.owner || '—'] || 0) + 1;
    });
    var owners = A.S.data.dicts.owners.filter(function (o) { return cnt[o]; });
    var max = Math.max.apply(null, [1].concat(owners.map(function (o) { return cnt[o]; })));
    var body = owners.map(function (o) {
      return '<div class="lb" data-owner="' + esc(o) + '"><span class="lb-n">' + esc(o) + '</span><span class="lb-b"><i style="width:' + Math.round(cnt[o] / max * 100) + '%"></i></span><span class="lb-v">' + cnt[o] + '</span></div>';
    }).join('');
    return card('Участники · ' + LOAD_DAYS + ' дней', null, body, 'активных незавершённых процессов, не трудозатраты');
  }

  // ═══ Что изменилось: состояние на начало периода (из «_Истории») против текущих данных ═══
  function sinceDate() {
    var p = A.prefs.get('chgSince', 7);
    return typeof p === 'number' ? D.add(D.today(), -p) : p;
  }
