      if (!res.ok) { A.$('.mo-body', m).innerHTML = '<div class="s-empty">Не удалось: ' + esc(res.error) + '</div>'; return; }
      var r = res.data;
      var who = r.to.length ? 'Кому: ' + r.to.map(esc).join(', ') + (r.mailOn ? ' · рассылка включена в «Команде»' : ' · в «Команде» «Рассылка» не «Да» — письмо не уйдёт') : 'Адреса нет: письмо некому отправить. Впишите почту в лист «Команда».';
      A.$('.mo-body', m).innerHTML = '<div class="dg-meta"><div><b>Тема:</b> ' + esc(r.subject) + '</div><div class="mute">' + who + '</div>' +
        '<div class="mute">Письма уходят по понедельникам, если в редакторе запущена функция <b>включитьРассылку()</b>. Пустое письмо не отправляется.</div></div>' +
        '<iframe class="dg-frame" sandbox="" title="Письмо"></iframe>';
      A.$('.dg-frame', m).srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:16px;background:#fff">' + r.html + '</body>';
    }).catch(function (e) { A.$('.mo-body', m).innerHTML = '<div class="s-empty">Не удалось: ' + esc(e.message) + '</div>'; });
  }

  // общие расчёты для «Обзора» (js_brief) и «Моих задач» (js_mine)
  App.summaryKit = { collect: collect, stageStats: stageStats, impact: impact };

  A.register('summary', 'Сводка', {
    init: function (el) {
      root = el;
      root.innerHTML = '<div class="s-wrap" id="sBox"></div>';
      box = A.$('#sBox', root);
      box.addEventListener('click', function (e) {
        if (e.target.closest('a[href], select, input, button')) return;
        var r = e.target.closest('[data-id]'); if (r) { A.card.open(r.dataset.id); return; }
        var k = e.target.closest('[data-act]');
        if (k) {
          var a = k.dataset.act;
          var flags = { now: ['now'], late: ['late'], question: ['question'], ext: ['ext'], slip: ['key', 'slip'] }[a];
          if (flags) { A.S.f.flags = flags; A.refreshFilters(); A.show('table'); }
          return;
        }
        var s = e.target.closest('[data-stage]');
        if (s) { A.S.f.stage = [s.dataset.stage]; A.refreshFilters(); A.show('table'); return; }
        var o = e.target.closest('[data-owner]');
        if (o) { A.S.f.owner = [o.dataset.owner]; A.refreshFilters(); A.show('load'); }
      });
    },
    onData: function () { /* история на начало периода не зависит от текущих правок — кэш остаётся */ },
    render: render
  });
})();
</script>

  <script>
/* ═══ js_mine: «Мои задачи» — стартовый экран участника ═══
   Только то, что нужно одному человеку (или роли): что он делает, что может начать,
   какие решения ждут его, кого он ждёт, что дальше по плану, что сделано. Отметить
   «Начал / Завершил / Подали» можно прямо в строке, без карточки. Чьи задачи —
   выбор «Смотреть как» (js_roles). Общие фильтры и сценарий действуют. */
(function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var root, box, acts = {};
  var NEXT_DAYS = 30, DONE_DAYS = 14;

  function byFlow(a, b) { return M.flowPos(a.id) - M.flowPos(b.id); }
  function dd(iso) { return iso ? D.fmtS(iso) : '—'; }
  function lateTag(n) { var t = M.time(n); return t.late ? '<span class="late-tag">' + esc(M.lateText(n)) + '</span>' : ''; }
  function short(s, k) { s = String(s || ''); return s.length > k ? s.slice(0, k - 1) + '…' : s; }

  /** Кнопки действий в строке (те же, что в карточке; права — js_roles) */
  function btns(n, only) {
    var list = A.card.actions(n);
    acts[n.id] = list;
    return list.map(function (a, i) {
      if (only && !only(a)) return '';
      return '<button class="btn act-s' + (i === 0 ? ' btn-pri' : '') + '" type="button" data-id="' + esc(n.id) + '" data-ai="' + i + '"' +
        (a.title ? ' title="' + esc(a.title) + '"' : '') + '>' + esc(a.label) + '</button>';
    }).join('');
  }
  function srow(n, right, sub, extra) {
    return '<div class="srow mrow-x" data-id="' + esc(n.id) + '">' + M.kindIcon(n) +
      '<span class="s-id">' + esc(n.id) + '</span><div class="s-nm">' + esc(n.name) +
      (sub ? '<div class="s-sub">' + sub + '</div>' : '') + (extra ? '<div class="m-acts">' + extra + '</div>' : '') + '</div>' +
      '<div class="s-r">' + (right || '') + '</div></div>';
  }
  // пустые списки не показываем: человеку важно только то, что есть (общая картина — в шапке)
  function card(title, list, fn, hint, cls) {
    if (!list.length) return '';
    return '<section class="card s-card' + (cls ? ' ' + cls : '') + '"><div class="card-h"><span class="card-t">' + title + '</span>' +
      '<span class="card-n">' + list.length + '</span>' + (hint ? '<span class="s-hint">' + hint + '</span>' : '') + '</div>' +
      '<div class="s-body">' + (list.length ? list.map(fn).join('') : '<div class="s-empty">Нет</div>') + '</div></section>';
  }
  function who(n) {
    var ps = M.people(n.owner).map(function (p) { return p.name; });
    return esc(n.owner || '—') + (ps.length ? ' · ' + esc(ps.join(', ')) : '');
  }
  function stateText(n) {
    var r = M.readiness(n), t = M.time(n);
    if (r.state === 'done') return 'готово';
    if (t.late) return '<span class="bad">' + esc(M.lateText(n)) + '</span>';
    if (r.state === 'work') return 'в работе' + (n.wEnd ? ', до ' + dd(n.wEnd) : '');
    return 'не начат' + (n.wStart ? ', план с ' + dd(n.wStart) : '');
  }

  function render() {
    var R = A.roles, cur = R.current(), asOf = A.S.asOf;
    acts = {};
    if (!cur) {
      box.innerHTML = '<div class="empty-state m-empty"><div class="empty-ttl">Чьи задачи показать?</div>' +
        '<div class="empty-sub">«Мои задачи» — экран участника: только его шаги и кнопки «Начал», «Завершил». Выберите человека или роль.</div>' +
        '<button class="btn btn-pri" type="button" id="mPick">Смотреть как…</button></div>';
      A.$('#mPick', box).onclick = R.openPicker;
      A.setStatus('Выберите, чьи задачи показать', '');
      return;
    }
    var mine = function (n) { return cur.roles.indexOf(n.owner) >= 0; };
    var all = M.filtered(), my = all.filter(mine);
    var st = function (n) { return M.readiness(n).state; };
    var doing = my.filter(function (n) { return st(n) === 'work' && n.cls !== 'gate'; })
      .sort(function (a, b) { return (M.time(b).late - M.time(a).late) || (a.wEnd || '9').localeCompare(b.wEnd || '9') || byFlow(a, b); });
    var ready = my.filter(function (n) { return st(n) === 'ready' && n.cls === 'work' && !n.cycleHost; }).sort(byFlow);
    var decide = my.filter(function (n) { return n.cls === 'gate' && st(n) === 'ready' && !n.cycleHost && !n.gate.decided; }).sort(byFlow);
    var blocked = my.filter(function (n) {
      return st(n) === 'waiting' && !n.cycleHost && (n.cls === 'work' || n.cls === 'gate') &&
        M.readiness(n).missing.some(function (id) { var m = M.node(id); return m && !mine(m); });
    }).sort(function (a, b) { return (a.wStart || '9').localeCompare(b.wStart || '9') || byFlow(a, b); });
    var bl = {}; blocked.forEach(function (n) { bl[n.id] = 1; });
    var nextTo = D.add(asOf, NEXT_DAYS);
    var next = my.filter(function (n) {
      return st(n) === 'waiting' && !bl[n.id] && !n.cycleHost && (n.cls === 'work' || n.cls === 'doc') && n.wStart && n.wStart <= nextTo;
    }).sort(function (a, b) { return a.wStart.localeCompare(b.wStart) || byFlow(a, b); });
    var doneFrom = D.add(asOf, -DONE_DAYS);
    var done = my.filter(function (n) { return n.factEnd && n.factEnd >= doneFrom && n.factEnd <= asOf && n.cls !== 'gate'; })
      .sort(function (a, b) { return b.factEnd.localeCompare(a.factEnd); });
    var late = my.filter(function (n) { return M.time(n).late && n.cls !== 'gate'; }).length;
    var canDecide = function (n) { var f = A.S.data.fields.decision; return !!(f && R.canEdit(n, 'decision') && A.S.data.meta.sheets.decisions); };

    // кто ждёт мой шаг: чужие шаги, которые стоят из-за него (ближайшие по связям)
    var waitsMe = function (n) {
      var down = M.neighbours([n.id], { depth: 1, dir: 'down', transparent: true, useRet: false }).nodes;
      return A.S.data.nodes.filter(function (x) { return down[x.id] !== undefined && x.id !== n.id && !mine(x) && x.cls === 'work' && st(x) === 'waiting'; });
    };
    var waitsTxt = function (n) {
      var w = waitsMe(n); if (!w.length) return '';
      return '<span class="m-wait">от вас ждут: ' + w.slice(0, 3).map(function (x) { return '<b>' + esc(x.id) + '</b> ' + esc(short(x.owner, 22)); }).join(', ') + (w.length > 3 ? ' и ещё ' + (w.length - 3) : '') + '</span>';
    };

    var h = '<div class="s-head"><div><div class="s-kick">' + esc(A.S.data.meta.name || 'Проект') + ' · на ' + D.fmt(asOf) + '</div>' +
      '<h1 class="s-title">Мои задачи · ' + esc(cur.title) + '</h1>' +
      '<div class="m-roles">' + esc(cur.roles.join(', ')) + '</div></div>' +
      '<div class="m-sum">' + [
        ['в работе', doing.length, ''], ['можно начинать', ready.length, ready.length ? 'good' : ''],
        ['решения', decide.length, ''], ['просрочено', late, late ? 'bad' : '']
      ].map(function (x) { return '<div class="m-k ' + x[2] + '"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>'; }).join('') + '</div></div>';

    if (!doing.length && !ready.length && !decide.length && !blocked.length) {
      var first = my.filter(function (n) { return st(n) === 'waiting' && (n.cls === 'work' || n.cls === 'doc') && n.wStart; })
        .sort(function (a, b) { return a.wStart.localeCompare(b.wStart) || byFlow(a, b); })[0];
      h += '<div class="m-calm">Сейчас от вас ничего не ждут.' + (first ? ' Ближайший шаг — <b>' + esc(first.id) + '</b> «' + esc(first.name) + '», по плану с ' + dd(first.wStart) + '.' : my.length ? '' : ' Шагов этой роли в текущих фильтрах нет.') + '</div>';
    }

    var colL = card('Сейчас делаю', doing, function (n) {
      var e = M.ext(n);
      return srow(n, '<span class="s-dt">до ' + dd(n.wEnd) + '</span>' + lateTag(n),
        (e && e.open ? '<span class="ext-tag ' + e.state + '">' + esc(e.who) + '</span> ' + esc(M.extText(n)) + ' · ' : '') + waitsTxt(n),
        btns(n, function (a) { return a.st === 'done'; }));
    }, 'начато, не завершено', 'm-doing') +
      card('Можно начинать', ready, function (n) {
        var early = n.wStart && n.wStart > asOf;
        return srow(n, '<span class="s-dt">' + (early ? 'по плану с ' : 'план ') + dd(n.wStart) + '</span>' + (M.time(n).lateStart ? lateTag(n) : ''),
          'все входы готовы' + (waitsTxt(n) ? ' · ' + waitsTxt(n) : ''), btns(n, function (a) { return a.st !== 'done'; }));
      }, 'входы готовы — можно стартовать', 'good') +
      (decide.length ? card(decide.some(canDecide) ? 'Ждут вашего решения' : 'Нужно решение', decide, function (n) {
        var opts = n.gate.options.map(function (o) { return o.cond; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
        return srow(n, lateTag(n), esc(M.GATE_KIND[n.gate.kind]) + ': ' + opts.map(function (o) { return '«' + esc(o) + '»'; }).join(' / ') +
          (canDecide(n) ? '' : ' · записывает руководитель проекта'),
          '<button class="btn act-s' + (canDecide(n) ? ' btn-pri' : '') + '" type="button" data-open="' + esc(n.id) + '">' + (canDecide(n) ? 'Решить →' : 'Подробнее') + '</button>');
      }, 'входы готовы, решение не записано') : '');

    var colR = card('Жду от других', blocked, function (n) {
      var miss = M.readiness(n).missing.map(M.node).filter(function (m) { return m && !mine(m); });
      return srow(n, n.wStart ? '<span class="s-dt">план ' + dd(n.wStart) + '</span>' : '',
        miss.slice(0, 3).map(function (m) { return '<div class="m-dep"><b>' + esc(m.id) + '</b> ' + esc(short(m.name, 46)) + ' — ' + who(m) + ' · ' + stateText(m) + '</div>'; }).join('') +
        (miss.length > 3 ? '<div class="m-dep">и ещё ' + (miss.length - 3) + '</div>' : ''));
    }, 'стоят из-за чужих входов') +
      card('Дальше по плану · ' + NEXT_DAYS + ' дней', next.slice(0, 8), function (n) {
        return srow(n, '<span class="s-dt">с ' + dd(n.wStart) + '</span>', 'ждёт: ' + M.readiness(n).missing.map(esc).join(', '));
      }, 'старт по прогнозу') +
      card('Сделано за ' + DONE_DAYS + ' дней', done.slice(0, 8), function (n) {
        return srow(n, '<span class="s-dt">' + dd(n.factEnd) + '</span>', '');
      }, '', 'm-done');

    box.innerHTML = h + '<div class="s-cols"><div>' + colL + '</div><div>' + colR + '</div></div>';
    A.setStatus('Задачи: <b>' + esc(cur.title) + '</b><span class="sp">·</span>роли: ' + esc(cur.roles.join(', ')) + '<span class="sp">·</span>на ' + D.fmt(asOf),
      'Кнопка в строке — отметить сразу · клик по строке — карточка');
  }

  A.register('mine', 'Мои задачи', {
    init: function (el) {
      root = el;
      root.innerHTML = '<div class="s-wrap m-wrap" id="mBox"></div>';
      box = A.$('#mBox', root);
      box.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-ai]');
        if (b) { e.stopPropagation(); var n = M.node(b.dataset.id), a = (acts[b.dataset.id] || [])[+b.dataset.ai]; if (n && a) A.card.run(n, a); return; }
        var o = e.target.closest('button[data-open]');
        if (o) { e.stopPropagation(); A.card.open(o.dataset.open); return; }
        if (e.target.closest('a[href], button, select, input')) return;
        var r = e.target.closest('.srow[data-id]'); if (r) A.card.open(r.dataset.id);
      });
    },
    render: render
  });
})();
</script>

  <script>
/* ═══ js_brief: «Обзор» — одна страница для инвестора ═══
   Где проект (стадии, % процессов), ключевые результаты со сдвигом от базового плана,
   три главных риска, решения, которые ждут, последние решения, вехи на 60 дней.
   Без фильтров и терминов модели; печатается на одну-две страницы. */
(function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var root, box, MS_DAYS = 60;

  function byFlow(a, b) { return M.flowPos(a.id) - M.flowPos(b.id); }
  function dd(iso) { return iso ? D.fmtS(iso) : '—'; }

  function render() {
    var d = A.S.data, asOf = A.S.asOf, kit = App.summaryKit, cur = A.roles.current();
    var c = kit.collect(null), R = c.R, bl = d.meta.baseline;
    var stages = kit.stageStats(d, c.all, R);
    var curSt = stages.filter(function (s) { return s.current; })[0];
    var pct = c.P.length ? Math.round(c.done.length / c.P.length * 100) : 0;

    var h = '<div class="s-head"><div><div class="s-kick">' + esc(d.meta.name || 'Проект') + ' · на ' + D.fmt(asOf) + '</div>' +
      '<h1 class="s-title">Обзор проекта' + (curSt ? ' · ' + esc(curSt.name) : '') + '</h1></div>' +
      '<div class="s-prog"><div class="s-pv">' + pct + '<i>%</i></div><div class="s-pl">процессов завершено<br><b>' + c.done.length + '</b> из ' + c.P.length + '</div></div></div>';
    h += '<div class="bf-actions"><button class="btn" type="button" id="bfPrint">Печать</button></div>';
    if (c.unreal) h += '<div class="s-warn">Прогнозные даты в таблице пока условные: почти всё выглядит просроченным. Сроки и сдвиги ниже станут осмысленными, когда план наполнится реальными датами.</div>';

    // стадии
    h += '<div class="stg">' + stages.map(function (s) {
      var p = s.total ? Math.round(s.done / s.total * 100) : 0;
      return '<div class="stg-i' + (s.current ? ' cur' : '') + (s.done === s.total && s.total ? ' fin' : '') + '">' +
        '<div class="stg-n">' + esc(s.name) + '</div><div class="stg-bar"><i style="width:' + p + '%"></i></div>' +
        '<div class="stg-m"><b>' + s.done + '</b> из ' + s.total + (s.late ? ' · <span class="bad">просрочено ' + s.late + '</span>' : '') + '</div>' +
        '<div class="stg-d">' + (s.from ? D.fmtS(s.from) + ' – ' + D.fmtS(s.to) : 'нет дат') + '</div></div>';
    }).join('') + '</div>';

    // ключевые результаты
    var ms = c.ms;
    var stTxt = function (n) {
      if (R[n.id].state === 'done') return '<span class="ok-txt">готово</span>';
      if (M.time(n).late) return '<span class="bad">просрочено</span>';
      return R[n.id].state === 'work' ? 'в работе' : 'ожидается';
    };
    h += '<section class="card s-card bf-ms"><div class="card-h"><span class="card-t">Ключевые результаты</span><span class="card-n">' +
      ms.filter(function (n) { return R[n.id].state === 'done'; }).length + ' из ' + ms.length + '</span>' +
      '<span class="s-hint">' + (bl ? 'сдвиг — к базовому плану v' + bl.version + ' от ' + D.fmtS(bl.fixedAt) : 'базовый план не зафиксирован — сдвига нет') + '</span></div>' +
      '<div class="s-body"><table class="dt bf-t"><thead><tr><th>Результат</th>' + (bl ? '<th class="bf-pl">По плану</th>' : '') + '<th>Сейчас</th>' + (bl ? '<th>Сдвиг</th>' : '') + '<th>Статус</th></tr></thead><tbody>' +
      (ms.length ? ms.map(function (n) {
        var sl = M.slip(n);
        return '<tr class="srow-t" data-id="' + esc(n.id) + '"><td>' + M.kindIcon(n) + esc(n.name) + '</td>' + (bl ? '<td class="c-date bf-pl">' + dd(n.blEnd) + '</td>' : '') +
          '<td class="c-date">' + dd(M.endNow(n)) + '</td>' + (bl ? '<td class="c-date">' + (sl == null ? '—' : sl === 0 ? '<span class="mute">по плану</span>' : M.slipHtml(n)) + '</td>' : '') +
          '<td>' + stTxt(n) + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="mute">Нет ключевых результатов</td></tr>') + '</tbody></table></div></section>';

    // риски, решения, вехи
    var risks = c.hot.slice(0, 3).map(function (x) {
      var n = x.n;
      return '<div class="srow" data-id="' + esc(n.id) + '">' + M.kindIcon(n) + '<span class="s-id">' + esc(n.id) + '</span><div class="s-nm">' + esc(n.name) +
        '<div class="s-sub"><span class="bad">' + esc(M.lateText(n)) + '</span>' + (x.imp ? ' · от него зависят ' + x.imp + ' ' + A.plural(x.imp, 'шаг', 'шага', 'шагов') : '') + ' · ' + esc(n.owner || '') + '</div></div></div>';
    });
    c.ext.filter(function (x) { return x.e.state === 'over'; }).slice(0, Math.max(0, 3 - risks.length)).forEach(function (x) {
      risks.push('<div class="srow" data-id="' + esc(x.n.id) + '">' + M.kindIcon(x.n) + '<span class="s-id">' + esc(x.n.id) + '</span><div class="s-nm">' + esc(x.n.name) +
        '<div class="s-sub"><span class="bad">' + esc(M.extText(x.n)) + '</span> · ' + esc(x.e.who) + '</div></div></div>');
    });
    var mineGate = function (n) { return !cur || cur.level === 'pm' || cur.roles.indexOf(n.owner) >= 0; };
    var dec = c.decide.filter(mineGate);
    var decH = dec.map(function (n) {
      var opts = n.gate.options.map(function (o) { return o.cond; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      return '<div class="srow" data-id="' + esc(n.id) + '">' + M.kindIcon(n) + '<span class="s-id">' + esc(n.id) + '</span><div class="s-nm">' + esc(n.name) +
        '<div class="s-sub">' + opts.map(function (o) { return '«' + esc(o) + '»'; }).join(' / ') + ' · ' + esc(n.owner || '') + '</div></div>' +
        '<div class="s-r"><span class="btn act-s btn-pri">Решить →</span></div></div>';
    });
    var log = (d.decisions || []).slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || '') || b.row - a.row; }).slice(0, 5);
    var logH = log.map(function (x) {
      var n = M.node(x.id);
      return '<div class="srow"' + (n && A.roles.inScope(n) ? ' data-id="' + esc(x.id) + '"' : '') + '><span class="s-dt bf-d">' + dd(x.date) + '</span><div class="s-nm">' + esc(n ? n.name : x.id) +
        '<div class="s-sub"><b>«' + esc(x.decision || '') + '»</b>' + (x.who ? ' · ' + esc(x.who) : '') + (x.doc && /^https?:\/\//i.test(x.doc) ? ' · <a href="' + esc(x.doc) + '" target="_blank" rel="noopener">документ ↗</a>' : '') + '</div></div></div>';
    });
    var msTo = D.add(asOf, MS_DAYS);
    var soon = ms.filter(function (n) { var e = M.endNow(n); return R[n.id].state !== 'done' && e && e >= asOf && e <= msTo; })
      .sort(function (a, b) { return M.endNow(a).localeCompare(M.endNow(b)) || byFlow(a, b); });
    var soonH = soon.map(function (n) {
      return '<div class="srow" data-id="' + esc(n.id) + '">' + M.kindIcon(n) + '<div class="s-nm">' + esc(n.name) + '</div><div class="s-r"><span class="s-dt">' + dd(M.endNow(n)) + '</span> ' + M.slipHtml(n, true) + '</div></div>';
    });
    var cardH = function (t, list, hint, empty, cls) {
      return '<section class="card s-card' + (cls ? ' ' + cls : '') + '"><div class="card-h"><span class="card-t">' + t + '</span><span class="card-n">' + list.length + '</span>' +
        (hint ? '<span class="s-hint">' + hint + '</span>' : '') + '</div><div class="s-body">' + (list.join('') || '<div class="s-empty">' + empty + '</div>') + '</div></section>';
    };
    h += '<div class="s-cols"><div>' +
      cardH('Главные риски', risks, 'просрочено и держит больше всего шагов', 'Просроченного нет', 'hot') +
      cardH(cur && cur.level !== 'pm' ? 'Ждут вашего решения' : 'Ждут решения', decH, 'входы готовы, решение не записано', 'Решений не ждёт') +
      '</div><div>' +
      cardH('Вехи на ' + MS_DAYS + ' дней', soonH, 'ключевые результаты по прогнозу', 'В ближайшие ' + MS_DAYS + ' дней вех нет') +
      cardH('Последние решения', logH, 'из «Журнала решений»', d.decisions ? 'Решений ещё не записывали' : 'Журнала решений пока нет') +
      '</div></div>';

    box.innerHTML = h;
    A.$('#bfPrint', box).onclick = function () {
      document.body.classList.add('print-brief');
      setTimeout(function () { window.print(); setTimeout(function () { document.body.classList.remove('print-brief'); }, 500); }, 50);
    };
    A.setStatus('Обзор на <b>' + D.fmt(asOf) + '</b><span class="sp">·</span>весь проект, основной сценарий', 'Клик по строке — карточка шага');
  }

  A.register('brief', 'Обзор', {
    init: function (el) {
      root = el;
      root.innerHTML = '<div class="s-wrap bf-wrap" id="bfBox"></div>';
      box = A.$('#bfBox', root);
      box.addEventListener('click', function (e) {
        if (e.target.closest('a[href], button')) return;
        var r = e.target.closest('[data-id]'); if (r) A.card.open(r.dataset.id);
      });
    },
    render: render
  });
})();
</script>

  <script>
/* ═══ js_table: табличное представление ═══
   Два вида:
   • «Структура» — порядок по связям, развилки сценария раскрываются колонками
     («если так — эти шаги, если иначе — эти»), возвраты на доработку — пометкой
     в пунктире, шаги цикла — вложенным уровнем под процессом. Уровни сворачиваются.
   • «Список» — плоская таблица с сортировкой и группировкой. */
(function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var root, wrap, colPanel;
  var sort = A.prefs.get('tblSort', { col: null, dir: 1 });
  var group = A.prefs.get('tblGroup', '');
  var mode = A.prefs.get('tblMode', 'tree');
  var clsOn = A.prefs.get('tblCls', ['work', 'doc']);   // какие классы узлов показывать строками
  var IND = 22;                                           // шаг отступа уровня, px

  // Виртуальные столбцы — то, чего нет в листе, но что считает приложение
  var VIRTUAL = [
    { id: '@status', title: 'Статус', key: 'status' },
    { id: '@links', title: 'Связи (вх/вых)' },
    { id: '@after', title: 'Идёт после' },
    { id: '@bl', title: 'Базовый план' },          // есть, когда план зафиксирован
    { id: '@slip', title: 'Сдвиг, дн' },
    { id: '@due', title: 'Ответ ждём до' }         // есть, когда в «БД» есть «Внешнее ожидание»
  ];
  // Предшественники вперёд (без возвратов) — «после чего идёт» узел
  function preds(n) {
    return M.ins(n.id).filter(function (l) { return !l.ret; })
      .sort(function (a, b) { return M.flowPos(a.from) - M.flowPos(b.from); });
  }
  // Столбцы по умолчанию — по логическим полям, а не по заголовкам листа
  var DEFAULT_KEYS = ['id', 'type', 'name', '@after', 'stage', 'owner', '@status', 'fcStart', 'fcEnd', 'factStart', 'factEnd', '@slip'];
  // На телефоне — только то, что помещается в экран; остальное включается в «Столбцах»
  var MOBILE_KEYS = ['id', 'name', '@status'];

  function allCols() {
    var d = A.S.data, cols = [];
    d.columns.forEach(function (c) {
      if (c.key === 'status') return;              // статус показывает виртуальный столбец
      cols.push({ id: c.header, title: c.header, key: c.key, kind: c.kind });
    });
    // статус — после ответственного
    var at = cols.findIndex(function (c) { return c.key === 'owner'; });
    cols.splice(at >= 0 ? at + 1 : cols.length, 0, VIRTUAL[0]);
    cols.push(VIRTUAL[1]);
    var nm = cols.findIndex(function (c) { return c.key === 'name'; });
    cols.splice(nm >= 0 ? nm + 1 : cols.length, 0, VIRTUAL[2]);
    // базовый план и сдвиг — сразу за фактическими датами
    if (d.meta.baseline) {
      var fe = cols.findIndex(function (c) { return c.key === 'factEnd'; });
      cols.splice(fe >= 0 ? fe + 1 : cols.length, 0, VIRTUAL[3], VIRTUAL[4]);
    }
    if (d.meta.extColumn) {
      var sb = cols.findIndex(function (c) { return c.key === 'submitted'; });
      cols.splice(sb >= 0 ? sb + 1 : cols.length, 0, VIRTUAL[5]);
    }
    return cols;
  }
  function visibleIds(cols) {
    var saved = A.prefs.get('tblCols', null);
    if (saved) return saved.filter(function (id) { return cols.some(function (c) { return c.id === id; }); });
    return (A.bp() === 's' ? MOBILE_KEYS : DEFAULT_KEYS).map(function (k) {
      var c = cols.find(function (x) { return x.key === k || x.id === k; }); return c && c.id;
    }).filter(Boolean);
  }

  function value(n, c) {
    if (c.id === '@status') { var t = M.time(n); return (t.late ? 0 : 10) + ({ work: 1, review: 2, none: 3, done: 4, na: 5 }[n.status] || 6); }
    if (c.id === '@links') return M.ins(n.id).length + M.outs(n.id).length;
    if (c.id === '@after') { var p = preds(n); return p.length ? M.flowPos(p[0].from) : null; }
    if (c.id === '@bl') return n.blEnd || null;
    if (c.id === '@slip') return M.slip(n);
    if (c.id === '@due') { var e = M.ext(n); return e && e.state !== 'na' ? e.due || (e.state === 'plan' ? 'я' : null) : null; }
    if (c.key === 'id') return M.flowPos(n.id);     // ID сортируем по порядку связей, а не по алфавиту
    return n.attrs[c.title];
  }
  function cmp(a, b) {
    if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    return String(a).localeCompare(String(b), 'ru', { numeric: true });
  }

  function cell(n, c, ctx) {
    var v = n.attrs[c.title];
    if (c.id === '@status') return '<td>' + M.statusHtml(n) + '</td>';
    if (c.id === '@links') return '<td class="c-date mute">' + M.ins(n.id).length + ' / ' + M.outs(n.id).length + '</td>';
    if (c.id === '@after') return '<td class="c-after">' + preds(n).map(function (l) {
      var o = M.node(l.from);
      return '<span class="aft' + (l.cyc === 'spawn' ? ' cyc' : '') + '" data-id="' + esc(l.from) + '" title="' + esc(o.name) +
        (l.condition ? ' — если «' + esc(l.condition) + '»' : '') + (l.cyc === 'spawn' ? ' — запуск по ходу' : '') + '">' +
        (l.cyc === 'spawn' ? '⟳ ' : '') + esc(l.from) + (l.condition ? '<i>' + esc(l.condition) + '</i>' : '') + '</span>';
    }).join('') + '</td>';
    if (c.id === '@bl') return '<td class="c-date">' + (n.blEnd ? (n.blStart ? D.fmtS(n.blStart) + ' – ' : '') + D.fmtS(n.blEnd) : '<span class="mute">' + (n.blNew ? 'нет в плане' : '—') + '</span>') + '</td>';
    if (c.id === '@slip') { var sv = M.slip(n); return '<td class="c-date">' + (sv == null ? '<span class="mute">—</span>' : sv === 0 ? '<span class="mute">0</span>' : M.slipHtml(n, true)) + '</td>'; }
    if (c.id === '@due') {
      var ex = M.ext(n);
      var dt = !ex ? '' : ex.state === 'na' ? 'не применяется' : ex.due ? D.fmtS(ex.due) : ex.state === 'plan' ? 'не подано' : ex.state === 'done' ? 'получено' : 'срок?';
      return '<td class="c-date">' + (ex ? '<span class="ext-tag ' + ex.state + '"' + (ex.state === 'done' && ex.due ? ' title="Ответ получен"' : '') + '>' + esc(dt) + '</span>' : '') + '</td>';
    }
    if (c.key === 'id') return '<td class="c-id">' + esc(n.id) + '</td>';
    if (c.key === 'type') return '<td class="c-type">' + M.kindIcon(n) + esc(n.type || '') + '</td>';
    if (c.key === 'name') {
      // документ — результат процесса: стрелка-выход и «выход P24»
      var pr = n.cls === 'doc' ? M.producer(n) : null;
      return '<td class="c-name"' + (ctx && ctx.pad ? ' style="padding-left:' + ctx.pad + 'px"' : '') + '>' +
        (ctx && ctx.caret || '') + (n.cls === 'doc' ? '<span class="out-ar">↳</span>' : '') + esc(n.name) + M.flagsHtml(n) +
        (pr ? ' <span class="out-of" data-id="' + esc(pr) + '" title="Результат процесса ' + esc(M.node(pr).name) + '">выход ' + esc(pr) + '</span>' : '') + '</td>';
    }
    if (c.kind === 'date') return '<td class="c-date">' + (v ? D.fmt(v) : '<span class="mute">—</span>') + '</td>';
    if (v == null) return '<td></td>';
    var s = String(v);
    if (s.length > 50) return '<td class="c-long" title="' + esc(s) + '">' + esc(s.length > 160 ? s.slice(0, 157) + '…' : s) + '</td>';
    return '<td>' + esc(s) + '</td>';
  }

  function shownCols() {
    var cols = allCols(), vis = visibleIds(cols);
    return { cols: cols, vis: vis, shown: vis.map(function (id) { return cols.find(function (c) { return c.id === id; }); }).filter(Boolean) };
  }
  function head(shown, sortable) {
    return '<tr>' + shown.map(function (c) {
      var ar = sortable && sort.col === c.id ? '<span class="ar">' + (sort.dir > 0 ? '▲' : '▼') + '</span>' : '';
      return '<th data-c="' + esc(c.id) + '"' + (sortable ? '' : ' title="Сортировка — в виде «Список»"') + '>' + esc(c.title) + ar + '</th>';
    }).join('') + '</tr>';
  }
  function trOf(n, shown, ctx) {
    var t = M.time(n);
    return '<tr data-id="' + esc(n.id) + '" class="s-' + n.status + (t.late ? ' late' : '') + (n.inScenario ? '' : ' off') + (n.cls === 'doc' ? ' out' : '') + (ctx && ctx.cls ? ' ' + ctx.cls : '') + '">' +
      shown.map(function (c) { return cell(n, c, ctx); }).join('') + '</tr>';
  }
  function visibleCls(n) { return clsOn.indexOf(n.cls) >= 0; }

  function render() {
    drawBar();
    var sc = shownCols();
    if (em() === 'tree') renderTree(sc.shown); else renderList(sc.shown);
    drawColPanel(sc.cols, sc.vis);
  }

  // ── Список ──
  function renderList(shown) {
    var rows = M.filtered().filter(visibleCls);
    var sc = sort.col && shown.find(function (c) { return c.id === sort.col; });
    rows.sort(function (a, b) {
      var r = sc ? cmp(value(a, sc), value(b, sc)) * sort.dir : 0;
      return r || M.flowPos(a.id) - M.flowPos(b.id);   // по умолчанию — порядок по связям
    });
    var body = '';
    M.groupBy(rows, group).forEach(function (g) {
      if (g.title) body += '<tr class="grp"><td colspan="' + shown.length + '">' + esc(g.title) + ' · ' + g.items.length + '</td></tr>';
      g.items.forEach(function (n) { body += trOf(n, shown); });
    });
    if (!rows.length) body = emptyRow(shown.length);
    wrap.innerHTML = '<table class="dt"><thead>' + head(shown, true) + '</thead><tbody>' + body + '</tbody></table>';
    var late = rows.filter(function (n) { return M.time(n).late; }).length;
    A.setStatus('Показано <b>' + rows.length + '</b> из ' + A.S.data.nodes.length +
      (late ? '<span class="sp">·</span>просрочено ' + late : '') +
      '<span class="sp">·</span>дата анализа ' + D.fmt(A.S.asOf), 'Порядок — по связям: шлюз сразу за тем, после чего идёт · клик по заголовку — сортировка · клик по строке — карточка');
  }
  function emptyRow(span) {
    return '<tr><td colspan="' + span + '"><div class="empty-state"><div class="empty-ttl">Ничего не найдено</div><div class="empty-sub">Измените или сбросьте фильтры.</div></div></td></tr>';
  }

  // ── Структура ──
  var cnt;
  function renderTree(shown) {
    cnt = { rows: 0, late: 0 };
    var span = shown.length;
    var body = treeRows(M.outline().items, shown, span, false);
    if (!cnt.rows) body += emptyRow(span);
    wrap.innerHTML = '<table class="dt tree"><thead>' + head(shown, false) + '</thead><tbody>' + body + '</tbody></table>';
    A.setStatus('Строк <b>' + cnt.rows + '</b>' + (cnt.late ? '<span class="sp">·</span>просрочено ' + cnt.late : '') +
      '<span class="sp">·</span>дата анализа ' + D.fmt(A.S.asOf),
      'Порядок — по связям · ◆ развилка: ветки колонками · пунктир — возврат на доработку · ▸ свернуть уровень');
  }

  function caret(key) {
    var c = !!A.S.collapsed[key];
    return '<span class="caret" data-key="' + esc(key) + '" title="' + (c ? 'Развернуть' : 'Свернуть') + '">' + (c ? '▸' : '▾') + '</span>';
  }

  function treeRows(items, shown, span, alt) {
    var html = '';
    items.forEach(function (it) {
      var n = M.node(it.id), blk = it.block;
      var cycKey = it.cycle && it.cycle.length ? 'cyc:' + n.id : null;
      if (visibleCls(n) && M.match(n, true)) {
        cnt.rows++; if (M.time(n).late) cnt.late++;
        html += trOf(n, shown, { pad: 10 + (it.level + (n.cls === 'doc' ? 1 : 0)) * IND, caret: cycKey ? caret(cycKey) : '', cls: alt ? 'alt' : '' });
      }
      if (blk) {
        blk.notes.forEach(function (nt) { html += '<tr class="note-row"><td colspan="' + span + '">' + noteHtml(n, nt, 10 + (it.level + 1) * IND) + '</td></tr>'; });
        if (blk.cols) html += '<tr class="fork-row"><td colspan="' + span + '">' + forkHtml(n, blk, 10 + it.level * IND) + '</td></tr>';
      }
      if (cycKey && !A.S.collapsed[cycKey]) html += treeRows(it.cycle, shown, span, alt);
    });
    return html;
  }

  function nodeLink(id) {
    var o = M.node(id);
    return '<a class="lnk-a" data-id="' + esc(id) + '">' + esc(id) + '</a> ' + esc(o ? o.name : '');
  }
  function noteHtml(g, nt, pad) {
    var to = nt.b.to.map(nodeLink).join(', ');
    var what = nt.kind === 'ret' ? '↺ возврат на доработку: ' + to : '→ переход к ' + to;
    return '<div class="note" style="margin-left:' + pad + 'px"><span class="note-g">' + M.kindIcon(g) + ' ' + esc(g.id) + ' ' + esc(g.name) + '</span>' +
      '<span class="note-if">если «' + esc(nt.b.cond) + '»</span><span class="note-to">' + what + '</span></div>';
  }

  function forkHtml(g, blk, pad, mini) {
    var key = 'fork:' + g.id, closed = !!A.S.collapsed[key];
    var kindTxt = blk.kind === 'fork' ? 'развилка сценария · выполнится одна ветка' : blk.kind === 'cycle' ? 'развилка внутри цикла · на разных итерациях по-разному' : 'развилка';
    var h = '<div class="fork' + (mini ? ' mini' : '') + '" style="margin-left:' + pad + 'px">' +
      '<div class="fork-h">' + caret(key) + M.kindIcon(g) + ' <b>' + esc(g.id) + '</b> ' + esc(g.name) + ' <span class="fork-k">' + kindTxt + '</span></div>';
    if (!closed) {
      // ветки — колонками, пока помещаются; на узком экране встают друг под другом
      h += '<div class="fork-cols" style="grid-template-columns:repeat(auto-fit,minmax(' + (blk.cols.length > 2 ? 220 : 260) + 'px,1fr))">' + blk.cols.map(function (c) {
        var b = c.b, tag = b.chosen ? '<span class="tg pos">✓ выбрано</span>' : b.main ? '<span class="tg">основная</span>' : '<span class="tg neg">альтернатива</span>';
        var body = c.cont ? '<div class="fcol-cont">↓ продолжение — ниже по основной линии</div>'
          : c.items.length ? miniList(c.items, !b.main) : '<div class="fcol-cont">сразу к точке схождения</div>';
        return '<div class="fcol' + (b.main ? ' main' : ' alt') + '"><div class="fcol-h">если «' + esc(b.cond) + '» ' + tag + '</div>' + body + '</div>';
      }).join('') + '</div>';
      if (blk.merge) h += '<div class="fork-f">ветки сходятся → ' + nodeLink(blk.merge) + '</div>';
    }
    return h + '</div>';
  }

  /** Шаги внутри колонки ветки — компактные строки, с вложенными развилками */
  function miniList(items, alt) {
    var h = '';
    items.forEach(function (it) {
      var n = M.node(it.id), t = M.time(n), blk = it.block;
      if (visibleCls(n) || !blk) {
        var dim = !M.match(n, true) || !visibleCls(n);
        h += '<div class="mrow s-' + n.status + (t.late ? ' late' : '') + (dim ? ' dim' : '') + (n.cls === 'doc' ? ' out' : '') + '" data-id="' + esc(n.id) + '">' +
          (n.cls === 'doc' ? '<span class="out-ar">↳</span>' : '') + M.kindIcon(n) +
          '<span class="m-id">' + esc(n.id) + '</span><span class="m-nm">' + esc(n.name) + '</span>' +
          '<span class="m-dt">' + M.winText(n) + '</span><span class="st ' + n.status + '" title="' + esc(n.statusLabel) + '"></span></div>';
      }
      if (blk) {
        blk.notes.forEach(function (nt) { h += noteHtml(n, nt, 0); });
        if (blk.cols) h += forkHtml(n, blk, 0, true);
      }
      if (it.cycle) h += '<div class="m-cyc">' + miniList(it.cycle, alt) + '</div>';
    });
    return h || '<div class="fcol-cont">нет шагов</div>';
  }

  // ── Панель вида ──
  // Перерисовывается только при смене вида или набора классов в данных: иначе
  // открытый список «Показывать» закрывался бы после каждой галочки
  var barKey = null;
  // «Смотреть как» исполнитель: видна часть проекта — структура с пустыми ветками не нужна, только список
  function em() { return A.roles && A.roles.scoped() ? 'list' : mode; }
  function drawBar() {
    var bar = A.$('#tBar', root), present = M.classesPresent(), mode = em(), scoped = A.roles && A.roles.scoped();
    var key = mode + '|' + group + '|' + present.join(',') + '|' + scoped;
    if (key === barKey) return;
    barKey = key;
    var ch = function (items, cur, attr) {
      return '<span class="chips">' + items.map(function (x) {
        var on = Array.isArray(cur) ? cur.indexOf(x[0]) >= 0 : cur === x[0];
        return '<span class="chip' + (on ? ' on' : '') + '" data-' + attr + '="' + x[0] + '">' + x[1] + '</span>';
      }).join('') + '</span>';
    };
    bar.innerHTML =
      (scoped ? '' : '<div class="g-grp"><span class="gl">Вид:</span> ' + ch([['tree', 'Структура'], ['list', 'Список']], mode, 'mode') + '</div>') +
      '<span id="tCls"></span>' +
      (mode === 'list' ? '<div class="g-grp"><span class="gl">Группировка:</span> ' + ch([['', 'Без групп'], ['stage', 'Стадия'], ['owner', 'Участник'], ['type', 'Тип']], group, 'grp') + '</div>' : '') +
      (mode === 'tree' ? '<button class="btn btn-clear" id="tAll" title="Развернуть все уровни">▾ развернуть всё</button>' : '') +
      '<button class="btn" id="tCols">☰ Столбцы</button>';
    A.$('#tCls', bar).replaceWith(A.checks('Показывать', present.map(function (c) {

    }), function (ids) { clsOn = ids; A.prefs.set('tblCls', clsOn); render(); }));
    A.$$('[data-mode]', bar).forEach(function (e) { e.onclick = function () { mode = e.dataset.mode; A.prefs.set('tblMode', mode); render(); }; });

  }

  function drawColPanel(cols, vis) {
    colPanel.innerHTML = '<span class="fl">Столбцы</span>' + cols.map(function (c) {
      return '<label class="vp-item"><input type="checkbox" data-c="' + esc(c.id) + '"' + (vis.indexOf(c.id) >= 0 ? ' checked' : '') + '>' + esc(c.title) + '</label>';

  }

  A.register('table', 'Таблица', {
    init: function (el) {

        '<div class="fl-bar" id="tBar"></div>' +
        '<div class="filterbar viewpanel" id="tColPanel" hidden></div>' +
        '<div class="tbl-wrap" id="tWrap"></div>';
      wrap = A.$('#tWrap', root); colPanel = A.$('#tColPanel', root);
      wrap.addEventListener('click', function (e) {
        var cr = e.target.closest('.caret[data-key]');
        if (cr) { e.stopPropagation(); A.toggleCollapse(cr.dataset.key); return; }
        var th = e.target.closest('th[data-c]');
        if (th) {
          if (mode !== 'list') return;
          var c = th.dataset.c;
          if (sort.col !== c) sort = { col: c, dir: 1 };
          else if (sort.dir === 1) sort.dir = -1;
          else sort = { col: null, dir: 1 };
          A.prefs.set('tblSort', sort); render(); return;
        }
        var t = e.target.closest('[data-id]');
        if (t) A.card.open(t.dataset.id);
      });
    },
    onShow: function (opts) {
      if (opts.focus) setTimeout(function () {
        var tr = wrap.querySelector('tr[data-id="' + CSS.escape(opts.focus) + '"]');
        if (tr) { tr.scrollIntoView({ block: 'center' }); }
      }, 0);
    },
    render: render

})();
</script>

  <script>
/* ═══ js_gantt: диаграмма Ганта ═══
   Верхняя капсула — прогнозные даты из таблицы (пунктир), нижняя — факт.
   Документы и шлюзы — вехи на дате окончания. Зависимости на шкале не рисуем:
   связи в таблице описывают порядок шагов, а не правила расчёта сроков. */
(function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var root, scroller, gw, focusId = null;
  var SCALES = {
    day:     { px: 22,  title: 'Дни',     top: 'month', bot: 'day' },
    week:    { px: 5,   title: 'Недели',  top: 'month', bot: 'week' },
    month:   { px: 1.5, title: 'Месяцы',  top: 'year',  bot: 'month' },
    quarter: { px: 0.55, title: 'Кварталы', top: 'year', bot: 'quarter' }
  };
  var CLS_TITLE = { work: 'Процессы', doc: 'Документы', gate: 'Шлюзы', event: 'События', store: 'Хранилища', other: 'Прочее' };
  var st = {
    scale: A.prefs.get('gScale', null),
    group: A.prefs.get('gGroup', 'tree'),
    cls: A.prefs.get('gCls', ['work', 'doc']),
    sort: A.prefs.get('gSort', 'order'),
    bl: A.prefs.get('gBl', true)          // показывать базовый план, когда он зафиксирован
  };
  // Столбцы слева от шкалы — по ширине экрана: на телефоне только ID и название,
  // иначе таблица занимает весь экран и шкалы не видно
  var COLSET = {
    l: [['id', 54, 'ID'], ['name', 290, 'Наименование'], ['fc', 128, 'Прогноз'], ['ft', 128, 'Факт']],
    m: [['id', 50, 'ID'], ['name', 240, 'Наименование'], ['fc', 118, 'Прогноз']],
    s: [['id', 40, 'ID'], ['name', 132, 'Наименование']]
  };
  var COLS = COLSET.l;
  function sideCells(c) {
    return COLS.map(function (k) { return c[k[0]]; }).join('');
  }

  function chips(box, list, isOn, onClick) {
    box.innerHTML = '';
    list.forEach(function (it) {
      var c = A.h('span', { 'class': 'chip' + (isOn(it[0]) ? ' on' : '') }, esc(it[1]));
      c.onclick = function () { onClick(it[0]); };
      box.appendChild(c);
    });
  }

  // «Смотреть как» исполнитель: видна часть проекта — без «Структуры» (в ней остались бы пустые ветки)
  function eg() { return A.roles && A.roles.scoped() && st.group === 'tree' ? '' : st.group; }
  var clsKey = null;
  function drawCtrl() {
    var scoped = A.roles && A.roles.scoped(), grp = eg();
    chips(A.$('#gGroup', root), (scoped ? [] : [['tree', 'Структура']]).concat([['', 'Без групп'], ['stage', 'Стадия'], ['owner', 'Участник']]),
      function (k) { return grp === k; }, function (k) { st.group = k; A.prefs.set('gGroup', k); render(); });
    var present = ['work', 'doc', 'gate', 'event', 'store', 'other'].filter(function (c) {
      return A.S.data.nodes.some(function (n) { return n.cls === c; });
    });
    // список «Показывать» не пересоздаётся при каждой перерисовке — иначе он закрывался бы после галочки
    if (clsKey !== present.join(',')) {
      clsKey = present.join(',');
      var box = A.$('#gCls', root); box.innerHTML = '';
      box.appendChild(A.checks('Показывать', present.map(function (c) { return { id: c, title: CLS_TITLE[c], on: st.cls.indexOf(c) >= 0 }; }),
        function (ids) { st.cls = ids; A.prefs.set('gCls', st.cls); render(); }));
    }
    chips(A.$('#gScale', root), Object.keys(SCALES).map(function (k) { return [k, SCALES[k].title]; }),
      function (k) { return st.scale === k; }, function (k) { st.scale = k; A.prefs.set('gScale', k); render(); });
    chips(A.$('#gSort', root), grp === 'tree' ? [] : [['order', 'по связям'], ['start', 'по началу']],
      function (k) { return st.sort === k; }, function (k) { st.sort = k; A.prefs.set('gSort', k); render(); });
    A.$('#gSortG', root).hidden = grp === 'tree';
    var d = A.S.data, lg = A.$('#gLegX', root), tb = A.$('#gBlG', root);
    lg.innerHTML = (d.meta.baseline ? '<span class="lg"><i class="l-bl"></i>базовый план</span>' : '') +
      (d.meta.extColumn ? '<span class="lg"><i class="l-ext"></i>ждём ответа</span>' : '');
    // базовый план — переключатель рядом со шкалой: легенда на узком экране скрыта
    tb.hidden = !d.meta.baseline;
    tb.innerHTML = d.meta.baseline ? '<span class="chip' + (st.bl ? ' on' : '') + '" id="gBlT" title="Показать или скрыть базовый план v' + d.meta.baseline.version + ' — тонкая линия над полосой прогноза">План v' + d.meta.baseline.version + '</span>' : '';
    var t = A.$('#gBlT', root);
    if (t) t.onclick = function () { st.bl = !st.bl; A.prefs.set('gBl', st.bl); render(); };
  }

  function render() {
    COLS = COLSET[A.bp()];
    drawCtrl();
    var tree = eg() === 'tree';
    // В «Структуре» альтернативные ветки показываются всегда (приглушённо), поэтому сценарий не фильтрует
    var nodes = A.S.data.nodes.filter(function (n) { return M.match(n, tree) && st.cls.indexOf(n.cls) >= 0; });
    var dated = [], undated = [];
    nodes.forEach(function (n) { (M.interval(n, 'mix') || n.fcEnd || n.factEnd ? dated : undated).push(n); });

    // Диапазон шкалы — по всему, что рисуется в строках: прогноз и факт, окно хозяина у шага цикла,
    // базовый план (когда он показан), окно ожидания ответа. Дата анализа — только если она рядом
    var lo = null, hi = null, showBl = st.bl && !!A.S.data.meta.baseline;
    nodes.forEach(function (n) {
      var ds = [n.fcStart, n.fcEnd, n.factStart, n.factEnd, n.wStart, n.wEnd];
      if (showBl) ds.push(n.blStart, n.blEnd);
      var ex = M.ext(n);
      if (ex && ex.open) ds.push(ex.submitted, ex.due);
      ds.forEach(function (d) {
        if (!d) return; if (!lo || d < lo) lo = d; if (!hi || d > hi) hi = d;
      });
    });
    var asOf = A.S.asOf, asOfOut = false;
    if (lo) {
      var span = D.diff(lo, hi);
      if (asOf >= D.add(lo, -Math.max(30, span * 0.25)) && asOf <= D.add(hi, Math.max(30, span * 0.25))) {
        if (asOf < lo) lo = asOf; if (asOf > hi) hi = asOf;
      } else asOfOut = true;
    }
    A.$('#gNote', root).textContent = asOfOut ? 'Дата анализа ' + D.fmt(asOf) + ' — за пределами шкалы' : '';

    if (!dated.length) {
      gw.innerHTML = '<div class="empty-state"><div class="empty-ico">▤</div><div class="empty-ttl">Нет дат для шкалы</div>' +
        '<div class="empty-sub">' + (nodes.length ? 'У отфильтрованных узлов (' + nodes.length + ') не заполнены прогнозные и фактические даты.' : 'Фильтры не оставили ни одного узла.') + '</div></div>';
      A.setStatus('На шкале 0 · без дат ' + undated.length, '');
      return;
    }
    if (!st.scale) { var dd = D.diff(lo, hi); st.scale = dd < 120 ? 'day' : dd < 500 ? 'week' : 'month'; }
    var sc = SCALES[st.scale];
    drawCtrl();

    var from = M.periodStart(D.add(lo, -7), sc.bot === 'day' ? 'week' : sc.bot);
    var to = D.add(hi, 14);
    var px = sc.px, days = D.diff(from, to);
    var W = Math.ceil(days * px);
    var X = function (iso) { return D.diff(from, iso) * px; };
    var side = COLS.reduce(function (a, b) { return a + b[1]; }, 0);
    var colTpl = COLS.map(function (k) { return k[1] + 'px'; }).join(' ');

    // ── Шкала ──
    function tier(step, cls) {
      return '<div class="g-tier ' + cls + '">' + M.periods(from, to, step).map(function (p) {
        var s = p.start < from ? from : p.start, e = p.end > to ? to : p.end;
        var w = D.diff(s, e) * px; if (w <= 0) return '';
        var lab = step === 'year' ? p.year : step === 'month' && cls === 'top' ? p.label + ' ' + p.year : p.label;
        var now = asOf >= p.start && asOf < p.end;
        return '<div class="g-c' + (now ? ' now' : '') + '" style="width:' + w + 'px">' + (w > 14 ? '<span>' + esc(lab) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    }
    var topStep = sc.top === 'year' ? 'year' : 'month';
    var yearPeriods = function () {   // для яруса «год» периоды строим вручную
      var out = [], y = +from.slice(0, 4);
      while (String(y) + '-01-01' <= to) { out.push({ start: y + '-01-01', end: (y + 1) + '-01-01', year: String(y), label: String(y) }); y++; }
      return out;
    };
    var topHtml = topStep === 'year'
      ? '<div class="g-tier top">' + yearPeriods().map(function (p) {
          var s = p.start < from ? from : p.start, e = p.end > to ? to : p.end, w = D.diff(s, e) * px;
          return w > 0 ? '<div class="g-c" style="width:' + w + 'px"><span>' + p.year + '</span></div>' : '';
        }).join('') + '</div>'
      : tier('month', 'top');
    var hdr = '<div class="g-hdr"><div class="g-hside"><div class="g-hrow" style="grid-template-columns:' + colTpl + '">' +
      COLS.map(function (k) { return '<div class="g-hc">' + k[2] + '</div>'; }).join('') + '</div></div>' +
      '<div class="g-scale" style="width:' + W + 'px">' + topHtml + tier(sc.bot, 'bot') + '</div></div>';

    // ── Сетка ──
    var grid = '';
    M.periods(from, to, sc.bot).forEach(function (p) {
      var x = X(p.start); if (x < 0) return;
      var major = sc.top === 'year' ? p.start.slice(5) === '01-01' : p.start.slice(8) === '01';
      grid += '<div class="g-gl' + (major ? ' mj' : '') + '" style="left:' + x + 'px"></div>';
      if (sc.bot === 'day') {
        var wd = new Date(D.ms(p.start)).getUTCDay();
        if (wd === 6) grid += '<div class="g-we" style="left:' + x + 'px;width:' + (2 * px) + 'px"></div>';
      }
    });
    if (!asOfOut) grid += '<div class="g-today" style="left:' + X(asOf) + 'px" title="Дата анализа ' + D.fmt(asOf) + '"></div>';

    // ── Строки ──
    if (st.sort !== 'start') dated.sort(function (a, b) { return M.flowPos(a.id) - M.flowPos(b.id); });
    if (st.sort === 'start') dated.sort(function (a, b) {
      var ia = M.interval(a, 'mix'), ib = M.interval(b, 'mix');
      return (ia ? ia[0] : a.fcEnd || '').localeCompare(ib ? ib[0] : b.fcEnd || '') || a.order - b.order;
    });
    var cols = 'grid-template-columns:' + colTpl;
    var rows = '';
    if (tree) rows = treeRows(M.outline().items, 0, false, cols, W, X, asOf);
    else M.groupBy(dated, eg()).forEach(function (g) {
      if (g.title) rows += '<div class="g-row ghdr"><div class="g-side">' + esc(g.title) + ' · ' + g.items.length + '</div><div class="g-lane" style="width:' + W + 'px"></div></div>';
      // Шаги цикла — сразу под своим процессом-хозяином, если он в той же группе
      var inG = {}, nested = {};
      g.items.forEach(function (n) { inG[n.id] = true; });
      g.items.forEach(function (n) { if (n.cycleHost && inG[n.cycleHost]) nested[n.id] = true; });
      g.items.forEach(function (n) {
        if (nested[n.id]) return;
        rows += rowHtml(n, cols, W, X, asOf);
        if (n.cycleMembers) g.items.forEach(function (x) { if (nested[x.id] && x.cycleHost === n.id) rows += rowHtml(x, cols, W, X, asOf, true); });
      });
    });
    if (undated.length && !tree) {
      rows += '<div class="g-row ghdr"><div class="g-side">Без дат · ' + undated.length + '</div><div class="g-lane" style="width:' + W + 'px"></div></div>';
      undated.forEach(function (n) { rows += rowHtml(n, cols, W, X, asOf); });
    }

    gw.style.setProperty('--g-side', side + 'px');
    gw.innerHTML = hdr + '<div class="g-body"><div class="g-gridlayer" style="width:' + W + 'px">' + grid + '</div>' + rows + '</div>';

    var late = dated.filter(function (n) { return M.time(n).late; }).length;
    A.setStatus('На шкале <b>' + dated.length + '</b>' + (undated.length ? '<span class="sp">·</span>без дат ' + undated.length : '') +
      (late ? '<span class="sp">·</span>просрочено ' + late : '') + '<span class="sp">·</span>дата анализа ' + D.fmt(asOf),
      'Пунктир — прогноз · сплошная — факт · клик по строке — карточка');

    if (focusId) {
      var r = gw.querySelector('.g-row[data-id="' + CSS.escape(focusId) + '"]');
      if (r) {
        r.classList.add('sel', 'flash');
        var bar = r.querySelector('.g-plan,.g-fc,.g-ms,.g-cyc,.g-sum');
        r.scrollIntoView({ block: 'center' });
        if (bar) scroller.scrollLeft = Math.max(0, bar.offsetLeft - 200);
        setTimeout(function () { r.classList.remove('flash'); }, 1600);
      }
      focusId = null;
    } else if (!scroller.dataset.scrolled && !asOfOut) {
      scroller.scrollLeft = Math.max(0, X(asOf) - 300); scroller.dataset.scrolled = '1';
    }
  }

  // ── Структура: уровни как в MS Project ──
  function idsIn(items, acc) {
    items.forEach(function (it) {
      acc.push(it.id);
      if (it.block && it.block.cols) it.block.cols.forEach(function (c) { idsIn(c.items, acc); });
      if (it.cycle) idsIn(it.cycle, acc);
    });
    return acc;
  }
  function spanOf(ids) {
    var lo = null, hi = null;
    ids.forEach(function (id) {
      var iv = M.interval(M.node(id), 'mix'); if (!iv) return;
      if (!lo || iv[0] < lo) lo = iv[0]; if (!hi || iv[1] > hi) hi = iv[1];
    });
    return lo ? [lo, hi] : null;
  }
  function caretG(key) {
    var c = !!A.S.collapsed[key];
    return '<span class="caret" data-key="' + esc(key) + '">' + (c ? '▸' : '▾') + '</span>';
  }
  function sumRow(id, name, label, iv, pad, key, alt, cols, W, X, cls) {
    var lane = iv ? '<div class="g-sum' + (alt ? ' alt' : '') + '" style="left:' + X(iv[0]) + 'px;width:' + Math.max((D.diff(iv[0], iv[1]) + 1) * (X(D.add(iv[0], 1)) - X(iv[0])), 6) + 'px"></div>' : '<div class="g-nodata">' + esc(label) + '</div>';
    return '<div class="g-row ' + (cls || 'sum') + (alt ? ' alt' : '') + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + '>' +
      '<div class="g-side" style="' + cols + '">' + sideCells({
        id: '<div class="g-cell mute">' + esc(id || '') + '</div>',
        name: '<div class="g-cell name" style="padding-left:' + pad + 'px">' + caretG(key) + '<span class="g-nm" title="' + esc(name.replace(/<[^>]*>/g, '')) + '">' + name + '</span></div>',
        fc: '<div class="g-cell"><span class="fc">' + (iv ? D.fmtS(iv[0]) + ' – ' + D.fmtS(iv[1]) : '') + '</span></div>',
        ft: '<div class="g-cell"></div>' }) + '</div>' +
      '<div class="g-lane" style="width:' + W + 'px">' + lane + '</div></div>';
  }
  function treeRows(items, level, alt, cols, W, X, asOf) {
    var out = '';
    items.forEach(function (it) {
      var n = M.node(it.id), blk = it.block, pad = 8 + level * 18;
      var cycKey = it.cycle && it.cycle.length ? 'cyc:' + n.id : null;
      if (blk && blk.cols) {
        var key = 'fork:' + n.id, all = [];
        blk.cols.forEach(function (c) { idsIn(c.items, all); });
        out += sumRow(n.id, M.kindIcon(n) + ' ' + esc(n.name), '', spanOf(all), pad, key, alt, cols, W, X, 'sum gfork');
        if (!A.S.collapsed[key]) blk.cols.forEach(function (c, ci) {
          var bk = 'br:' + n.id + ':' + ci, bAlt = alt || !c.b.main;
          var lab = 'если «' + esc(c.b.cond) + '»' + (c.b.chosen ? ' · выбрано' : c.b.main ? ' · основная' : ' · альтернатива');
          if (c.cont) { out += sumRow(null, lab, '↓ продолжение ниже', null, pad + 18, bk, bAlt, cols, W, X, 'sum br'); return; }
          out += sumRow(null, lab, 'нет шагов', spanOf(idsIn(c.items, [])), pad + 18, bk, bAlt, cols, W, X, 'sum br');
          if (!A.S.collapsed[bk]) out += treeRows(c.items, level + 2, bAlt, cols, W, X, asOf);
        });
      } else if (st.cls.indexOf(n.cls) >= 0 && M.match(n, true)) {
        out += rowHtml(n, cols, W, X, asOf, level > 0, { pad: pad, caret: cycKey ? caretG(cycKey) : '', alt: alt });
      }
      if (cycKey && !A.S.collapsed[cycKey]) out += treeRows(it.cycle, level + 1, alt, cols, W, X, asOf);
    });
    return out;
  }

  function rowHtml(n, cols, W, X, asOf, child, o) {
    var t = M.time(n), lane = '';
    o = o || {};
    var isOut = n.cls === 'doc', prod = isOut ? M.producer(n) : null;
    if (isOut) o.pad = (o.pad || 8) + 18;
    var fc = n.fcStart && n.fcEnd ? D.fmtS(n.fcStart) + ' – ' + D.fmtS(n.fcEnd) : (n.fcEnd ? D.fmtS(n.fcEnd) : '');
    var fact = n.factStart ? D.fmtS(n.factStart) + ' – ' + (n.factEnd ? D.fmtS(n.factEnd) : '…') : (n.factEnd ? '… – ' + D.fmtS(n.factEnd) : '');
    var dur = function (a, b) { return Math.max(D.diff(a, b) + 1, 1); };
    if (n.cycleHost) {
      // Шаг цикла живёт в окне процесса-хозяина: штриховка на весь интервал
      var iv = M.interval(n, 'mix');
      if (iv) lane += '<div class="g-cyc" style="left:' + X(iv[0]) + 'px;width:' + Math.max(dur(iv[0], iv[1]) * (X(D.add(iv[0], 1)) - X(iv[0])), 6) + 'px" title="Повторяется в окне ' + esc(n.cycleHost) + '"></div>';
      fc = '⟳ окно ' + esc(n.cycleHost);
