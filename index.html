  function buildFilters() {
    var d = S.data, box = $('#fSelects');
    box.innerHTML = '';
    var statusOpts = App.M.statusOptions();
    [['stage', 'Стадия', d.dicts.stages], ['owner', 'Участник', d.dicts.owners],
     ['type', 'Тип', d.dicts.types], ['status', 'Статус', statusOpts]].forEach(function (x) {
      // выбранные значения, которых больше нет в данных, не держим
      S.f[x[0]] = S.f[x[0]].filter(function (v) { return x[2].indexOf(v) >= 0; });
      box.appendChild(msel(x[1], x[2], S.f[x[0]], function (sel) { S.f[x[0]] = sel; filtersChanged(); }));
    });
    // Признаки: несколько отмеченных — узел должен иметь их все
    var defs = FLAG_DEFS.filter(function (f) { return !f.need || f.need(d); });
    var lab = {}; defs.forEach(function (f) { lab[f.id] = f.label; });
    S.f.flags = S.f.flags.filter(function (id) { return id === 'late' || lab[id]; });
    var flagSel = S.f.flags.filter(function (id) { return lab[id]; }).map(function (id) { return lab[id]; });
    var fm = msel('Признаки', defs.map(function (f) { return f.label; }), flagSel, function (sel) {
      var ids = defs.filter(function (f) { return sel.indexOf(f.label) >= 0; }).map(function (f) { return f.id; });
      S.f.flags = (S.f.flags.indexOf('late') >= 0 ? ['late'] : []).concat(ids);
      filtersChanged();
    }, 'Если отмечено несколько — показываются узлы, у которых есть все отмеченные признаки');
    fm.classList.add('msel-flags');
    var sc = $('#fScen'); sc.innerHTML = '';
    var offN = d.nodes.filter(function (n) { return !n.inScenario; }).length;
    [['main', 'Основной сценарий'], ['all', 'Все ветки']].forEach(function (x) {
      var c = h('span', { 'class': 'chip' + (S.scenario === x[0] ? ' on' : ''),
        title: x[0] === 'main' ? 'На развилках сценария — только выбранная ветка или ветка по умолчанию. Вне сценария: ' + offN : 'Показывать все ветки развилок' }, esc(x[1]) + (x[0] === 'all' && offN ? ' <span style="opacity:.6">+' + offN + '</span>' : ''));
      c.onclick = function () { S.scenario = x[0]; prefs.set('scenario', x[0]); buildFilters(); filtersChanged(); };
      sc.appendChild(c);

    var fl = $('#fFlags'); fl.innerHTML = '';
    var late = h('span', { 'class': 'chip flag late' + (S.f.flags.indexOf('late') >= 0 ? ' on' : ''),
      title: 'Окончание или начало позже прогноза на дату анализа' }, esc(FLAG_LATE.label));
    late.onclick = function () {
      var i = S.f.flags.indexOf('late');
      i >= 0 ? S.f.flags.splice(i, 1) : S.f.flags.unshift('late');
      late.classList.toggle('on');
      filtersChanged();

    fl.appendChild(late);
    fl.appendChild(fm);
    $('#fQ').value = S.f.q;
    markFilters();

  /** Сколько фильтров включено — для кнопки «Фильтры» на телефоне и кнопки сброса */
  function filterCount() {
    var f = S.f;
    return (f.q ? 1 : 0) + f.stage.length + f.owner.length + f.type.length + f.status.length + f.flags.length;
  }

    $('#btnFilters').classList.toggle('has', !!n);
  }

  function resetFilters() {

    buildFilters(); filtersChanged();
  }

  /** Мультиселект: пустой выбор = фильтр не действует */
  function msel(label, options, selected, onChange, note) {
    var wrap = h('div', { 'class': 'msel' });
    var btn = h('button', { 'class': 'msel-btn', type: 'button' });
    var pop = h('div', { 'class': 'msel-pop' });
    function caption() {
      var n = selected.length;
      btn.innerHTML = '<span class="mtxt">' + esc(n === 1 ? selected[0] : label) + '</span>' + (n > 1 ? '<span class="cnt">' + n + '</span>' : (n === 1 ? '<span class="cnt">1</span>' : '')) + ' ▾';
    }
    function draw() {
      pop.innerHTML = '';
      var all = h('label', { 'class': 'msel-item msel-all' }, '<input type="checkbox"' + (!selected.length ? ' checked' : '') + '> Все');
      all.querySelector('input').onchange = function () { selected.length = 0; draw(); caption(); onChange(selected.slice()); };
      pop.appendChild(all);
      options.forEach(function (o) {
        var it = h('label', { 'class': 'msel-item' }, '<input type="checkbox"' + (selected.indexOf(o) >= 0 ? ' checked' : '') + '> ' + esc(o));
        it.querySelector('input').onchange = function (e) {
          var i = selected.indexOf(o);
          if (e.target.checked && i < 0) selected.push(o);
          if (!e.target.checked && i >= 0) selected.splice(i, 1);
          pop.querySelector('.msel-all input').checked = !selected.length;
          caption(); onChange(selected.slice());
        };
        pop.appendChild(it);
      });
      if (note) pop.appendChild(h('div', { 'class': 'msel-note' }, esc(note)));
    }
    selected = selected.slice();
    btn.onclick = function (e) { e.stopPropagation(); togglePop(wrap); };
    pop.onclick = function (e) { e.stopPropagation(); };
    caption(); draw();
    wrap.appendChild(btn); wrap.appendChild(pop);
    return wrap;
  }

  /** Выпадающий список с галочками «что показывать»: в отличие от фильтра, пустой выбор — пусто */
  function checks(label, items, onChange) {
    var wrap = h('div', { 'class': 'msel checks' });
    var btn = h('button', { 'class': 'msel-btn', type: 'button', title: label });
    var pop = h('div', { 'class': 'msel-pop' });
    function caption() {
      var on = items.filter(function (x) { return x.on; });
      var txt = !on.length ? 'ничего' : on.length === items.length ? 'всё' : on.map(function (x) { return x.title.toLowerCase(); }).join(', ');
      btn.innerHTML = '<span class="mtxt"><span class="gl">' + esc(label) + ': </span>' + esc(txt) + '</span> ▾';
    }
    items.forEach(function (it) {
      var el = h('label', { 'class': 'msel-item' }, '<input type="checkbox"' + (it.on ? ' checked' : '') + '> ' + esc(it.title));
      el.querySelector('input').onchange = function (e) {
        it.on = e.target.checked; caption();
        onChange(items.filter(function (x) { return x.on; }).map(function (x) { return x.id; }));
      };
      pop.appendChild(el);
    });
    btn.onclick = function (e) { e.stopPropagation(); togglePop(wrap); };
    pop.onclick = function (e) { e.stopPropagation(); };
    caption();
    wrap.appendChild(btn); wrap.appendChild(pop);
    return wrap;
  }

  /** Всплывающие списки открываются поверх всего (position:fixed), иначе их обрезает
      панель с горизонтальной прокруткой на узком экране */
  function togglePop(wrap) {
    var was = wrap.classList.contains('open');
    closePops();
    if (was) return;
    wrap.classList.add('open');
    var pop = wrap.querySelector('.msel-pop'), r = wrap.getBoundingClientRect();
    pop.style.position = 'fixed';
    pop.style.top = Math.round(r.bottom + 5) + 'px';
    pop.style.maxHeight = Math.max(160, innerHeight - r.bottom - 16) + 'px';
    pop.style.left = Math.round(Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8))) + 'px';
  }
  function closePops() { $$('.msel.open').forEach(function (m) { m.classList.remove('open'); }); }

  /** Ширина экрана: s — телефон, m — планшет и узкое окно, l — остальное */

  // ── Модальное окно, тосты, подсказки, предупреждения ──

    if (action) {

      b.onclick = function () { t.remove(); action.fn(); };

  /**
   * Скопировать текст. Сначала — сразу, в том же нажатии (execCommand): так работает и во
   * фрейме веб-приложения Apps Script, где асинхронный буфер обмена браузер может запретить.
   * Не вышло — navigator.clipboard; не вышло и так — окно с выделенным текстом, скопировать руками.
   */
  function copyText(text, okMsg) {
    var done = function () { toast(okMsg || 'Скопировано', 'ok'); };
    var ok = false, ta = h('textarea', { 'class': 'copy-ta', readonly: 'readonly' }), focus = document.activeElement;
    ta.value = text; document.body.appendChild(ta);
    try { ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (focus && focus.focus) try { focus.focus(); } catch (e) {}
    if (ok) { done(); return; }
    var manual = function () {
      openModal('<div class="mo-head"><div class="mo-head-in"><div class="mo-id"><div class="mo-sub">Скопируйте вручную</div><div class="mo-title" style="font-size:16px">Браузер не дал доступ к буферу обмена</div></div></div></div>' +
        '<div class="mo-body one"><textarea class="copy-box" readonly>' + esc(text) + '</textarea></div>' +
        '<div class="mo-foot"><span class="foot-note">Выделено — нажмите Ctrl+C (⌘C)</span><button class="btn" data-close>Закрыть</button></div>', 'narrow');
      var box = $('#modal .copy-box'); if (box) box.select();
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, manual); return; }
    } catch (e) {}
    manual();
  }

  // ── Адрес страницы: ?id=P24&view=flow — открыть шаг и вид по ссылке ──
  var url = {
    params: function () {
      var p = {};
      if (S.view && S.view !== 'summary') p.view = S.view;
      if (S.cur) p.id = S.cur;
      return p;
    },
    /** Ссылка на шаг (или текущий вид), которую можно отправить коллеге */
    link: function (id, view) {
      var p = {}; if (view && view !== 'summary') p.view = view; if (id) p.id = id;
      var qs = Object.keys(p).map(function (k) { return k + '=' + encodeURIComponent(p[k]); }).join('&');

  <script>
