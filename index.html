    cy.on('mouseout', 'node', function () { A.tip(null); });
    cy.on('viewport', function () { A.tip(null); overlaysSoon(); });
    cy.on('resize', overlaysSoon);   // окно уже/шире: полосы стадий и подписи дорожек — по новой ширине
    needBuild = false; lastVisKey = null;
  }

  // ── Граф рисунка: шлюзы слияния и ветвления ──
  // Связи таблицы не меняются — меняется только то, как они нарисованы. Каждая
  // линия рисунка помнит, какие связи таблицы она изображает (lis): по ним идут
  // подсветка окружения и приглушение фильтром.
  //  • Входы шага, которые «ждём все» (столбец «Ожидание входов» пуст или «Ждём все»),
  //    сходятся в ромбе «+». Одинаковый набор входов у нескольких шагов — один ромб.
  //  • Входы «Достаточно одной» и возвраты на доработку сходятся в ромбе «○»;
  //    если у шага есть и «все», и «любой», ромб «+» впадает в «○».
  //  • Несколько параллельных выходов процесса расходятся из ромба «+».
  //    Документ — результат процесса — висит на процессе напрямую.
  //  • Ромб шлюза-решения сам собирает входы, перед ним «○» не ставится.
  //  • Итерации цикла идут к процессу-хозяину напрямую: они не условие его старта.
  function displayGraph(visible) {
    var d = A.S.data, vn = {}, list = [], E = {}, edges = [], chain = {};
    var links = d.links.filter(function (l) { return visible[l.from] && visible[l.to]; });
    function vnode(id, o) { if (!vn[id]) { o.id = id; vn[id] = o; list.push(o); } return vn[id]; }
    function src(ls) { return ls.map(function (l) { return l.from; }); }
    if (st.gw) {
      var ins = {};
      links.forEach(function (l) { (ins[l.to] = ins[l.to] || []).push(l); });
      Object.keys(ins).forEach(function (t) {
        var n = M.node(t), L = ins[t];
        var all = L.filter(function (l) { return l.cyc !== 'iterate' && !l.ret && l.waitKey !== 'any'; });
        var any = L.filter(function (l) { return l.cyc !== 'iterate' && (l.ret || l.waitKey === 'any'); });
        var o = null, p = null;
        if (n.cls !== 'gate' && any.length && any.length + (all.length ? 1 : 0) >= 2)
          o = vnode('gw:o:' + t, { kind: 'or', stage: 2, anchor: t, targets: [t], allSrc: src(all),
            ins: src(any.filter(function (l) { return !l.ret; })), rets: src(any.filter(function (l) { return l.ret; })) });
        if (all.length >= 2) {
          var key = src(all).sort();
          p = vnode('gw:a:' + key.join('+'), { kind: 'and', stage: 1, anchor: t, targets: [], ins: key });
          if (p.targets.indexOf(t) < 0) p.targets.push(t);
        }
        var tail = o ? [o.id, t] : [t];
        all.forEach(function (l) { chain[l.i] = p ? [p.id].concat(tail) : tail; });
        any.forEach(function (l) { chain[l.i] = tail; });
      });
      var outs = {};
      links.forEach(function (l) {
        if (M.node(l.from).cls === 'gate' || l.ret || l.cyc === 'spawn' || l.cyc === 'iterate' || M.node(l.to).cls === 'doc') return;
        (outs[l.from] = outs[l.from] || []).push(l);
      });
      Object.keys(outs).forEach(function (s) {
        var heads = [];
        outs[s].forEach(function (l) { var h = (chain[l.i] || [l.to])[0]; if (heads.indexOf(h) < 0) heads.push(h); });
        if (heads.length < 2) return;
        var x = vnode('gw:s:' + s, { kind: 'split', stage: 0, anchor: s, outs: [] });
        outs[s].forEach(function (l) {
          chain[l.i] = [x.id].concat(chain[l.i] || [l.to]);
          if (x.outs.indexOf(l.to) < 0) x.outs.push(l.to);
        });
      });
    }
    links.forEach(function (l) {
      var path = [l.from].concat(chain[l.i] || [l.to]);
      for (var i = 0; i < path.length - 1; i++) {
        var k = path[i] + '>' + path[i + 1], e = E[k];
        if (!e) { e = E[k] = { id: 'x' + edges.length, from: path[i], to: path[i + 1], lis: [] }; edges.push(e); }
        if (e.lis.indexOf(l.i) < 0) e.lis.push(l.i);
      }
    });
    edges.forEach(function (e) {
      var L = e.lis.map(function (li) { return d.links[li]; });
      var every = function (f) { return L.every(f); }, cls = [];
      e.ret = every(function (l) { return l.ret; });
      if (e.ret) cls.push('ret');
      if (every(function (l) { return l.cyc === 'iterate'; })) cls.push('iter');
      if (every(function (l) { return l.cyc === 'spawn'; })) cls.push('spawn');
      if (every(function (l) { return altLink[l.i]; })) cls.push('alt');
      var own = every(function (l) { return l.from === e.from; });   // линия начинается у источника связи
      if (own && L[0].tone && every(function (l) { return l.tone === L[0].tone; })) cls.push(L[0].tone);
      e.label = own && L[0].condition && every(function (l) { return l.condition === L[0].condition; }) ? short(L[0].condition, 22) : '';
      if (vn[e.to]) cls.push('gwin');
      e.cls = cls.join(' ');
    });
    return { vnodes: vn, vlist: list, edges: edges };
  }

  function idList(ids) {
    return ids.map(function (id) { var n = M.node(id); return '· <b>' + esc(id) + '</b> ' + esc(short(n ? n.name : '', 46)); }).join('<br>');
  }
  function gwTip(v) {
    if (v.kind === 'split') return '<b>+ параллельно</b><br>После ' + esc(v.anchor) + ' запускаются все:<br>' + idList(v.outs);
    if (v.kind === 'and') return '<b>+ ждём все входы</b><br>' + (v.targets.length > 1 ? 'Шаги ' + v.targets.map(esc).join(', ') + ' начнутся' : 'Шаг ' + esc(v.targets[0]) + ' начнётся') +
      ', когда готовы все:<br>' + idList(v.ins);
    var any = v.ins.slice();
    var h = '<b>○ хватает любого входа</b><br>' + esc(v.anchor) + ' начнётся после любого из:<br>' + idList(any);
    if (v.allSrc.length > 1) h += (any.length ? '<br>' : '') + '· или когда готовы все: ' + v.allSrc.map(esc).join(', ');
    else if (v.allSrc.length === 1) h += (any.length ? '<br>' : '') + idList(v.allSrc);
    if (v.rets.length) h += '<br><span style="color:var(--ink3)">↺ возврат на доработку из ' + v.rets.map(esc).join(', ') + '</span>';
    return h;
  }

  /** Координаты: dagre слева направо; в режиме «Дорожки» Y задаётся участником */
  function layout(visible) {
    var d = A.S.data, free = st.layout !== 'lanes';
    var frames = free && st.cycles === 'open';
    var g = new dagre.graphlib.Graph({ compound: frames });
    g.setGraph({ rankdir: 'LR', nodesep: 18, ranksep: 46, marginx: 20, marginy: 20 });
    g.setDefaultEdgeLabel(function () { return {}; });
    d.nodes.forEach(function (n) {
      if (!visible[n.id]) return;
      var s = dims(n.id);
      g.setNode(n.id, { width: s.w, height: s.lbl ? s.h + 34 : s.h });
    });
    if (free) {
      // свободная раскладка: шлюзы — обычные узлы, dagre прокладывает линии через них
      dg.vlist.forEach(function (v) { g.setNode(v.id, { width: GW, height: GW }); });
      dg.edges.forEach(function (e) { if (!e.ret) g.setEdge(e.from, e.to); });
    } else {
      d.links.forEach(function (l) { if (!l.ret && visible[l.from] && visible[l.to]) g.setEdge(l.from, l.to); });
    }
    // Свободная раскладка: процесс-хозяин и шаги его цикла — одна группа, вокруг неё рамка
    var hostIds = [], frameOf = {};
    if (frames) {
      d.nodes.forEach(function (n) {
        if (!n.cycleMembers || !visible[n.id]) return;
        var mem = n.cycleMembers.filter(function (id) { return visible[id]; });
        if (!mem.length) return;
        hostIds.push(n.id);
        g.setNode('frame:' + n.id, { label: '' });
        [n.id].concat(mem).forEach(function (id) { g.setParent(id, 'frame:' + n.id); frameOf[id] = 'frame:' + n.id; });
      });
      dg.vlist.forEach(function (v) { if (v.kind !== 'split' && frameOf[v.anchor]) g.setParent(v.id, frameOf[v.anchor]); });
    }
    dagre.layout(g);
    var pos = {};
    g.nodes().forEach(function (id) { if (id.indexOf('frame:') === 0) return; var p = g.node(id); pos[id] = { x: p.x, y: p.y }; });
    cy.remove('node.lane, node.frame');
    if (frames) cy.add(hostIds.map(function (h) {
      var f = g.node('frame:' + h);
      return { group: 'nodes', data: { id: 'frame:' + h, label: '⟳ Цикл внутри ' + h, w: f.width + 24, h: f.height + 24, tw: 300 },
        position: { x: f.x, y: f.y }, classes: 'frame', locked: true, grabbable: false, selectable: false };
    }));
    if (free) return { pos: pos, g: g, lanes: false, laneList: [] };
    return lanes(pos, visible);
  }

  /** Дорожки: строка на участника; шлюзы — узкими колонками в промежутках между колонками шагов */
  function lanes(pos, visible) {
    var d = A.S.data, ROW = 88, PAD = 10, GAP = 20, G = 24;
    var owners = d.dicts.owners.filter(function (o) { return d.nodes.some(function (n) { return visible[n.id] && n.owner === o; }); });
    if (d.nodes.some(function (n) { return visible[n.id] && !n.owner; })) owners.push('—');
    // внутри участника узлы раскладываются по под-строкам без наложений
    var top = 0, lanesOut = [];
    owners.forEach(function (o, li) {
      var items = d.nodes.filter(function (n) { return visible[n.id] && (n.owner || '—') === o; })
        .sort(function (a, b) { return pos[a.id].x - pos[b.id].x || pos[a.id].y - pos[b.id].y; });
      var rightEdge = [];
      items.forEach(function (n) {
        var s = dims(n.id), wl = s.lbl ? 120 : s.w;
        var left = pos[n.id].x - wl / 2, r = 0;
        while (r < rightEdge.length && rightEdge[r] + GAP > left) r++;
        rightEdge[r] = pos[n.id].x + wl / 2;
        pos[n.id].y = top + PAD + r * ROW + ROW / 2 - 8;
      });
      var h = Math.max(rightEdge.length, 1) * ROW + PAD * 2;
      lanesOut.push({ id: 'lane:' + li, label: o, y: top + h / 2, h: h, alt: li % 2 === 1 });
      top += h + 4;
    });
    // колонки шагов
    var ids = Object.keys(pos), xs = [], colOf = {}, half = [];
    ids.forEach(function (id) { var x = Math.round(pos[id].x); if (xs.indexOf(x) < 0) xs.push(x); });
    xs.sort(function (a, b) { return a - b; });
    ids.forEach(function (id) {
      var k = xs.indexOf(Math.round(pos[id].x)), s = dims(id);
      colOf[id] = k; half[k] = Math.max(half[k] || 0, s.lbl ? 60 : s.w / 2);
    });
    // шлюз встаёт в промежуток рядом со своим шагом: ветвление — справа от источника,
    // слияние — слева от самого левого из шагов, которые оно питает
    var chans = {};
    dg.vlist.forEach(function (v) {
      if (v.kind === 'split') { v.at = v.anchor; v.ch = colOf[v.anchor]; }
      else {
        var best = null;
        v.targets.forEach(function (t) {
          if (best === null || colOf[t] < colOf[best] || (colOf[t] === colOf[best] && pos[t].y < pos[best].y)) best = t;
        });
        v.at = best; v.ch = colOf[best] - 1;
      }
      (chans[v.ch] = chans[v.ch] || {})[v.stage] = true;
    });
    // промежуток со шлюзами раздвигается: ветвления, затем «+», затем «○», с зазором G
    var shift = 0, sh = [], gx = {};
    for (var k = -1; k < xs.length; k++) {
      if (k >= 0) sh[k] = shift;
      var stg = chans[k] ? Object.keys(chans[k]).map(Number).sort() : [];
      if (!stg.length) continue;
      var m = stg.length, need = (m + 1) * G + m * GW;
      var inner = k >= 0 && k < xs.length - 1;
      var Wc = inner ? (xs[k + 1] - half[k + 1]) - (xs[k] + half[k]) : need;
      var R = k >= 0 ? xs[k] + shift + half[k] : xs[0] - half[0] - need;
      var off = Math.max(0, (Wc - need) / 2);
      stg.forEach(function (sg, j) { gx[k + ':' + sg] = R + off + G + GW / 2 + j * (G + GW); });
      if (inner) shift += Math.max(0, need - Wc);
    }
    ids.forEach(function (id) { pos[id].x += sh[colOf[id]]; });
    var taken = {};
    dg.vlist.forEach(function (v) {
      var x = gx[v.ch + ':' + v.stage], y = pos[v.at].y, key;
      while (taken[key = Math.round(x) + ':' + Math.round(y)]) y += GW + 10;
      taken[key] = 1;
      pos[v.id] = { x: x, y: y };
    });
    var minX = Infinity, maxX = -Infinity;
    Object.keys(pos).forEach(function (id) { minX = Math.min(minX, pos[id].x); maxX = Math.max(maxX, pos[id].x); });
    cy.add(lanesOut.map(function (l) {
      return { group: 'nodes', data: { id: l.id, label: '', w: maxX - minX + 140, h: l.h, tw: 10 },
        position: { x: (minX + maxX) / 2, y: l.y }, classes: 'lane' + (l.alt ? ' alt' : ''), locked: true, grabbable: false, selectable: false };
    }));
    return { pos: pos, lanes: true, ROW: ROW, laneList: lanesOut, minX: minX - 70, maxX: maxX + 70 };
  }

  // ── Разводка линий ──
  // «Дорожки»: ортогональная разводка по каналам. Между колонками — вертикальные
  // каналы, между строками — горизонтальные коридоры; линия выходит из правой
  // стороны блока и входит в левую сторону цели — не через блоки. Все линии,
  // входящие в один шлюз, идут по общему «стволу» и сливаются в одну стрелку;
  // линии из шлюза ветвления так же расходятся от общего ствола.
  // «Свободная»: ломаная по точкам, которые dagre проложил в обход узлов.
  function setRoute(ed, S, T, sc, tc, pts) {
    var o = { 'source-endpoint': (S.x - sc.x).toFixed(1) + 'px ' + (S.y - sc.y).toFixed(1) + 'px',
              'target-endpoint': (T.x - tc.x).toFixed(1) + 'px ' + (T.y - tc.y).toFixed(1) + 'px' };
    var dx = T.x - S.x, dy = T.y - S.y, l2 = dx * dx + dy * dy;
    if (!pts.length || l2 < 4) { o['curve-style'] = 'straight'; ed.style(o); return; }
    var l = Math.sqrt(l2), nx = -dy / l, ny = dx / l, ws = [], ds = [];
    pts.forEach(function (p) {
      var px = p.x - S.x, py = p.y - S.y;
      ws.push(((px * dx + py * dy) / l2).toFixed(4)); ds.push((px * nx + py * ny).toFixed(1));
    });
    o['curve-style'] = 'segments'; o['edge-distances'] = 'endpoints';
    o['segment-weights'] = ws.join(' '); o['segment-distances'] = ds.join(' '); o['segment-radii'] = 6;
    ed.style(o);
  }
  function routeFree(L) {
    dg.edges.forEach(function (e) {
      var ed = cy.getElementById(e.id), ge = !e.ret && L.g.edge(e.from, e.to);
      if (!ge || !ge.points || ge.points.length < 2) { ed.style({ 'curve-style': 'bezier', 'control-point-step-size': 50 }); return; }
      var P = ge.points;
      setRoute(ed, P[0], P[P.length - 1], L.pos[e.from], L.pos[e.to], P.slice(1, -1));
    });
  }
  function routeLanes(L) {
    var pos = L.pos, ROW = L.ROW, info = {};
    Object.keys(pos).forEach(function (id) {
      var s = dims(id), v = dg.vnodes[id] || null;
      info[id] = { x: pos[id].x, y: pos[id].y, hw: s.w / 2, hh: s.h / 2, fw: s.lbl ? 60 : s.w / 2, pin: s.lbl || !!v, gw: v };
    });
    // колонки и каналы между ними (шлюзы — тоже колонки, узкие)
    var xs = [], colOf = {}, half = [];
    Object.keys(info).forEach(function (id) { var x = Math.round(info[id].x); if (xs.indexOf(x) < 0) xs.push(x); });
    xs.sort(function (a, b) { return a - b; });
    Object.keys(info).forEach(function (id) {
      var k = xs.indexOf(Math.round(info[id].x)); colOf[id] = k; half[k] = Math.max(half[k] || 0, info[id].fw);
    });
    var chR = xs.map(function (x, k) { return k < xs.length - 1 ? (x + half[k] + xs[k + 1] - half[k + 1]) / 2 : x + half[k] + 18; });
    var chL = function (k) { return k > 0 ? chR[k - 1] : xs[0] - half[0] - 18; };
    var chW = function (k) { return k >= 0 && k < xs.length - 1 ? (xs[k + 1] - half[k + 1]) - (xs[k] + half[k]) : 36; };
    // строки (по шагам, не по шлюзам) и коридоры между ними
    var ys = [];
    Object.keys(info).forEach(function (id) { if (info[id].gw) return; var y = Math.round(info[id].y); if (ys.indexOf(y) < 0) ys.push(y); });
    ys.sort(function (a, b) { return a - b; });
    var corr = [ys[0] - ROW / 2];
    for (var i = 0; i < ys.length - 1; i++) corr.push((ys[i] + ys[i + 1]) / 2);
    corr.push(ys[ys.length - 1] + ROW / 2);
    function pickCorr(y1, y2) {
      var best = null, bs = Infinity;
      corr.forEach(function (c) {
        var sc = Math.abs(y1 - c) + Math.abs(c - y2) + Math.abs(c - y2) * 0.01;
        if (sc < bs) { bs = sc; best = c; }
      });
      return best;
    }
    // точки входа/выхода раздвигаются по стороне блока, если линий несколько;
    // линия к шлюзу на той же строке — по центру стороны, чтобы шла прямо
    var outs = {}, ins = {};
    dg.edges.forEach(function (e) { (outs[e.from] = outs[e.from] || []).push(e); (ins[e.to] = ins[e.to] || []).push(e); });
    var endOff = {};
    function spread(list, id, key, other) {
      var n = info[id]; if (!list) return;
      list.sort(function (a, b) { return info[a[other]].y - info[b[other]].y || info[a[other]].x - info[b[other]].x; });
      var k = list.length, step = n.pin || k < 2 ? 0 : Math.min(10, (2 * n.hh - 14) / (k - 1));
      var offs = list.map(function (e, i) { return (i - (k - 1) / 2) * step; });
      var j = -1;
      list.forEach(function (e, i) { var o = info[e[other]]; if (j < 0 && o.gw && Math.abs(o.y - n.y) < 1) j = i; });
      if (j >= 0 && step) {
        var d0 = offs[j], cap = n.hh - 6;
        offs = offs.map(function (v) { return Math.max(-cap, Math.min(cap, v - d0)); });
      }
      list.forEach(function (e, i) { endOff[key + e.id] = offs[i]; });
    }
    Object.keys(info).forEach(function (id) { spread(outs[id], id, 's', 'to'); spread(ins[id], id, 't', 'from'); });
    // занятость каналов и коридоров: соседние линии сдвигаются на 5 px
    var use = {};
    function slot(k) {
      var key = 'c' + k, i = use[key] = (use[key] || 0) + 1; i -= 1;
      var v = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 5, cap = Math.max(0, Math.min(14, chW(k) / 2 - 5));
      return Math.max(-cap, Math.min(cap, v));
    }
    function cslot(key, cap) {
      var i = use[key] = (use[key] || 0) + 1; i -= 1;
      var v = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 5;
      return Math.max(-cap, Math.min(cap, v));
    }
    function blocked(a, b) {
      var lo = Math.min(a.x, b.x), hi = Math.max(a.x, b.x);
      return Object.keys(info).some(function (id) { var n = info[id]; return Math.abs(n.y - a.y) < 1 && n.x > lo + 1 && n.x < hi - 1; });
    }
    // у каждого шлюза — своя дорожка в канале («ствол»); стволы занимают места первыми
    var trunk = {};
    dg.vlist.forEach(function (v) {
      var c = colOf[v.id];
      trunk[v.id] = v.kind === 'split' ? chR[c] + slot(c) : chL(c) + slot(c - 1);
    });
    dg.edges.forEach(function (e) {
      var a = info[e.from], b = info[e.to], ed = cy.getElementById(e.id);
      var S = { x: a.x + a.hw, y: a.y + (endOff['s' + e.id] || 0) }, T = { x: b.x - b.hw, y: b.y + (endOff['t' + e.id] || 0) };
      var ks = colOf[e.from], kt = colOf[e.to], pts;
      var tIn = b.gw && b.gw.kind !== 'split' ? trunk[e.to] : null;
      var tOut = a.gw && a.gw.kind === 'split' ? trunk[e.from] : null;
      if (kt === ks + 1 || (kt > ks + 1 && Math.abs(a.y - b.y) < 1 && !blocked(a, b))) {
        if (Math.abs(S.y - T.y) < 0.5) pts = [];
        else {
          var cx = tIn != null ? tIn : (tOut != null && kt === ks + 1) ? tOut : chL(kt) + slot(kt - 1);
          pts = [{ x: cx, y: S.y }, { x: cx, y: T.y }];
        }
      } else {
        var yc = pickCorr(S.y, T.y); yc += cslot('y' + yc, 12);
        var c1 = tOut != null ? tOut : chR[ks] + slot(ks), c2 = tIn != null ? tIn : chL(kt) + slot(kt - 1);
        pts = [{ x: c1, y: S.y }, { x: c1, y: yc }, { x: c2, y: yc }, { x: c2, y: T.y }];
      }
      setRoute(ed, S, T, a, b, pts);
    });
  }

  // ── Состояние: фильтр, выделение, окружение ──
  function apply() {
    if (!cy) return;
    var d = A.S.data, anyF = M.anyFilter();
    var match = {}; d.nodes.forEach(function (n) { if (!anyF || M.match(n)) match[n.id] = true; });
    st.sel = st.sel.filter(function (id) { return !!M.node(id); });
    var hl = st.sel.length ? M.neighbours(st.sel, { depth: st.depth, dir: st.dir, transparent: st.transparent, useRet: st.useRet }) : null;

    var visible = {};
    d.nodes.forEach(function (n) {
      var v = st.mode === 'hide' ? !!match[n.id] : true;
      if (st.onlyHl && hl) v = hl.nodes[n.id] !== undefined;
      if (st.cycles === 'closed' && n.cycleHost) v = false;
      if (st.sel.indexOf(n.id) >= 0) v = true;
      if (v) visible[n.id] = true;
    });

    var visKey = st.layout + '|' + st.cycles + '|' + (st.gw ? 'g' : '') + '|' + Object.keys(visible).join(',');
    var relayout = visKey !== lastVisKey;
    cy.batch(function () {
      if (relayout) {
        dg = displayGraph(visible);
        lay = layout(visible);
        cy.remove(cy.edges());
        cy.remove('node.gw');
        cy.nodes().not('.lane, .frame').forEach(function (nd) { if (lay.pos[nd.id()]) nd.position(lay.pos[nd.id()]); });
        cy.add(dg.vlist.map(function (v) {
          var an = M.node(v.anchor);
          return { group: 'nodes', data: { id: v.id, label: '', w: GW, h: GW, tw: 10 }, position: lay.pos[v.id],
            classes: 'gw gw-' + v.kind + (an && !an.inScenario ? ' off' : '') };
        }));
        cy.add(dg.edges.map(function (e) {
          return { group: 'edges', data: { id: e.id, source: e.from, target: e.to, lis: e.lis, label: e.label }, classes: e.cls };
        }));
        if (lay.lanes) routeLanes(lay); else routeFree(lay);
        d.nodes.forEach(function (n) { if (n.cycleMembers) cy.getElementById(n.id).data('label', label(n)); });
      }
      cy.nodes().not('.lane, .frame, .gw').forEach(function (nd) {
        var id = nd.id(), n = M.node(id), t = M.time(n);
        nd.removeClass('hid dim hl sel s-work s-done s-late s-na');
        if (!visible[id]) { nd.addClass('hid'); return; }
        nd.addClass('s-' + (t.vis === 'none' ? 'none' : t.vis));
        var dim = (st.mode === 'dim' && anyF && !match[id]) || (hl && hl.nodes[id] === undefined);
        if (dim) nd.addClass('dim');
        if (hl && hl.nodes[id] !== undefined && st.sel.indexOf(id) < 0) nd.addClass('hl');
        if (st.sel.indexOf(id) >= 0) nd.addClass('sel');
      });
      // линия рисунка приглушена, если приглушены все связи, которые она изображает
      cy.edges().forEach(function (ed) {
        var dimAll = true, hlAny = false;
        ed.data('lis').forEach(function (li) {
          var l = d.links[li];
          var dimE = (st.mode === 'dim' && anyF && (!match[l.from] || !match[l.to])) || (hl && !hl.edges[li]);
          if (!dimE) dimAll = false;
          if (hl && hl.edges[li]) hlAny = true;
        });
        ed.removeClass('dim hl');
        if (dimAll) ed.addClass('dim');
        if (hlAny) ed.addClass('hl');
      });
      cy.nodes('.gw').forEach(function (nd) {
        var es = nd.connectedEdges();
        nd.removeClass('dim hl');
        if (es.length && es.every(function (e) { return e.hasClass('dim'); })) nd.addClass('dim');
        else if (es.some(function (e) { return e.hasClass('hl'); })) nd.addClass('hl');
      });
    });
    if (relayout) {
      lastVisKey = visKey;
      laneList = lay.laneList || [];
      bands = stageBands(lay.pos, visible);
      buildOverlays();
      if (st.onlyHl && hl) fitVisible(); else home();
    }
    if (pendingFocus) {
      var f = cy.getElementById(pendingFocus);
      if (f && f.length && !(st.onlyHl && relayout)) cy.animate({ center: { eles: f }, zoom: Math.max(cy.zoom(), 0.95) }, { duration: 300 });
      pendingFocus = null;
    }
    drawInfo(hl, visible, match);
    drawOverlays();
    var nVis = Object.keys(visible).length;
    A.$('#flEmpty', root).hidden = nVis > 0;
    A.setStatus('На схеме <b>' + nVis + '</b> из ' + d.nodes.length +
      (st.mode === 'dim' && anyF ? '<span class="sp">·</span>подходят под фильтр ' + Object.keys(match).length : '') +
      (st.sel.length ? '<span class="sp">·</span>выбрано ' + st.sel.length + ', в окружении ' + (Object.keys(hl.nodes).length - st.sel.length) : ''),
      (st.gw ? '+ ждём все входы · ○ хватает любого · ' : '') + 'клик — подсветить связи · Shift+клик — добавить · двойной клик — карточка');
  }

  /** Стартовый вид: начало процесса у левого края, масштаб — чтобы подписи читались */
  function home() {
    var els = lay && lay.lanes ? cy.nodes('.lane') : cy.nodes().not('.hid');
    if (!els.length) return;
    var bb = els.boundingBox({ includeLabels: !!(lay && lay.lanes) }), W = cy.width(), H = cy.height();
    if (!(bb.w > 0)) return;
    var z = Math.min(1, Math.max(HOME_ZOOM, (H - 40) / bb.h));
    if (bb.w * z < W - 40 && bb.h * z < H - 40) z = Math.min(1, (W - 40) / bb.w, (H - 40) / bb.h);
    var top = STAGE_H + 8, left = laneW() + 4;
    var y = bb.h * z < H - top ? top + (H - top - bb.h * z) / 2 - bb.y1 * z : top - bb.y1 * z;
    cy.viewport({ zoom: z, pan: { x: left - bb.x1 * z, y: y } });
  }

  /** Окружение — вписать в экран всё видимое, но не крупнее читаемого */
  function fitVisible() {
    var els = cy.nodes().not('.hid, .lane, .frame');
    if (!els.length) return home();
    var phone = A.bp() === 's';
    var bb = els.boundingBox({ includeLabels: true }), W = cy.width() - laneW() - 24, H = cy.height() - STAGE_H - (phone ? 150 : 40);
    // не мельче читаемого: на телефоне лучше прокрутить вбок, чем читать подписи в 6 px
    var z = Math.max(phone ? 0.62 : 0.45, Math.min(1.1, W / bb.w, H / bb.h));
    var x = laneW() + 12 + (W - bb.w * z) / 2 - bb.x1 * z;
    if (bb.w * z > W) {
      // не помещается — выбранный шаг на трети ширины: видно, откуда пришли и куда идём
      var sel = st.sel.length && cy.getElementById(st.sel[0]);
      x = sel && sel.length ? laneW() + W / 3 - sel.position('x') * z : laneW() + 12 - bb.x1 * z;
    }
    // по вертикали — от верха (под полосой стадий): на телефоне снизу панель «Выбрано»
    cy.viewport({ zoom: z, pan: { x: x, y: STAGE_H + 14 - bb.y1 * z } });
  }

  // ── Полосы поверх полотна: стадии сверху, подписи дорожек слева ──
  var STAGE_H = 26;
  function laneW() { return lay && lay.lanes ? (A.bp() === 's' ? 26 : 138) : 0; }
  /** Границы стадий по X: разрез между соседними стадиями там, где меньше всего шагов попадает «не туда» */
  function stageBands(pos, visible) {
    var d = A.S.data, by = {};
    d.nodes.forEach(function (n) { if (visible[n.id] && pos[n.id] && n.stage) (by[n.stage] = by[n.stage] || []).push(pos[n.id].x); });
    var list = d.dicts.stages.filter(function (s) { return by[s]; }).map(function (s) { return { name: s, xs: by[s].sort(function (a, b) { return a - b; }) }; });
    if (!list.length) return [];
    var lo = Infinity, hi = -Infinity;
    list.forEach(function (l) { lo = Math.min(lo, l.xs[0]); hi = Math.max(hi, l.xs[l.xs.length - 1]); });
    var med = function (a) { return a[Math.floor(a.length / 2)]; };
    var cuts = [];
    for (var i = 0; i < list.length - 1; i++) {
      var a = list[i].xs, b = list[i + 1].xs, xs = a.concat(b).sort(function (p, q) { return p - q; });
      var mid = (med(a) + med(b)) / 2, best = null, bc = Infinity;
      for (var k = 0; k < xs.length - 1; k++) {
        if (xs[k + 1] - xs[k] < 1) continue;
        var cut = (xs[k] + xs[k + 1]) / 2;
        var cost = a.filter(function (x) { return x > cut; }).length + b.filter(function (x) { return x < cut; }).length;
        if (cost < bc || (cost === bc && Math.abs(cut - mid) < Math.abs(best - mid))) { bc = cost; best = cut; }
      }
      cuts.push(best == null ? mid : best);
    }
    for (var j = 1; j < cuts.length; j++) cuts[j] = Math.max(cuts[j], cuts[j - 1]);
    var x0 = lay.lanes ? lay.minX : lo - 90, x1 = lay.lanes ? lay.maxX : hi + 90;
    return list.map(function (l, i) { return { name: l.name, x0: i ? cuts[i - 1] : x0, x1: i < cuts.length ? cuts[i] : x1 }; })
      .filter(function (b) { return b.x1 - b.x0 > 1; });
  }
  function buildOverlays() {
    var sg = A.$('#flStages', root), ln = A.$('#flLanes', root), sp = A.$('#flSeps', root);
    sg.innerHTML = (laneList.length ? '<div class="fs-corner">Стадии</div>' : '') + bands.map(function (b, i) {
      return '<div class="fs-b" data-i="' + i + '" title="Перейти к началу стадии «' + esc(b.name) + '»"><span>' + esc(b.name) + '</span></div>';
    }).join('');
    sp.innerHTML = bands.slice(1).map(function () { return '<i></i>'; }).join('');
    ln.innerHTML = laneList.map(function (l) { return '<div class="fl-ln" title="' + esc(l.label) + '"><span>' + esc(l.label) + '</span></div>'; }).join('');
    ln.hidden = !laneList.length;
    sg.hidden = !bands.length;
    root.classList.toggle('has-lanes', !!laneList.length);
    A.$$('.fs-b', sg).forEach(function (e) { e.onclick = function () { jumpStage(+e.dataset.i); }; });
    A.$$('.fl-ln', ln).forEach(function (e) { e.onclick = function (ev) { A.tip('<b>' + esc(e.title) + '</b>', ev); setTimeout(function () { A.tip(null); }, 1800); }; });
  }
  var ovRaf = 0;
  function overlaysSoon() { if (!ovRaf) ovRaf = requestAnimationFrame(function () { ovRaf = 0; drawOverlays(); }); }
  function drawOverlays() {
    if (!cy || !root) return;
    var z = cy.zoom(), p = cy.pan(), W = cy.width(), H = cy.height(), L = laneW();
    var mid = (L + (W - L) / 2 - p.x) / z;
    A.$$('#flStages .fs-b', root).forEach(function (e, i) {
      var b = bands[i], l = p.x + b.x0 * z, r = p.x + b.x1 * z;
      var vl = Math.max(l, L), vr = Math.min(r, W);
      if (vr - vl < 2) { e.style.display = 'none'; return; }
      e.style.display = '';
      e.style.left = vl + 'px'; e.style.width = (vr - vl) + 'px';
      e.classList.toggle('cur', mid >= b.x0 && mid < b.x1);
      e.classList.toggle('narrow', vr - vl < 70);
    });
    A.$$('#flSeps i', root).forEach(function (e, i) {
      var x = p.x + bands[i + 1].x0 * z;
      e.style.display = x > L && x < W ? '' : 'none';
      e.style.left = x + 'px';
    });
    A.$$('#flLanes .fl-ln', root).forEach(function (e, i) {
      var l = laneList[i], t = p.y + (l.y - l.h / 2) * z, h = l.h * z;
      var vt = Math.max(t, STAGE_H), vb = Math.min(t + h, H);
      if (vb - vt < 8) { e.style.display = 'none'; return; }
      e.style.display = ''; e.style.top = vt + 'px'; e.style.height = (vb - vt) + 'px';
      e.classList.toggle('alt', !!l.alt);
    });
  }
  function jumpStage(i) {
    var b = bands[i]; if (!b) return;
    var z0 = cy.zoom(), z = Math.max(z0, HOME_ZOOM);
    // по вертикали на месте остаётся то, что сейчас у верхнего края (под полосой стадий)
    var my = (STAGE_H - cy.pan().y) / z0;
    cy.animate({ zoom: z, pan: { x: laneW() + 10 - b.x0 * z, y: STAGE_H - my * z } }, { duration: 320, complete: drawOverlays });
  }

  /**
   * Enter в поиске: к следующему найденному шагу. Найденные — те же, что в таблице
   * (общие фильтры и сценарий), по ходу процесса. Шаг свёрнутого цикла показывается
   * своим процессом-хозяином. Шаг, скрытый режимом «Только окружение», становится
   * выбранным — схема показывает уже его окружение.
   */
  function searchJump(dir) {
    if (!cy) return;
    var fb = A.$('#flFind', root);
    if (!A.S.f.q) { fb.hidden = true; return; }
    var ids = [];
    A.S.data.nodes.forEach(function (n) {
      if (!M.match(n)) return;
      var id = st.cycles === 'closed' && n.cycleHost && M.node(n.cycleHost) ? n.cycleHost : n.id;
      if (ids.indexOf(id) < 0) ids.push(id);
    });
    ids.sort(function (a, b) { return M.flowPos(a) - M.flowPos(b); });
    if (!ids.length) { fb.hidden = false; fb.innerHTML = 'не найдено'; return; }
    var key = A.S.f.q + '|' + st.cycles + '|' + ids.join(',');
    if (st.jumpKey !== key) { st.jumpKey = key; st.jump = dir > 0 ? -1 : 0; }
    st.jump = (st.jump + dir + ids.length) % ids.length;
    var id = ids[st.jump];
    st.sel = [id];
    apply();
    // шаг уже выбран (st.sel) — без flashClass('sel'): он снял бы выделение через 0,9 с
    var e = cy.getElementById(id);
    if (e && e.length) cy.animate({ center: { eles: e }, zoom: Math.max(cy.zoom(), 0.95) }, { duration: 280 });
    fb.hidden = false;
    fb.innerHTML = '<b>' + (st.jump + 1) + '</b> из ' + ids.length + ' <span class="mute">· Enter — следующий, Shift+Enter — назад</span>';
    if (A.card.isOpen()) A.card.open(id);
  }
  /** Телефон: какой шаг показать первым — то, что сейчас в работе, иначе что можно начинать */
  function seedNode() {
    var list = A.S.data.nodes.filter(function (n) { return n.inScenario && (n.cls === 'work' || n.cls === 'doc' || n.cls === 'gate'); });
    var byFlow = function (a, b) { return M.flowPos(a.id) - M.flowPos(b.id); };
    var w = list.filter(function (n) { return M.readiness(n).state === 'work'; }).sort(byFlow)[0] ||
      list.filter(function (n) { return M.readiness(n).state === 'ready'; }).sort(byFlow)[0] || list.sort(byFlow)[0];
    return w ? w.id : null;
  }

    var dn = M.neighbours(st.sel, { depth: st.depth, dir: 'down', transparent: st.transparent, useRet: st.useRet }).nodes;
    function list(map) {

  }

        '<label class="ck"><input type="checkbox" id="flGw"><span>Шлюзы слияния и ветвления<small>«+» — ждём все входы, «○» — хватает любого входа или это возврат. Только рисунок: в таблицу ничего не добавляется</small></span></label>' +
        '<label class="ck"><input type="checkbox" id="flTr"><span>Окружение: шаг — это процесс<small>шлюзы и документы не тратят шаг</small></span></label>' +
        '<label class="ck"><input type="checkbox" id="flRet"><span>Окружение через возвраты<small>идти и по циклам доработки</small></span></label>' +
      '</div></div>' +
      '<span class="sep"></span>' +
      '<button class="btn btn-clear" id="flHome" title="К началу схемы, читаемый масштаб">⇤</button>' +
      '<button class="btn btn-clear" id="flFit" title="Вписать всю схему в экран">⤢</button>' +
      '<span class="fl-find" id="flFind" hidden></span>';
    A.$$('.chip[data-g]', bar).forEach(function (c) {
      c.onclick = function (e) {
        e.stopPropagation();
        var g = c.dataset.g, v = c.dataset.v;
        st[g] = v; A.prefs.set({ layout: 'flLayout', mode: 'flMode', dir: 'flDir', cycles: 'flCycles' }[g], v);
        syncCtrl(); apply();
      };
    });
    var set = A.$('#flSet', bar);
    A.$('.msel-btn', set).onclick = function (e) { e.stopPropagation(); A.togglePop(set); };
    A.$('.msel-pop', set).onclick = function (e) { e.stopPropagation(); };
    A.$('#flDepth', bar).oninput = function (e) {
      st.depth = +e.target.value; A.$('#flDepthV', bar).textContent = st.depth; A.prefs.set('flDepth', st.depth); apply();
    };
    A.$('#flGw', bar).onchange = function (e) { st.gw = e.target.checked; A.prefs.set('flGw', st.gw); apply(); };
    A.$('#flTr', bar).onchange = function (e) { st.transparent = e.target.checked; A.prefs.set('flTransp', st.transparent); apply(); };
    A.$('#flRet', bar).onchange = function (e) { st.useRet = e.target.checked; A.prefs.set('flRet', st.useRet); apply(); };
    A.$('#flFit', bar).onclick = function () { if (cy) cy.fit(cy.elements().not('.hid'), 30); };
    A.$('#flHome', bar).onclick = function () { if (cy) home(); };
    syncCtrl();
  }
  function syncCtrl() {
    A.$$('.chip[data-g]', root).forEach(function (c) { c.classList.toggle('on', st[c.dataset.g] === c.dataset.v); });
    A.$('#flGw', root).checked = st.gw;
    A.$('#flTr', root).checked = st.transparent;
    A.$('#flRet', root).checked = st.useRet;
  }

  A.register('flow', 'Схема', {
    init: function (el) {
      root = el;
      root.innerHTML = '<div class="fl-bar" id="flBar"></div>' +
        '<div class="fl-stage"><div id="cy"></div>' +
        '<div class="fl-seps" id="flSeps"></div><div class="fl-stages" id="flStages" hidden></div><div class="fl-lanes" id="flLanes" hidden></div>' +
        '<div class="fl-busy" id="flBusy" hidden><div class="spin"></div>Строю схему…</div>' +
        '<div class="fl-info" id="flInfo" hidden></div>' +
        '<div class="fl-empty" id="flEmpty" hidden><div class="empty-state"><div class="empty-ttl">Нечего показать</div><div class="empty-sub">Фильтры скрыли все узлы. Сбросьте их или в «Виде схемы» выберите «Приглушать».</div></div></div>' +
        '<div class="fl-legend">' +
          '<span class="lg"><i class="kind work"></i>процесс</span><span class="lg"><i class="kind doc"></i>артефакт</span>' +
          '<span class="lg"><i class="kind doc off"></i>офиц. документ</span><span class="lg"><i class="kind gate"></i>проверка</span>' +
          '<span class="lg"><i class="kind gate g-fork"></i>развилка сценария</span>' +
          '<span class="lg" id="flLgExt" hidden><i class="kind work ext"></i>ждём внешнюю сторону</span>' +
          '<span class="lg" title="Шаг начнётся, когда готовы все входы">' + GW_SVG.and + 'ждём все</span>' +
          '<span class="lg" title="Хватает любого из входов; сюда же приходят возвраты на доработку">' + GW_SVG.or + 'хватает любого</span>' +
          '<span class="lg"><i class="sw spawn"></i>запуск по ходу</span><span class="lg"><i class="sw ret"></i>возврат</span>' +
          '<span class="lg"><i class="bd"></i>не начат</span><span class="lg"><i class="bd work"></i>в работе</span>' +
          '<span class="lg"><i class="bd done"></i>завершён</span><span class="lg"><i class="bd late"></i>просрочен</span></div></div>';
      ctrl();
      if (typeof cytoscape === 'undefined' || typeof dagre === 'undefined')
        A.$('#cy', root).innerHTML = '<div class="empty-state"><div class="empty-ttl">Не загрузились библиотеки схемы</div><div class="empty-sub">Cytoscape.js и dagre подключаются с cdn.jsdelivr.net — проверьте доступ к нему.</div></div>';
    },
    onData: function () { needBuild = true; st.jumpKey = null; },
    onShow: function (opts) {
      if (opts.focus) { st.sel = [opts.focus]; pendingFocus = opts.focus; if (A.bp() === 's') st.onlyHl = true; }
    },
    onSearchEnter: function (dir) { searchJump(dir); },
    onResize: function () {
      if (!cy || A.S.view !== 'flow') return;
      cy.resize(); drawOverlays();
      // выбранный шаг не должен уйти под панель карточки
      var e = st.sel.length && cy.getElementById(st.sel[0]);
      if (e && e.length) { var rp = e.renderedPosition(); if (rp.x < laneW() || rp.x > cy.width() - 20) cy.animate({ center: { eles: e } }, { duration: 200 }); }
    },
    render: function () {
      if (typeof cytoscape === 'undefined' || typeof dagre === 'undefined') return;
      if (queued) return;
      queued = true;
      var busy = A.$('#flBusy', root), heavy = needBuild || !cy;
      if (heavy) busy.hidden = false;
      // контейнер должен быть видим до построения, иначе у Cytoscape нулевые размеры;
      // при первом построении — сначала показать «Строю схему…», потом считать
      requestAnimationFrame(function () {
        setTimeout(function () {
          queued = false;
          if (A.S.view !== 'flow') { busy.hidden = true; return; }
          if (needBuild || !cy) build(); else cy.resize();
          // телефон: сразу окружение текущего шага, а не вся схема шириной 12 000 px
          if (A.bp() === 's' && !st.phoneInit) {
            st.phoneInit = true;
            if (!st.sel.length) { var sd = seedNode(); if (sd) st.sel = [sd]; }
            if (st.sel.length) st.onlyHl = true;
          }
          A.$('#flLgExt', root).hidden = !A.S.data.meta.extColumn;
          if (!A.S.f.q) A.$('#flFind', root).hidden = true;
          apply();
          busy.hidden = true;
        }, heavy ? 16 : 0);
      });
    }
  });
})();
</script>

  <script>
/* ═══ js_load: активность участников во времени (тепловая карта) ═══
   Показатель — число процессов, интервал которых пересекается с периодом.
   Трудоёмкости и численности в таблице нет, поэтому это не загрузка людей,
   а относительная плотность работ. Процесс считается у одного участника —
   у того, кто указан ответственным в таблице. */
(function () {
  'use strict';
  var A = App, M = App.M, D = App.D, esc = App.esc;
  var root, pick = null;
  var st = {
    step: A.prefs.get('ldStep', 'month'),
    src: A.prefs.get('ldSrc', 'mix'),
    cyclic: A.prefs.get('ldCyc', true),
    from: null, to: null
  };
  var STEPS = [['week', 'Недели'], ['month', 'Месяцы'], ['quarter', 'Кварталы']];
  var PERIOD_NAME = { week: 'неделя', month: 'месяц', quarter: 'квартал' };

  function items() {
    // ожидание ответа внешней стороны — не работа команды: в плотность не входит
    return M.filtered().filter(function (n) { return n.cls === 'work' && !n.extWait && (st.cyclic || !n.cyclic); })
      .map(function (n) { var iv = M.interval(n, st.src); return iv ? { n: n, s: iv[0], e: iv[1] } : { n: n, s: null }; });
  }

  function render() {
    var all = items(), dated = all.filter(function (x) { return x.s; }), undated = all.length - dated.length;
    var lo = null, hi = null;
    dated.forEach(function (x) { if (!lo || x.s < lo) lo = x.s; if (!hi || x.e > hi) hi = x.e; });
    if (!st.from || !st.to) { st.from = lo; st.to = hi; }
    drawCtrl(lo, hi);
    var body = A.$('#ldBody', root);

    if (!dated.length) {
      body.innerHTML = '<div class="empty-state"><div class="empty-ico">▦</div><div class="empty-ttl">Нет процессов с датами</div>' +
        '<div class="empty-sub">Для расчёта нужны даты начала и окончания процессов' + (all.length ? ' — у отобранных процессов (' + all.length + ') их нет.' : '. Фильтры не оставили ни одного процесса.') + '</div></div>';
      A.setStatus('Процессов без дат: ' + undated, ''); return;
    }

    var from = st.from < st.to ? st.from : st.to, to = st.to > st.from ? st.to : st.from;
    var per = M.periods(from, to, st.step);
    var owners = A.S.data.dicts.owners.filter(function (o) { return dated.some(function (x) { return x.n.owner === o; }); });
    if (dated.some(function (x) { return !x.n.owner; })) owners.push('—');

    // Матрица: участник × период -> список процессов
    var grid = {}, tot = per.map(function () { return []; }), max = 0;
    owners.forEach(function (o) { grid[o] = per.map(function () { return []; }); });
    dated.forEach(function (x) {
      var o = x.n.owner || '—';
      per.forEach(function (p, i) {
        if (x.s < p.end && x.e >= p.start) { grid[o][i].push(x); tot[i].push(x); }
      });
    });
    owners.forEach(function (o) { grid[o].forEach(function (c) { if (c.length > max) max = c.length; }); });
    var lvl = function (v) { return v ? Math.max(1, Math.min(6, Math.ceil(v / max * 6))) : 0; };

    // Шапка: ярус года (или месяца для недель) и ярус периодов
    var grpKey = st.step === 'week' ? 'month' : 'year';
    var spans = [];
    per.forEach(function (p) {
      var k = p[grpKey], last = spans[spans.length - 1];
      if (last && last.k === k) last.n++; else spans.push({ k: k, n: 1 });
    });
    var MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    var nowI = per.findIndex(function (p) { return A.S.asOf >= p.start && A.S.asOf < p.end; });
    var head = '<thead><tr class="yr"><th class="rh"></th>' + spans.map(function (s) {
      var lab = grpKey === 'month' ? MON[+s.k.slice(5) - 1] + ' ' + s.k.slice(0, 4) : s.k;
      return '<th colspan="' + s.n + '">' + (s.n > 1 || grpKey === 'year' ? lab : '') + '</th>';
    }).join('') + '</tr><tr class="pr"><th class="rh">Участник <span style="font-weight:400">· пик</span></th>' +
      per.map(function (p, i) { return '<th class="' + (i === nowI ? 'now' : '') + '">' + esc(p.label) + '</th>'; }).join('') + '</tr></thead>';

    var rows = owners.map(function (o) {
      var peak = Math.max.apply(null, grid[o].map(function (c) { return c.length; }));
      return '<tr><td class="rh" title="' + esc(o) + '"><span class="mx">' + peak + '</span>' + esc(o) + '</td>' +
        grid[o].map(function (c, i) {
          var on = pick && pick.o === o && pick.i === i ? ' on' : '';
          return '<td class="c' + (i === nowI ? ' now-c' : '') + '"><i class="l' + lvl(c.length) + (c.length ? '' : ' z') + on + '" data-o="' + esc(o) + '" data-i="' + i + '">' + (c.length || '') + '</i></td>';
        }).join('') + '</tr>';
    }).join('');
    rows += '<tr class="tot"><td class="rh">Все участники</td>' + tot.map(function (c, i) {
      return '<td class="c' + (i === nowI ? ' now-c' : '') + '"><i data-o="" data-i="' + i + '"' + (c.length ? '' : ' class="z"') + '>' + (c.length || '') + '</i></td>';
    }).join('') + '</tr>';

    var legend = '<div class="hm-legend">меньше' + [0, 1, 2, 3, 4, 5, 6].map(function (l) {
      return '<i style="background:var(--h' + l + ')"></i>';
    }).join('') + 'больше <span style="margin-left:10px">максимум в ячейке: ' + max + '</span></div>';

    body.innerHTML = '<div class="hm-card"><table class="hm">' + head + '<tbody>' + rows + '</tbody></table></div>' + legend +
      '<div class="ld-list" id="ldList"></div>';

    var card = A.$('.hm-card', body);
    card.addEventListener('mousemove', function (e) {
      var c = e.target.closest('i[data-i]');
      if (!c || c.classList.contains('z')) { A.tip(null); return; }
      var i = +c.dataset.i, o = c.dataset.o, list = o ? grid[o][i] : tot[i], p = per[i];
      A.tip('<b>' + esc(o || 'Все участники') + '</b><br>' + D.fmt(p.start) + ' – ' + D.fmt(D.add(p.end, -1)) +
        '<br>активных процессов: <b>' + list.length + '</b><br><span style="color:var(--ink3)">' +
        list.slice(0, 5).map(function (x) { return esc(x.n.id + ' ' + x.n.name); }).join('<br>') + (list.length > 5 ? '<br>…ещё ' + (list.length - 5) : '') + '</span>', e);
    });
    card.addEventListener('mouseleave', function () { A.tip(null); });
    card.addEventListener('click', function (e) {
      var c = e.target.closest('i[data-i]'); if (!c || c.classList.contains('z')) return;
      pick = { o: c.dataset.o, i: +c.dataset.i };
      render();
    });
    if (pick && per[pick.i]) drawList(pick.o ? grid[pick.o] ? grid[pick.o][pick.i] : [] : tot[pick.i], pick.o, per[pick.i]);
    else pick = null;
    if (nowI > 5 && !card.dataset.sc) card.scrollLeft = Math.max(0, (nowI - 4) * 34);

    var extN = M.filtered().filter(function (n) { return n.cls === 'work' && n.extWait; }).length;
    A.setStatus('Процессов на карте <b>' + dated.length + '</b>' + (undated ? '<span class="sp">·</span>без дат ' + undated : '') + (extN ? '<span class="sp">·</span>ожидание внешней стороны не считается: ' + extN : '') +
      '<span class="sp">·</span>периодов ' + per.length + '<span class="sp">·</span>дата анализа ' + D.fmt(A.S.asOf),
      'Клик по ячейке — список процессов');
  }

  function drawList(list, o, p) {
    var box = A.$('#ldList', root);
    list = list.slice().sort(function (a, b) { return a.s.localeCompare(b.s) || a.n.order - b.n.order; });
    box.innerHTML = '<div class="card"><div class="card-h"><span class="card-t">' + esc(o || 'Все участники') + '</span>' +
      '<span class="card-n">' + PERIOD_NAME[st.step] + ' ' + D.fmt(p.start) + ' – ' + D.fmt(D.add(p.end, -1)) + ' · ' + list.length + ' ' + A.plural(list.length, 'процесс', 'процесса', 'процессов') + '</span>' +
      '<span class="x" title="Закрыть">✕</span></div>' +
      '<table class="dt"><thead><tr><th>ID</th><th>Процесс</th><th>Участник</th><th>Интервал</th><th>Статус</th></tr></thead><tbody>' +
      list.map(function (x) {
        return '<tr data-id="' + esc(x.n.id) + '" class="s-' + x.n.status + (M.time(x.n).late ? ' late' : '') + '"><td class="c-id">' + esc(x.n.id) + '</td><td class="c-name">' + esc(x.n.name) + M.flagsHtml(x.n) + '</td>' +
          '<td class="mute">' + esc(x.n.owner || '') + '</td><td class="c-date">' + D.fmtS(x.s) + ' – ' + D.fmtS(x.e) + '</td><td>' + M.statusHtml(x.n) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    A.$('.x', box).onclick = function () { pick = null; render(); };
    A.$$('tr[data-id]', box).forEach(function (tr) { tr.onclick = function () { A.card.open(tr.dataset.id); }; });
  }

  function drawCtrl(lo, hi) {
    var c = A.$('#ldCtrl', root);
    c.innerHTML =
      '<div class="g-grp"><span class="gl">Шаг:</span> <span class="chips">' + STEPS.map(function (s) { return '<span class="chip' + (st.step === s[0] ? ' on' : '') + '" data-step="' + s[0] + '">' + s[1] + '</span>'; }).join('') + '</span></div>' +
      '<span class="sep"></span>' +
      '<div class="g-grp"><span class="gl">Период:</span> <input type="date" id="ldFrom" value="' + (st.from || '') + '"> – <input type="date" id="ldTo" value="' + (st.to || '') + '">' +
      (lo ? ' <button class="btn btn-clear" id="ldAll">весь проект</button>' : '') + '</div>' +
      '<span class="sep"></span>' +
      '<div class="g-grp"><span class="gl">Даты:</span> <span class="chips"><span class="chip' + (st.src === 'mix' ? ' on' : '') + '" data-src="mix" title="Где есть факт — по факту, иначе по прогнозу">факт, иначе прогноз</span>' +
      '<span class="chip' + (st.src === 'fc' ? ' on' : '') + '" data-src="fc">только прогноз</span></span></div>' +
      '<label class="ck" title="Регулярные процессы растянуты на весь цикл и поднимают счёт"><input type="checkbox" id="ldCyc"' + (st.cyclic ? ' checked' : '') + '>учитывать циклические</label>';
    A.$$('[data-step]', c).forEach(function (e) { e.onclick = function () { st.step = e.dataset.step; A.prefs.set('ldStep', st.step); pick = null; render(); }; });
    A.$$('[data-src]', c).forEach(function (e) { e.onclick = function () { st.src = e.dataset.src; A.prefs.set('ldSrc', st.src); pick = null; render(); }; });
    A.$('#ldCyc', c).onchange = function (e) { st.cyclic = e.target.checked; A.prefs.set('ldCyc', st.cyclic); render(); };
    A.$('#ldFrom', c).onchange = function (e) { if (e.target.value) { st.from = e.target.value; pick = null; render(); } };
    A.$('#ldTo', c).onchange = function (e) { if (e.target.value) { st.to = e.target.value; pick = null; render(); } };
    var all = A.$('#ldAll', c); if (all) all.onclick = function () { st.from = lo; st.to = hi; pick = null; render(); };
  }

  A.register('load', 'Загрузка', {
    init: function (el) {
      root = el;
      root.innerHTML = '<div class="ld-wrap">' +
        '<div class="ld-note" id="ldNote"><b>Что показывает карта.</b> Число процессов, у которых интервал выполнения пересекается с периодом, по ответственному участнику. ' +
        '<span class="more">Это плотность работ, а не загрузка людей: трудоёмкости, численности и долей участия в таблице нет, поэтому простой и сложный процесс весят одинаково. ' +
        'Документы, шлюзы и шаги, где ждём ответа внешней стороны (ведомства), не считаются.</span> <span class="more-btn">Не загрузка людей — почему?</span></div>' +
        '<div class="ld-ctrl" id="ldCtrl"></div><div id="ldBody"></div></div>';
      A.$('#ldNote .more-btn', root).onclick = function () { A.$('#ldNote', root).classList.add('open'); };
    },
    render: render
  });
})();
</script>

  <script>
/* ═══ js_help: подсказка «?» — что показывает текущий вид и что значат его термины ═══
   Тексты интерфейса, не данные проекта: имена шагов и участников сюда не попадают. */
App.help = (function () {
  'use strict';
  var A = App, esc = App.esc;

  var TERMS = {
    asof: ['Дата анализа', 'На какую дату считать просрочку и «текущие» шаги. По умолчанию — сегодня; поле в шапке.'],
    late: ['Просрочено', 'Прогнозное начало прошло, а факта начала нет, или прогнозное окончание прошло, а шаг не завершён.'],
    ready: ['Можно начинать', 'Все нужные входы готовы, а факта начала нет.'],
    decide: ['Ждут решения', 'Входы шлюза готовы, а решение не отмечено.'],
    baseline: ['Базовый план и сдвиг', 'Зафиксированная версия плановых дат. Сдвиг — насколько окончание сейчас позже (+) или раньше (−) окончания по плану.'],
    changes: ['Что изменилось', 'Сравнение с состоянием на начало выбранного дня. История пишется раз в день в скрытый лист «_История».'],
    ext: ['Ждём внешнюю сторону', 'Шаг, где документы поданы, например, в ведомство, и ждём ответа в официальный срок. В «Загрузке» не считается.'],
    nbh: ['Окружение', 'Шаги, связанные с выбранным: на сколько шагов по связям раскрывать — ползунок «Окружение», направление — ↔ ← →.'],
    fork: ['Развилка сценария', 'Шлюз, после которого выполнится только одна ветка. Ветка берётся из «Решения», иначе — по умолчанию.'],
    check: ['Проверка', 'Согласование с исходом «да / нет»: «нет» возвращает работу на доработку. Ветки не раздваивают план.'],
    ret: ['Возврат', 'Связь назад — повторная работа после замечаний. На первый старт не влияет, рисуется пунктиром.'],
    off: ['Вне сценария', 'Шаги на невыбранных ветках развилок. Их видно в режиме «Все ветки».'],
    gw: ['«+» и «○»', '«+» — шаг ждёт все входы, «○» — хватает любого. Правило — из столбца «Ожидание входов».'],
    spawn: ['Запуск по ходу', 'Шаг цикла стартует, пока идёт процесс-хозяин, а не после его окончания.'],
    cycle: ['Шаг цикла', 'Повторяется внутри процесса-хозяина и живёт в его окне дат.'],
    out: ['Выход процесса ↳', 'Документ, который получается в результате ближайшего процесса выше по связям.'],
    fc: ['Прогноз и факт', 'Прогноз — даты из таблицы (пунктир), факт — отмеченные даты начала и окончания (сплошная полоса).'],
    dens: ['Плотность работ', 'Сколько процессов идёт у участника в периоде. Это не часы и не загрузка людей: сложный и простой процесс весят одинаково.'],
    forwho: ['Сводка для', 'Та же сводка по одному человеку или роли: что он делает, что от него ждут, кого он ждёт.'],
    roles: ['Смотреть как', 'Приложение глазами участника: что он видит и может отметить. Уровень — столбец «Доступ» в листе «Команда»: Руководитель, Команда, Исполнитель, Инвестор. По личной ссылке сервер отдаёт человеку только положенное его уровню и проверяет каждую запись.'],
    waits: ['Жду от других', 'Ваши шаги, которые не могут начаться, пока не готовы чужие входы. Рядом — чьи и в каком они состоянии.'],
    waitme: ['От вас ждут', 'Чужие шаги, которые стоят из-за вашего: их входы — ваш результат.'],
    risk: ['Главные риски', 'Просроченные шаги и документы; сверху те, от которых зависит больше всего следующих шагов.']
  };

  var VIEWS = {
    summary: { t: 'Сводка', p: ['Утренний срез проекта на дату анализа: что в работе, что горит, что можно начинать, какие решения ждут.',
      'Учитывает общие фильтры и сценарий. Клик по строке — карточка, по плашке или стадии — таблица с этим фильтром.'],
      k: ['late', 'ready', 'decide', 'baseline', 'changes', 'ext', 'forwho', 'roles'] },
    table: { t: 'Таблица', p: ['Все шаги листа «БД». «Структура» — порядок по связям: развилки раскрыты колонками веток, шаги цикла вложены под процесс.',
      '«Список» — плоская таблица с сортировкой по клику на заголовок и группировкой.'],
      k: ['fork', 'check', 'ret', 'off', 'out', 'baseline'] },
    gantt: { t: 'Гант', p: ['Пунктир — прогноз из таблицы, сплошная полоса — факт, тонкая тёмная линия над ними — базовый план. Документы и шлюзы — ромбы-вехи.',
      'Красная вертикаль — дата анализа. Уровни «Структуры» общие с таблицей.'],
      k: ['fc', 'baseline', 'cycle', 'out', 'ext', 'asof'] },
    flow: { t: 'Схема', p: ['Блок-схема по листу «Связи». Дорожки — участники, полоса сверху — стадии: клик переносит к началу стадии.',
      'Клик по шагу подсвечивает его окружение, двойной клик — карточка. Enter в поиске — к следующему найденному, Shift+Enter — к предыдущему.'],
      k: ['nbh', 'fork', 'check', 'gw', 'ret', 'spawn'] },
    mine: { t: 'Мои задачи', p: ['Только шаги вашей роли: что делаете, что можно начинать, какие решения ждут вас, кого вы ждёте, что дальше по плану.',
      'Кнопки в строке — отметить сразу, без карточки: «Начал сегодня», «Завершил сегодня», «Подали сегодня». В уведомлении есть «Отменить».'],
      k: ['ready', 'waits', 'waitme', 'decide', 'late', 'roles'] },
    brief: { t: 'Обзор', p: ['Одна страница о проекте: стадии, ключевые результаты и их сдвиг от базового плана, главные риски, решения, вехи на 60 дней.',
      'Для инвестора и отчёта: без фильтров и терминов модели. Кнопка «Печать» — на бумагу или в PDF.'],
      k: ['baseline', 'risk', 'decide', 'roles'] },
    load: { t: 'Загрузка', p: ['Сколько процессов идёт у каждого участника в каждом периоде. Клик по ячейке — список процессов.',
      'Документы, шлюзы и ожидание ответа внешней стороны не считаются.'],
      k: ['dens', 'ext', 'cycle'] }
  };

  var openFor = null, all = false;
  function pop() { return A.$('#helpPop'); }
  function draw(view) {
    var v = VIEWS[view] || VIEWS.summary, el = pop();
    var keys = all ? Object.keys(TERMS) : v.k;
    el.innerHTML = '<div class="hp-h"><span class="hp-t">' + esc(v.t) + '</span><button class="hp-x" type="button" title="Закрыть (Esc)">✕</button></div>' +
      v.p.map(function (s) { return '<p>' + esc(s) + '</p>'; }).join('') +
      '<dl>' + keys.map(function (k) { return '<dt>' + esc(TERMS[k][0]) + '</dt><dd>' + esc(TERMS[k][1]) + '</dd>'; }).join('') + '</dl>' +
      '<button class="hp-all" type="button">' + (all ? 'Только термины этого вида' : 'Все термины') + '</button>';
    A.$('.hp-x', el).onclick = close;
    A.$('.hp-all', el).onclick = function (e) { e.stopPropagation(); all = !all; draw(view); };
  }
  function place(btn) {
    var el = pop(), r = btn.getBoundingClientRect();
    el.style.top = Math.round(r.bottom + 6) + 'px';
    el.style.maxHeight = Math.max(200, innerHeight - r.bottom - 18) + 'px';
    var w = el.offsetWidth;
    el.style.left = Math.round(Math.max(8, Math.min(r.right - w, innerWidth - w - 8))) + 'px';
  }
  function toggle(view, btn) {
    if (openFor === view && !pop().hidden) { close(); return; }
    openFor = view; all = false;
    pop().hidden = false; draw(view); place(btn || A.$('#btnHelp'));
    A.$('#btnHelp').classList.add('on');
  }
  function close() { var el = pop(); if (!el || el.hidden) return; el.hidden = true; openFor = null; A.$('#btnHelp').classList.remove('on'); }
  function isOpen() { var el = pop(); return !!el && !el.hidden; }

  return { toggle: toggle, close: close, isOpen: isOpen, TERMS: TERMS };
})();
</script>

  <script>App.boot();</script>
</body>
</html>
